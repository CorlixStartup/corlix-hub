-atenção-achados-na-criação-das-fichas).\n\n## Regras de ouro (resumo do 08)\n1. **Proibido modificar** `corlixhub/`, `backups/`, `pen_dev/` e `scripts/`: são só leitura; a app muda pelo Builder e o agente escreve guias e docs. Nunca edite `database/f100.sql`.\n2. Use pt-BR em tudo e Conventional Commits. Toda alteração vai numa branch `feature/<assunto>` (funcionalidade nova) ou `fix/<assunto>` (as demais), com PR para `DEV` e depois `DEV` → `PROD` (ver 08 §1, regra 13).\n3. Toda query de negócio deve filtrar por `id_empresa`, e toda página administrativa precisa de `authorizationScheme` na própria página.\n4. Gere links com checksum (`apex_page.get_url`).\n5. Quando o time alterar um `.css`, o `.min.css` muda junto e arquivos novos entram em `static-files.apx` (o agente indica isso no guia; não edita `corlixhub/`).\n6. Se o README raiz divergir do código, confie no código. O que não estiver confirmado, pergunte ao time (ex.: o ambiente atual, já que `docker-compose.yml` foi apagado, e os dados reais do banco).\n7. Ao mudar páginas, schema, tema ou módulos, **atualize o documento correspondente nesta pasta**.\n8. Passo a passo do Builder sempre para o **APEX 26.1.5**: caminho não conferido vai marcado \"(confirmar no 26.1.5)\"; se não existir, peça print em vez de chutar (ver 08 §1, regra 11).\n9. **Todo protótipo está em `pen_dev/`** (PNGs das telas-alvo do pen.dev, descritas no 07). Procure lá primeiro; se a tela não existir, pergunte (ver 08 §1, regra 12).\n\n10. Antes de criar ou alterar páginas, siga o [11 · Padrões de páginas](./11-padroes-de-paginas.md) e registre as referências. Sair do padrão exige evidência para o 26.1.5 e aprovação do time (08 §1, regra 14).\n\n11. Ao encerrar cada tarefa ou módulo, documente resultados, evidências e pendências em registro versionado (08 §1, regra 15); a resposta final não substitui esse registro.\n"}, {"arquivo": "01-arquitetura-e-ambiente.md", "titulo": "01 · Arquitetura, ambiente e fluxo de trabalho", "md": "# 01 · Arquitetura, ambiente e fluxo de trabalho\n\n> Parte do pacote de contexto para IAs (`docs/ai-context/`). Comece pelo [`README.md`](./README.md) desta pasta.\n> Gerado a partir da inspeção dos arquivos em 06/10/2026 (branch `DEV`, HEAD `bac2d69`).\n\n## 1. O que é o Corlix Hub\n\n- Intranet corporativa SaaS para **PMEs**: gestão de colaboradores, organograma, histórico de carreira, comunicação interna (comunicados, chat, notificações), equipes e cadastro multiempresa.\n- Projeto acadêmico do **Enterprise Challenge (StartupOne) — FIAP, turma 4ESOA, 2026**. Tech lead: Sarah Ribeiro da Silva.\n- Slogan: *\"Core logic, smart solutions.\"*\n- Idioma de toda a UI, código, comentários e documentação: **português do Brasil**.\n\n## 2. Stack\n\n| Camada | Tecnologia | Observação |\n|---|---|---|\n| App / UI | **Oracle APEX 26.1** (release 26.1.5), Universal Theme (visual Redwood Light) | App ID `100`, alias `CORLIXHUB`, nome \"Corlix Hub\" |\n| Banco | **Oracle Database 23ai Free** (`23.26.1.0`) | Schema/workspace `WKSP_CORLIXHUB`, PDB `FREEPDB1` |\n| HTTP | **ORDS 25.4.0** | Serve o APEX |\n| Dev local | Docker Compose (`db` + `ords`) | ⚠️ ver §5 — `docker-compose.yml` está deletado no working tree |\n| Lógica | SQL + PL/SQL (packages, views, triggers) | Nenhum backend fora do banco |\n| Front custom | CSS (`corlix-tema.css`, `custom.css`, CSS de módulos) + JS vanilla/jQuery do APEX (`apex.*`) | Sem bundler, sem `package.json` |\n\nNão existe Node, Java, Python etc. no projeto. Toda regra de negócio vive no banco (PL/SQL) ou nas definições declarativas do APEX.\n\n## 3. Mapa do repositório\n\n```\nCorlixHub/\n├── README.md                  # README humano (⚠️ parcialmente desatualizado — ver §6)\n├── CLAUDE.md / AGENTS.md      # Ponteiros para esta documentação (para agentes de IA)\n├── docs/ai-context/           # ESTA documentação para IAs\n├── corlixhub/                 # ★ CÓDIGO-FONTE DA APP APEX em formato APEXlang (.apx)\n│   ├── application.apx        #   definição global da app (auth, CSS globais, menu, error handler)\n│   ├── page-groups.apx        #   grupo \"Administration\"\n│   ├── .apex/apexlang.json    #   versão do formato (mmdVersion 26.1.0+3102)\n│   ├── deployments/default.json  # app id 100, debugging true\n│   ├── supporting-objects/    #   supporting objects (incluídos no export, vazios)\n│   ├── pages/pNNNNN-<nome>.apx   # 1 arquivo por página (19 páginas)\n│   └── shared-components/     #   roles, authorizations, app items/processes, lists, LOVs, breadcrumbs,\n│       ├── static-files.apx   #   registro dos arquivos estáticos (#APP_FILES#)\n│       ├── static-files/      #   CSS do tema, ícones PWA, default-user.jpeg, \"Fotos Colaboradores/\" (~291 fotos fictícias)\n│       └── themes/universal-theme/  # templates customizados (page/region/report/button)\n├── database/\n│   └── f100.sql               # Export SQL clássico (single-file) da app 100 — 12 MB, ~63k linhas.\n│                              #   É a MESMA app de corlixhub/, em outro formato. NÃO contém DDL das tabelas.\n├── modulos/                   # Módulos de feature desenvolvidos fora do Builder (SQL/CSS/JS + guias \"Etapas-*.md\")\n│   ├── organograma/           #   vw_org_colaborador, pkg_organograma, organograma.css/js, PNGs de redesign\n│   ├── historico-carreira/    #   (untracked) DDL completo + packages + views + triggers + testes + CSS/JS\n│   └── tema/                  #   (untracked) guia de aplicação do tema visual nas páginas\n├── pen_dev/                   # (untracked) ~28 PNGs com o design-alvo das telas\n├── scripts/\n│   ├── setup.sh / setup.ps1   # setup do ambiente Docker (macOS/Linux e Windows)\n│   ├── git-hooks/commit-msg   # valida Conventional Commits\n│   ├── apex-sessao-timeouts.sql      # lê/ajusta timeouts de sessão do workspace (ver 10 §8)\n│   ├── extensao-cookies-apex/ # extensão local do Chrome contra o 400 de cookies (ver 10 §9)\n│   ├── apex-limpar-sql-scripts.sql  # apaga SQL Scripts do workspace (dry-run por padrão)\n│   ├── backup/                # pipeline de backup (SQLcl + Jenkins): app, DDL e dados\n│   └── busca-casos/           # busca de casos/erros e da doc oficial do APEX para agentes de IA (Elasticsearch, ver §8.2)\n└── .github/workflows/ci.yml   # CI: valida docker-compose, gitleaks, bloqueia pastas proibidas\n```\n\n## 4. Dois formatos da mesma aplicação\n\n| | `corlixhub/` (APEXlang) | `database/f100.sql` |\n|---|---|---|\n| Formato | Declarativo, legível, 1 arquivo por página/componente | `wwv_flow_imp*` PL/SQL gerado, single file |\n| Uso por IA | **Leia e edite aqui.** Diffs pequenos, revisáveis | Só para grep/consulta; não editar à mão (Oracle não suporta) |\n| Arquivos estáticos | Arquivos reais em `static-files/` | Embutidos em hex (~301 blocos `shared_components/files`) |\n| Instalação | Import/sync via ferramentas APEXlang/SQLcl do APEX 26.1 | `@database/f100.sql` no SQLcl conectado como `WKSP_CORLIXHUB` |\n\nAo alterar a app no Builder, reexporte para **ambos** (ou combine com o time qual é a fonte de verdade — hoje, na prática, `corlixhub/` é a fonte principal e `f100.sql` é um snapshot). O export de `f100.sql` mais recente é de 04/10/2026 01:10, exportado por `SARAHSILVA`.\n\nContagens do export (cabeçalho de `f100.sql`): 19 páginas, 54 itens, 48 regiões, 15 processos, 17 botões, 8 dynamic actions, 1 validação; shared: 5 app items, 4 app processes, 2 lists, 1 breadcrumb (12 entradas), 1 authentication, 3 authorizations, 3 ACL roles, 4 LOVs, 1 tema com templates customizados (1 page, 1 region, 1 button, 2 report).\n\n## 5. Ambiente de desenvolvimento\n\n### 5.1 Docker (histórico — arquivos deletados no working tree)\n\nNo commit `HEAD` existiam `docker-compose.yml` e `.env.example`; **ambos aparecem como deletados (não commitado)** no `git status` atual. Conteúdo do `HEAD`:\n\n```yaml\nservices:\n  db:\n    image: container-registry.oracle.com/database/free:23.26.1.0\n    hostname: database\n    ports: [\"${DB_HOST_PORT:-1522}:1521\"]\n    environment: [ORACLE_PWD=${ORACLE_PWD:-pwd}, DBHOST=database]\n    volumes: [./oracle_oradata/:/opt/oracle/oradata, ./apex/:/opt/oracle/apex]\n  ords:\n    image: container-registry.oracle.com/database/ords:25.4.0\n    ports: [\"${ORDS_HOST_PORT:-8081}:8080\"]\n    environment: [DBHOST=database, DBPORT=1521, DBSERVICENAME=FREEPDB1, ORACLE_PWD=..., APEX_PWD=...]\n    volumes: [./ords_config/:/etc/ords/config, ./apex/:/opt/oracle/apex]\n    depends_on: { db: { condition: service_healthy } }\n```\n\nVariáveis: `ORACLE_PWD`, `APEX_PWD`, `DB_HOST_PORT=1522`, `ORDS_HOST_PORT=8081`.\nURLs locais: Builder `http://localhost:8081/ords`; app `http://localhost:8081/ords/r/wksp_corlixhub/corlixhub` (não confirmado).\n\n⚠️ **Consequências se essa deleção for commitada:** o job `validate` do CI passou a ignorar a validação quando o arquivo não existe; `scripts/setup.*` também passam a não funcionar. Pergunte ao time antes de assumir qual é o ambiente atual (possivelmente migraram para uma instância APEX hospedada/OCI ou outra forma de rodar).\n\n### 5.1.1 APEX no Autonomous (OCI)\nO desenvolvimento acontece no APEX do Autonomous Database da OCI (`https://<id>.adb.<região>.oraclecloudapps.com/ords/...`). Depois de longas sessões, o proxy da Oracle pode responder `400 Request Header Or Cookie Too Large`. Causa e solução estão em [`10-erro-400-cookies.md`](./10-erro-400-cookies.md).\n\n### 5.2 Pastas que nunca vão para o Git\n`apex/` (distribuição Oracle ~1,1 GB), `META-INF/`, `oracle_oradata/` (datafiles), `ords_config/` (contém wallet e chave TLS), `.env*` (exceto `.env.example`), `*.log`, `.DS_Store`. O CI bloqueia `apex/`, `oracle_oradata/`, `ords_config/`, `META-INF/`.\n\n### 5.3 Instalando o banco de uma feature\nO DDL dos objetos de banco \"core\" (`COLABORADOR`, `CARGO`, `DEPARTAMENTO`, `EMPRESA`, `COMUNICADO`, equipes, chat, logs…) está em `database/corlix-hub.sql`, um snapshot só de estrutura, sem dados (o README cita `database/ddl/` e `database/seed/`, que não existem). Os módulos trazem seus próprios scripts:\n- Histórico de carreira: `modulos/historico-carreira/instalar.sql` (roda `00_…` a `07_…` em ordem).\n- Organograma: `modulos/organograma/organograma.sql`.\nDetalhes em [`05-banco-de-dados.md`](./05-banco-de-dados.md) e [`06-modulos.md`](./06-modulos.md).\n\n## 6. Divergências README × realidade (importante para IAs)\n\n| README diz | Realidade no repo |\n|---|---|\n| App exportada em `f100/application/pages/*.sql` + `f100/install.sql` | App está em `corlixhub/` (APEXlang `.apx`) e `database/f100.sql` (single file) |\n| `database/ddl/schema_corlixhub.sql` e `database/seed/seed_corlixhub.sql` | Não existem. `database/ddl/` agora é gerada pelo backup (`01-tipos.sql` … `11-sinonimos.sql`, ver §8.1); não há seed |\n| \"Não há packages PL/SQL próprios\" | Existem `pkg_historico_carreira`, `pkg_historico_carreira_ui`, `pkg_organograma`; a app usa `log_pkg.apex_error_handler` |\n| \"Não há testes\" | Existe `modulos/historico-carreira/07_testes.sql` |\n| `docs/` não existe | Agora existe `docs/ai-context/` |\n| Repo sem commits/remote | Remote `https://github.com/CorlixStartup/corlix-hub.git`; branches remotas `DEV` (HEAD), `UAT`, `PROD`, `main`, `feature/cadastro-empresas`; PR #1 mergeado |\n| Seis entidades: Empresa, Colaborador, Cargo, Departamento, Movimentacao_Carreira, Comunicado | `MOVIMENTACAO_CARREIRA` existe no banco como tabela legada, sem uso; o módulo novo a substitui por `HISTORICO_CARREIRA` + `TIPO_MOVIMENTACAO`; há também equipes, chat, logs, presença etc. |\n\nQuando o README e o código discordarem, **confie no código** e sinalize a divergência.\n\n## 7. Git, branches e commits\n\n- Branches permanentes: `DEV` (integração, padrão para PRs) → `UAT` (homologação) → `PROD`. Auxiliares: `feature/*`, `fix/*` (de `DEV`; ver 08 §1, regra 13), `hotfix/*` (de `PROD`, depois replicado para UAT e DEV), `release/*` opcional.\n- Nunca commit direto em `DEV`/`UAT`/`PROD`; sempre PR.\n- **Conventional Commits** validado por `scripts/git-hooks/commit-msg` (ativar com `git config core.hooksPath scripts/git-hooks`). Regex:\n  `^(feat|fix|hotfix|refactor|test|docs|chore|build|ci|perf)(\\([a-z0-9_-]+\\))?!?: .{1,100}$`\n  Ex.: `feat(organograma): adiciona drawer de detalhes da pessoa`. (Obs.: o último commit `feature: …` não segue o padrão — o hook provavelmente não estava ativo.)\n- `.gitattributes`: LF para tudo (`.sql`, `.sh`, `.md`, `.yml`), CRLF para `.ps1/.bat/.cmd`; imagens binárias.\n\n## 8. CI (`.github/workflows/ci.yml`)\nRoda em PR/push para `DEV`, `UAT`, `PROD`:\n1. `validate` — `docker compose config` só se existir `docker-compose.yml`; sem o arquivo, emite um aviso e passa.\n2. `secret-scan` — gitleaks 8.28.0 (CLI OSS) sobre todo o histórico.\n3. `forbidden-paths` — falha se `apex/`, `oracle_oradata/`, `ords_config/` ou `META-INF/` existirem.\nNão há deploy automatizado nem testes automatizados no CI.\n\n## 8.1 Backup (`scripts/backup/`)\nJob Jenkins diário (02h, America/Sao_Paulo) que conecta no Autonomous Database (OCI) pelo SQLcl, com wallet, como o dono do schema, e gera um `.tar.gz` por ambiente com:\n- a app em APEXlang e em SQL (com checksum SHA-256);\n- usuários e grupos do workspace;\n- o DDL do schema (`dbms_metadata`, sem schema/tablespace, um arquivo por tipo);\n- um CSV por tabela, com BLOBs em base64.\n\nOs backups ficam como artefatos do Jenkins (30 dias) e nunca vão para o Git (`/backups/` no `.gitignore`), porque contêm dados pessoais. O `backup.sh` também roda local, e `scripts/backup/jenkins/` tem um `docker-compose.yml` que sobe um Jenkins local para testar o pipeline, copia cada `.tar.gz` para `backups/<ambiente>/` do projeto e, com `scripts/backup/extrair-no-projeto.sh`, atualiza `corlixhub/`, `database/f100.sql` e `database/ddl/` (pulando destinos com alterações não commitadas) e põe os CSVs em `database/dados/backup/` (ignorado pelo Git) (o compose fica fora da raiz, então o job `validate` do CI não o valida). Com o parâmetro `PUBLICAR_GIT` (padrão), o stage *Publicar no Git* roda `scripts/backup/publicar-no-git.sh`: clona a `DEV`, extrai o backup de `PRD` nela, commita só `corlixhub/`, `database/f100.sql` e `database/ddl/` com a mensagem `chore(backup): Backup - Corlix Hub - dd/MM/yyyy as HH:mm` (horário de Brasília; commit vazio se nada mudou), faz push e abre PR `DEV` → `PROD` se não houver um aberto; nesse modo a extração na pasta local do projeto é pulada. Usa a credencial `corlixhub-github` (usuário + token do GitHub). Referência (conteúdo, variáveis, restauração) em [`scripts/backup/README.md`](../../scripts/backup/README.md); passo a passo da configuração, com erros comuns, em [`scripts/backup/Etapas-backup.md`](../../scripts/backup/Etapas-backup.md).\n\n## 8.2 Busca de casos para agentes de IA (`scripts/busca-casos/`)\nÍndice Elasticsearch (`corlix-casos`) com os casos já ocorridos: entradas Sintoma/Causa/Correção do 09, seções do 10 e cada linha das tabelas \"Se não funcionar\"/\"Problemas comuns\" dos `modulos/*/Etapas-*.md`, além das demais seções da documentação (tipo `doc`, peso menor). Analisador pt-BR (sem acento, radical, stopwords sem o \"não\"), sinônimos, tolerância a erros de digitação e peso extra para códigos (`ORA-01403`, `-20012`) e identificadores (`P13_…`, `PKG_…`).\n- Subir: `docker compose -f scripts/busca-casos/docker-compose.yml up -d` (Elasticsearch 8.15.3, nó único, sem segurança, só em `127.0.0.1:9200`; fora da raiz, então o job `validate` do CI não o valida).\n- Indexar: `python3 scripts/busca-casos/casos.py indexar` (recria o índice; rode de novo quando um `.md` mudar).\n- Buscar: `python3 scripts/busca-casos/casos.py buscar \"<texto>\" [-n 5] [--tipo caso|doc] [--modulo …] [--json]`. Sem Elasticsearch, cai num modo offline menos preciso e avisa.\n- Documentação oficial do APEX 26.1: `apex_docs.py baixar` (zip oficial, ~325 MB) → `extrair` (3.340 páginas em Markdown em `.cache/apex-docs/md/`, fora do Git) → `indexar` (índice `apex-docs`, analisador inglês, ~7.300 trechos com o link oficial). Buscar com `casos.py buscar \"…\" --fonte apex|todas`. A síntese em pt-BR fica em `docs/apex-26.1/` e entra no índice `corlix-casos` (`--modulo apex-26.1`).\nDetalhes em [`scripts/busca-casos/README.md`](../../scripts/busca-casos/README.md).\n\n## 9. Estado do working tree no momento desta documentação\nModificados (não commitados): `application.apx`, páginas 1, 4, 14, 16, 27, `static-files.apx`, `custom.css/.min.css`, `database/f100.sql`, arquivos de `modulos/organograma/`.\nNovos (untracked): `corlix-tema.css/.min.css`, `pen_dev/`, `modulos/historico-carreira/`, `modulos/tema/`, PNGs de redesign do organograma, `scripts/apex-limpar-sql-scripts.sql`.\nDeletados: `.env.example`, `docker-compose.yml`.\nOu seja: há um trabalho grande de **redesign visual (tema Corlix)** + **módulo de histórico de carreira** em andamento.\n"}, {"arquivo": "02-paginas.md", "titulo": "02 — Páginas da aplicação (APEX app 100 / CORLIXHUB)", "md": "# 02 — Páginas da aplicação (APEX app 100 / CORLIXHUB)\n\n> Documento de contexto para IA. Fonte: leitura integral de `corlixhub/pages/*.apx` (19 arquivos) + shared components citados (`corlixhub/shared-components/lists.apx`, `breadcrumbs.apx`, `authorizations.apx`, `app-processes.apx`, `app-items.apx`, `lovs.apx`, templates em `corlixhub/shared-components/themes/universal-theme/`). Estado: branch `DEV`, commit `bac2d69` + mudanças não commitadas (ver §5).\n> `database/f100.sql` (export clássico, 12 MB) é equivalente; **não** leia inteiro, use `grep`.\n\n> **Estado atual por página: veja as [fichas das páginas](./paginas/README.md)** (42 páginas, backup de DEV `84f8625`, 13/11/2026). Este documento mantém a **sintaxe APEXlang (§1)**, o mapa de navegação e as descrições históricas de cada página; onde a seção de uma página divergir da ficha ou do `.apx`, a ficha e o `.apx` valem. Divergências já conhecidas: as páginas 34 a 44 existem desde o backup de 10/11/2026; a p17 usa `@/modal-dialog` (não o wizard); a p14 tem criação e edição; o menu tem os grupos Pessoas, Minha carreira e Administração.\n\n---\n\n## 1. Sintaxe APEXlang (`.apx`, mmdVersion 26.1.0) — o que é preciso para editar à mão\n\n### 1.1 Estrutura geral\n- Um arquivo por página: `corlixhub/pages/pNNNNN-<slug>.apx` (número com 5 dígitos; slug pode conter acentos, ex.: `p00008-notificações.apx`, `p00013-histórico-de-carreira.apx`).\n- Blocos de **componente** usam `tipo identificador ( ... )` (parênteses). Blocos de **propriedades agrupadas** usam `grupo { ... }` (chaves). Ex.: `region novo ( ... layout { sequence: 10 } ... )`.\n- Raiz: `page <número> ( name: ... alias: ... title: ... appearance {...} navigation {...} security {...} javaScript {...} css {...} <componentes> )`.\n- Componentes filhos de página: `region`, `pageItem`, `button`, `process`, `dynamicAction` (com `action` filhos), `validation`, `branch` (sem identificador: `branch ( ... )`).\n- Componentes aninhados: `region` de relatório contém `column`; IR contém `savedReport primary ( displayColumn X (...) sort (...) )`; `process type: invokeApi` contém `parameter`; botão com `action: triggerAction` contém `triggerAction <id> (...)`.\n- Valores: escalares sem aspas (`label: Salvar Usuario`), listas com colchetes e um item por linha (`templateOptions: [ #DEFAULT# t-Region--noUI ]`), alvos de link como objeto `target: { page: 16 items: { P16_ID_EMPRESA: \\#ID_EMPRESA#\\ } action: resetPagination }` (note o escape `\\#...#\\` para substituições `#COL#` dentro de valores de item).\n- Código multilinha em blocos cercados com linguagem: ` ```sql `, ` ```plsql `, ` ```html `, ` ```css `, ` ```javascript-browser `. A indentação do bloco é a do campo; o conteúdo é indentado relativo a ele.\n- Comentários `//` aparecem só por acidente (ver bug histórico da Home em §5).\n\n### 1.2 Referências `@`\n- `@identificador` = componente local (região/item/botão da mesma página ou shared component do app). Ex.: `parentRegion: @container-conteudo-principal`, `region: @novo`, `button: @B_VER_TODOS`, `formRegion: @step-1`, `breadcrumb: @breadcrumb`, `lov: @boolean`, `authorizationScheme: @administration-rights`.\n- `@/nome` = template/tema padrão do Universal Theme. Ex.: `pageTemplate: @/standard`, `@/login`, `@/modal-dialog`, `@/wizard-modal-dialog`, `template: @/blank-with-attributes`, `@/title-bar`, `@/interactive-report`, `@/cards-container`, `@/inline-dialog`, `@/tabs-container`, `@/buttons-container`, `@/required-floating`, `@/optional-floating`, `@/hidden`, `buttonTemplate: @/text`, `@/text-with-icon`.\n- `@nome` sem barra para templates **customizados** do app: `@corlix-standard-page` (page template, `themes/universal-theme/page-templates/corlix-standard-page.apx`), `@cards-container-image-first` (region template), `@chat-contatos` e `@chat-mensagens` (classic report templates em `themes/universal-theme/classic-report-templates/`).\n- O identificador do componente (ex.: `region new`, `region novo`, `region step-1`) é independente do `name:` exibido no Builder. Itens usam o próprio nome (`pageItem P14_CARGO`).\n\n### 1.3 Layout / slots\n- `layout { sequence: N slot: <slot> parentRegion: @x region: @x columnSpan: 8 startNewRow: false newColumn: false columnCssClasses: ... alignment: left }`.\n- Slots de página vistos: `body`, `breadcrumbBar`, `contentBody`, `dialogsDrawersAndPopups`, `dialogFooter`, `wizardBody`, `wizardButtons`, `afterLogo`, `afterNavigationBar` (Global Page).\n- Slots dentro de região: `regionBody`, `subRegions`, `tabs` (filhos de tabs-container), `next`, `close`, `delete`, `create`, `edit`, `rightOfInteractiveReportSearchBar` (botões).\n- Itens apontam para região via `layout { region: @r slot: regionBody }`; colunas de form via `source { formRegion: @r column: COL dataType: ... primaryKey: true queryOnly: true }`.\n\n### 1.4 Aparência\n- `appearance { template: @/... templateOptions: [ #DEFAULT# classe1 classe2 ] cssClasses: ... icon: fa-xxx hot: true }`. `#DEFAULT#` = opções padrão do template; demais são classes do UT (`t-Region--noUI`, `t-Region--removeHeader js-removeLandmark`, `t-Button--danger`, `t-Button--iconRight`, ...). Nota: `t-Region--removeHeader js-removeLandmark` ocupa uma única linha (é uma opção composta).\n- `componentAppearance { ... }` = template do componente interno (cards layout, report template, breadcrumb template).\n- `#APP_FILES#` = prefixo de arquivos estáticos do app (`shared-components/static-files/`), ex.: `#APP_FILES#icons/app-icon-512.png`, `#APP_FILES#default-user.jpeg`. `#MIN#` alterna `.min` (usado em `application.apx`: `#APP_FILES#corlix-tema#MIN#.css`).\n- Substituições: `&ITEM.` (session state, ex.: `&G_NOME_USUARIO.`, `&APP_ALIAS.`, `&SESSION.`, `&APP_ID.`), `&COL.` em HTML expressions de Cards, `#COL#` em templates de relatório/HTML expression de colunas IR, `&APP_TEXT$DELETE_MSG!RAW.` (texto de tradução com escape RAW).\n\n### 1.5 Mini exemplo real (Home, botão + DA)\n```\n    button B_VER_TODOS (\n        buttonName: B_VER_TODOS\n        label: Ver todos\n        layout {\n            sequence: 10\n            region: @lista-aniversariantes\n            slot: next\n        }\n        appearance {\n            buttonTemplate: @/text-with-icon\n            templateOptions: [\n                #DEFAULT#\n                t-Button--noUI\n                t-Button--iconRight\n            ]\n            icon: fa-arrow-right\n        }\n        behavior {\n            action: definedByDynamicAction\n        }\n    )\n\n    dynamicAction abrir-popup-aniversariantes (\n        name: Abrir Popup Aniversariantes\n        execution { sequence: 20 }\n        when {\n            event: click\n            selectionType: button\n            button: @B_VER_TODOS\n        }\n        action native-javascript-code (\n            action: openRegion\n            affectedElements {\n                selectionType: region\n                region: @POPUP_ANIVERSARIANTES\n            }\n            execution { sequence: 10 fireOnInit: false }\n        )\n    )\n```\n(No arquivo real cada propriedade fica em sua própria linha; condensei `execution` aqui.)\n\n### 1.6 Outros padrões\n- Processos: `process <id> ( name: type: executeCode|formInitialization|formAutoRowProcessing|closeDialog|clearSessionState|invokeApi  source { plsqlCode: ```plsql``` }  formRegion: @r  execution { sequence: N point: beforeHeader|afterSubmit }  serverSideCondition { type: requestIsContainedInValue value: CREATE,SAVE,DELETE }  successMessage {...}  advanced { executionMappingIdentifier: <número> } )`. O `executionMappingIdentifier` é gerado pelo APEX — preservar ao editar; ao criar um novo, omitir (provavelmente gerado na importação — não verificado).\n- DAs: `when { event: click|ready|keyup|apexafterclosedialog  selectionType: button|items|region|jQuerySelector ... }`, `clientSideCondition { type: itemIsNotNull item: X }`, ações com `execution { fireWhenEventResultIs: false }` = ramo \"falso\". Sem `event:` explícito em DA de itens = evento padrão `change`.\n- Ação servidor: `action: executeServerSideCode settings { plsqlCode: ... itemsToSubmit: X itemsToReturn: Y }`.\n- Validação: `validation <id> ( validation { type: functionBodyReturningBoolean plsqlFunctionBody: ... alwaysExecute: true } error { errorMessage: ... associatedItem: @ITEM } )`.\n- Itens: `type: textField|password|checkbox|switch|selectOne|selectList|popupLov|datePicker|textarea|hidden|imageUpload`; `lov { type: sqlQuery|sharedComponent sqlQuery: ... lov: @x }`; `cascadingLov { parentItems: ... itemsToSubmit: ... }`; `validation { valueRequired: true maxLength: N }`; `default { type: expression|sqlQuerySingleValue ... }`; `sessionState { dataType: boolean|clob storage: request|session }`.\n- Segurança comum a todas as páginas: `security { pageAccessProtection: argumentsMustHaveChecksum formAutoComplete: false }`. **Nenhuma página declara `authorizationScheme` próprio** (ver §6).\n\n---\n\n## 2. Tabela-resumo\n\n| Nº | Nome | Alias | Arquivo | Template | Modo | Autorização (página / menu) | Status |\n|---|---|---|-- 7, 11, 12, 13, 14, 15, 26. Páginas 14 e 15 não exibem região breadcrumb (14 não tem; 15 tem).\n\n---\n\n## 3. Contexto global usado pelas páginas\n\n- **Application items** (`app-items.apx`): `APP_USER_CARGO`, `APP_USER_FOTO`, `APP_USER_INICIAIS`, `APP_USER_NOME` (não preenchido por nenhum processo visto), `G_NOME_EMPRESA`, `G_NOME_USUARIO`.\n- **Application processes** (`app-processes.apx`, todos `executeCode`, `sequence: 1`, ponto de execução não explícito no .apx):\n  - `APP_USER_CARGO`: `CARGO.nome` via `COLABORADOR.login_apex = :APP_USER` (UPPER/TRIM); fallbacks 'SEM VÍNCULO' / 'MÚLTIPLOS VÍNCULOS' / 'ERRO AO CARREGAR CARGO'.\n  - `APP_USER_FOTO` / `APP_USER_INICIAIS`: `'Fotos Colaboradores/' || foto_url`, relativo a `#APP_FILES#`, que fica no HTML da p0 (nulo se não há foto) e as iniciais do colaborador; em exceção, foto nula e 1ª letra do `APP_USER`.\n  - `G_NOME_EMPRESA`: `EMPRESA.nome` do colaborador logado; fallback com texto de erro + usuário.\n  - `G_NOME_USUARIO`: `initcap(first_name||' '||last_name)` de `apex_workspace_apex_users` (usuários do workspace APEX, não da tabela COLABORADOR); fallback `:APP_USER`.\n- **LOVs compartilhadas** (`lovs.apx`): `boolean` (estática Yes/TRUE, No/FALSE), `colaborador-nome-completo` (COLABORADOR), `departamento-nome` (DEPARTAMENTO), `empresa-nome` (EMPRESA). Nenhuma filtra por empresa.\n- O vínculo usuário APEX ↔ colaborador é sempre `COLABORADOR.LOGIN_APEX = :APP_USER` (às vezes com UPPER, às vezes sem — ver pegadinhas).\n\n---\n\n## 4. Páginas em detalhe\n\n### Página 0 — Global Page (`p00000-global-page.apx`)\n- **Propósito**: regiões renderizadas em todas as páginas (header customizado).\n- **Regiões**:\n  - `novo` \"Barra de Busca\" — staticContent, slot `afterLogo`, template @/standard com `t-Region--removeHeader js-removeLandmark`, `t-Region--noUI`, `t-Region--scrollBody`. HTML: `<div class=\"corlix-header__search\">` com ícone `fa-search` e `<input id=\"P0_SEARCH_GLOBAL\" class=\"corlix-header__search-input\" placeholder=\"Buscar na intranet...\">`. **Não é um page item** (input HTML puro) e **não há JS/DA associado** → busca sem funcionalidade.\n  - `perfil` \"Perfil\" — staticContent, slot `afterNavigationBar`. HTML: link sino `fa-bell-o` → `r/corlixhub/&APP_ALIAS./notificacoes?session=&SESSION.` (página 5), link engrenagem `fa-cog` → `.../configuracoes` (página 6), bloco usuário com `&G_NOME_USUARIO.`, `&APP_USER_CARGO.`, `<img src=\"#APP_FILES#&APP_USER_FOTO.\">` + `<span class=\"corlix-header__avatar cx-avatar-iniciais\" style=\"display:none\">&APP_USER_INICIAIS.<\/span>` (classes `corlix-header__*`). Sem foto, a `<img>` recebe `src` vazio, dispara `onerror`, é escondida e mostra o `<span class=\"... cx-avatar-iniciais\" style=\"display:none\">` irmão com as iniciais (1ª letra de `PRIMEIRO_NOME` + 1ª de `ULTIMO_NOME`; fallback: 1º e último nome de `NOME_COMPLETO`).\n- **Pegadinhas**: os hrefs são relativos e começam com `r/corlixhub/...` (sem `/` inicial nem `f?p`); a resolução depende da URL corrente (friendly URL `/ords/r/<workspace>/<alias>/<page>`) e pode gerar caminho duplicado — conferir no browser. Prefira `f?p=&APP_ID.:5:&SESSION.` ou `apex.util.makeApplicationUrl`. Slots `afterLogo`/`afterNavigationBar` existem no `@corlix-standard-page`; páginas com `@/standard` podem renderizar o header de forma diferente.\n\n### Página 1 — Home (`p00001-home.apx`)\n> **Situação em 12/11/2026:** §8 do `modulos/home/Etapas-home.md` com o banco aplicado (9 tabelas, `FL_FIXADO`, `pkg_home_ui` válido) e a página aplicada: Feedbacks recebidos, Pesquisa de clima (`home_pesquisa`), Próximos eventos, diálogo Dar feedback (`home_dlg_feedback`), Ajax `MARCAR_LIDO`/`RESPONDER_PESQUISA`/`SALVAR_FEEDBACK`, itens `P1_NAO_LIDOS`/`P1_QT_PENDENCIAS`. Os 5 ajustes da primeira validação foram aplicados (2º export: 51/51 regras). Testes do 8.11 rodados na app em 12/11/2026: achados (dia da semana da 1:1, iniciais, aviso de alterações não salvas, diálogo de feedback) corrigidos no guia, no `pkg_home_ui` e no `home-pagina.js`, reaplicados e reconferidos em 13/11/2026 (export 55/55). **§8 concluído em 13/11/2026**; ficam como pendência aceita os testes de Parabenizar, \"Disponível agora\" e conta sem colaborador.\n> **Situação em 28/10/2026:** o redesign foi montado direto na página 1 (nome \"Início\", alias `INÍCIO`, export `p00001-início.apx`, template `@corlix-standard-page`); a página 28 não existe. Regiões: `home_hero`, `home_comunicados` (Cards, span 8, botões `VER_TODOS`/`NOVO_COMUNICADO`, DA de refresh), `coluna-lateral` (span 4) com `home_meu_gestor` e `home_aniversariantes`, diálogo `aniversariantes_todos`, item `P1_MES_ATUAL` (computação Before Header). O protótipo foi atualizado em 28/10/2026; o §6 do guia traz o carrossel de comunicados, as celebrações (aniversário + tempo de empresa) e o hero novo, e o §7 (10/11/2026) acrescenta o painel \"Ponto de hoje\" no hero, a região `home_indicadores` (banco de horas), a `Coluna principal` com Comunicados e `home_pendencias`, e o Ajax Callback `REGISTRAR_MARCACAO`. Os dois foram aplicados pelo time em 10/11/2026 (exports colados na conversa). O §8 (10/11/2026, versionado e não aplicado) acrescenta `Feedbacks recebidos` na Coluna principal, `Pesquisa de clima` (`home_pesquisa`) e `Próximos eventos` na Coluna lateral, o diálogo `home_dlg_feedback` (itens `P1_FB_*`), os itens `P1_NAO_LIDOS` e `P1_QT_PENDENCIAS` e os Ajax `MARCAR_LIDO`, `RESPONDER_PESQUISA` e `SALVAR_FEEDBACK`. A nota e a descrição abaixo são do estado anterior.\n> **Redesign em andamento (19/10/2026, branch `feature/redesign-home`):** a nova Home segue `pen_dev/Início.png` e é montada numa **página nova, a 28 (\"Início\", alias `INICIO`)**, sem apagar nem alterar a página 1, pelo guia [`modulos/home/Etapas-home.md`](../../modulos/home/Etapas-home.md): hero (Dynamic Content `home_hero`), Comunicados (Cards `home_comunicados`, span 8, botões \"Ver todos\" e \"Novo comunicado\" com `PUBLICADOR_DE_CONTEUDO`), coluna lateral com Meu gestor e Aniversariantes (Dynamic Content `home_meu_gestor` / `home_aniversariantes`) e o diálogo `aniversariantes_todos`; HTML gerado pelo `pkg_home_ui`, tudo filtrado por `G_ID_EMPRESA`. Quando a 28 estiver pronta, o Home URL, a entrada \"Home\" do menu e a do breadcrumb passam a apontar para ela (§5 do guia); a página 1 continua no app. A descrição abaixo é a da página 1, que segue valendo.\n\n- **Propósito**: dashboard inicial (boas-vindas, comunicados recentes, gestor, links rápidos, aniversariantes do mês).\n- **Layout** (grid 12 colunas):\n  - `container-conteudo-principal` (staticContent, @/blank-with-attributes, slot body, `columnSpan: 8`, `columnCssClasses: .container-conteudo-principal` ← **com ponto, bug**: a classe gerada será literalmente `.container-conteudo-principal`).\n    - `card-boas-vindas` (seq 10): `<h1>Bem-vindo, &G_NOME_USUARIO.! 👋<\/h1>` + texto com `<a href=\"#\" class=\"link-empresa\">&G_NOME_EMPRESA.<\/a>` (link morto). Classes `card-default card-boas-vindas`.\n    - `card-comunicados-oficiais` (seq 30): htmlCode `<h2> Comunicados Oficiais <\/h2>`, classes `card-default card-comunicados-oficiais`.\n      - `id-lista-de-comunicados` (cards, template customizado `@cards-container-image-first`, `t-CardsRegion--hideHeader`, layout horizontal, `columnCssClasses: lista-de-comunicados`). SQL: `COMUNICADO c LEFT JOIN DEPARTAMENTO d`, colunas ID_COMUNICADO, TITULO, `DBMS_LOB.SUBSTR(CONTEUDO,250,1)`, DATA_PUBLICACAO, IMAGEM, MIME_TYPE, NOME_ARQUIVO, `NVL(d.NOME,'Geral') DEPARTAMENTO`, `CLASSE_DEPTO` ('dept-'||MOD(id,6)), `TEMPO_PUBLICACAO` ('Hoje'/'Ontem'/'N dias atrás' via `TRUNC(SYSDATE)`), `ORDER BY DATA_PUBLICACAO DESC FETCH FIRST 3 ROWS ONLY`. Title HTML: `<span class=\"cx-etiqueta\">&DEPARTAMENTO.<\/span><span class=\"cmt-date\">&TEMPO_PUBLICACAO.<\/span><div class=\"cmt-title\">&TITULO.<\/div>`; body = CONTEUDO; media = BLOB `IMAGEM` (mime `MIME_TYPE`), posição first, classe `imagem-capa-comunicado`.\n        - `botao-emitir-comunicado` (staticContent filho da região de cards, slot subRegions, `columnCssClasses: emitir-comunicado`) contendo o botão `emitir-comunicado`.\n  - `container-conteudo-diversos` (seq 40, `columnSpan: 4`, `startNewRow: false`, classe `container-conteudo-diversos`):\n    - `card-meu-gestor` (cards, @/cards-container, `t-CardsRegion--hideHeader`, classes `card-default card-meu-gestor`). SQL: `COLABORADOR C JOIN COLABORADOR G ON G.ID_COLABORADOR = C.ID_GESTOR AND G.ID_EMPRESA = C.ID_EMPRESA LEFT JOIN CARGO CG ON CG.ID_CARGO = G.ID_CARGO WHERE UPPER(TRIM(C.LOGIN_APEX)) = UPPER(TRIM(:APP_USER)) AND C.ID_EMPRESA = :G_ID_EMPRESA` → NOME_CARGO, NOME_GESTOR (PRIMEIRO_NOME||' '||ULTIMO_NOME), FOTO_GESTOR (`'#APP_FILES#Fotos Colaboradores/'||FOTO_URL`); a `<img>` usa `&FOTO_GESTOR.`. Antes de 13/10/2026 a comparação era case-sensitive (`C.LOGIN_APEX = :APP_USER`) e a `<img>` usava `&FOTO_URL.`, coluna inexistente: o card ficava vazio para logins gravados em minúsculas. Header `<h3>Meu gestor<\/h3>`, footer com dois botões `t-Button` \"Chat\"/\"E-mail\" com `href=\"#\"` (mortos). Title HTML `cx-pessoa` com `onerror` → `#APP_FILES#default-user.jpeg`. SQL termina com `;` (ver pegadinhas).\n    - `links-rapidos` (seq 40, staticContent): 3 `.link-item` com `onclick=\"apex.navigation.redirect('f?p=&APP_ID.:N:&SESSION.')\"`: \"Holerite Digital\" → **página 5** (Notificações), \"Ponto Eletrônico\" → **página 6** (Configurações), \"Suporte TI\" → **página 7** (Monitor de Logs). Destinos são placeholders/incorretos. SVGs usam `currentColor`.\n    - `card-aniversariantes` (seq 50, staticContent): cabeçalho `<div class=\"cx-cabecalho-card\"><h3>Aniversariantes<\/h3><span class=\"figma-badge-mes cx-badge cx-badge--info\"><\/span><\/div>` (badge preenchido via JS).\n      - `lista-aniversariantes` (type cards, mas template `@/blank-with-attributes`): SQL sobre `COLABORADOR` filtrando mês de nascimento = mês atual em `America/Sao_Paulo` (`CAST(SYSTIMESTAMP AT TIME ZONE 'America/Sao_Paulo' AS DATE)`), colunas ID_COLABORADOR, NOME_COMPLETO, DATA_DE_NASCIMENTO, FOTO_URL (`'#APP_FILES#Fotos Colaboradores/'||FOTO_URL`), NOME, DESCRICAO ('Hoje' / 'Amanhã, DD de Mês' / 'DD de Mês'), CSS_NIVER_HOJE ('is-birthday-today'/'is-normal-day'), MES_CORRENTE; `ORDER BY EXTRACT(DAY ...) FETCH FIRST 5 ROWS ONLY;`. Title HTML `figma-row &CSS_NIVER_HOJE.` com avatar (`onerror` default), nome, data e ícone 🎂 (visível só via CSS em `is-birthday-today`).\n  - `POPUP_ANIVERSARIANTES` (cards, slot `dialogsDrawersAndPopups`, template `@/inline-dialog` com `js-dialog-autoheight js-dialog-size600x400`, classe `popup-todos-aniversariantes`, title \"TODOS OS ANIVERSARIANTES DO MÊS\", `lazyLoading: true`, media `u-circle`). Mesma SQL da lista sem o `FETCH FIRST 5`.\n- **Itens**: nenhum.\n- **Botões**: `B_VER_TODOS` (\"Ver todos\", @/text-with-icon, `t-Button--noUI t-Button--iconRight`, `fa-arrow-right`, classe `figma-footer-link`, slot `next` de `lista-aniversariantes`, ação via DA). `emitir-comunicado` (buttonName `botao_emitir_comunicado`, \"Novo comunicado\", `fa-plus`, `t-Button--iconLeft`, classe `botao-emitir-comunicado`) → `redirectThisApp` página 17 (sem autorização).\n- **Dynamic actions**: `carregar-mês-no-badge` (event `ready`, JS: `new Date().toLocaleString('pt-BR',{month:'long'})` capitalizado → `.figma-badge-mes.innerText`); `abrir-popup-aniversariantes` (click em B_VER_TODOS → `openRegion` POPUP_ANIVERSARIANTES).\n- **JS da página** (`javaScript.executeWhenPageLoads`): `carregarCapasComunicados()` força `loading='eager'`, `decoding='async'` e `fetchPriority='high'` na 1ª imagem de `.lista-de-comunicados img.a-CardView-mediaImg`; reaplica em `apexafterrefresh`.\n- **CSS inline**: nenhum (estilos em `corlix-tema.css`/`custom.css`).\n- **Processos/validações/branches**: nenhum.\n- **Banco**: COLABORADOR, CARGO, COMUNICADO, DEPARTAMENTO; app items G_NOME_USUARIO, G_NOME_EMPRESA.\n- **Navegação**: → 17 (botão), → 5/6/7 (links rápidos), popup inline.\n- **Pegadinhas**:\n  - Comunicados e aniversariantes **não filtram por empresa** (`ID_EMPRESA`) nem por `STATUS` do colaborador → vazamento entre tenants num SaaS multiempresa.\n  - Avatares (gestor, aniversariantes do card e do popup) usam `#APP_FILES#Fotos Colaboradores/` e devolvem foto nula quando `FOTO_URL` é vazio; as queries trazem `INICIAIS` (`INICIAIS_GESTOR` no gestor). Sem foto, a `<img>` recebe `src` vazio, dispara `onerror`, é escondida e mostra o `<span class=\"... cx-avatar-iniciais\" style=\"display:none\">` irmão com as iniciais (1ª letra de `PRIMEIRO_NOME` + 1ª de `ULTIMO_NOME`; fallback: 1º e último nome de `NOME_COMPLETO`).\n  - `TEMPO_PUBLICACAO` usa `SYSDATE` (fuso do servidor) enquanto aniversariantes usam fuso São Paulo.\n  - `MES_CORRENTE` e `CLASSE_DEPTO` são calculados e não usados (badge é preenchido no cliente).\n  - SQLs terminam com `;` (cards de gestor, comunicados, lista de aniversariantes). O APEX costuma tolerar/remover o `;` final, mas é bom remover.\n  - O botão \"Novo comunicado\" aparece para todos; no menu o mesmo destino exige `publicador-de-conteudo`, e a página 17 não tem autorização.\n  - Após fechar o modal 17 não há DA `apexafterclosedialog` para atualizar a lista de comunicados (e a 17 nem fecha o diálogo — ver página 17).\n\n### Página 2 — Meu Perfil (`p00002-meu-perfil.apx`)\nImplementada: Dynamic Content `pkg_perfil.render(:P2_ID_COLABORADOR)` e processo Ajax `PERFIL_DRAWER_FOTO`. A descrição antiga, de placeholder, estava desatualizada.\n\n> **Restrição de LGPD aplicada em 04/11/2026** (`modulos/perfil/Etapas-perfil-privacidade.md`): trajetória e dados pessoais só para a própria pessoa, a linha de gestão e o RH. `P2_ID_COLABORADOR` passou a *Per Request (Memory Only)*. Testado na app com colaborador, gestor e RH. A autorização `COLABORADOR` da página ainda não foi conferida no export.\n\n### Página 3 — Organograma (`p00003-organograma.apx`)\nPlaceholder idêntico à 2. O módulo real está sendo desenvolvido fora do app em `modulos/organograma/` (`organograma.sql/.js/.css`, `Etapas-organograma.md`, PNGs de redesign — tudo não commitado/modificado); ainda não há região/JS na página.\n\n### Página 4 — Chat (`p00004-chat.apx`)\n- **Propósito**: chat interno 1:1. Coluna esquerda com contatos agrupados por departamento e status de presença; coluna direita com mensagens do canal direto.\n- **Página**: template `@corlix-standard-page`, `cssClasses: ch-page`. CSS inline extenso (variáveis `--ch-*` mapeadas para tokens do tema `--cx-*`, exceto presença `--ch-online #22C55E`, `--ch-ausente #F59E0B`, `--ch-offline #D1D5DB`); zera padding do `t-Body-content` em `.ch-page`; `.ch-shell` é grid `260px 1fr` com `height: calc(100vh - 40px)`; wrappers APEX viram `display: contents`; estilos `.ch-dept`, `.ch-contact(.is-active)`, `.ch-avatar`, `.ch-dot--online|ausente|offline`, `.ch-msgs`, `.ch-sep`, `.ch-msg--in|out`, `.ch-bubble`, `.ch-time`.\n- **Regiões**:\n  - `chat-shell_1` \"Chat Shell\" (staticContent, @/blank-with-attributes, classe `ch-shell`).\n    - `contatos` \"Lista\" (classicReport, template de relatório customizado `@chat-contatos`, `columnCssClasses: ch-list`, `breakFormatting.breakColumns: col1`, `reportLayout.numberOfRows: 1000` para listar todos os colaboradores sem paginação). SQL: `colaborador c JOIN departamento d LEFT JOIN cargo cg LEFT JOIN presenca_colaborador p` → departamento, id_colaborador, nome_completo, cargo, foto_url (`'Fotos Colaboradores/'||foto_url`, relativo a `#APP_FILES#`; nulo sem foto), iniciais (1ª letra de `primeiro_nome` + de `ultimo_nome`; fallback 1º e último nome de `nome_completo`), presenca (`online` se `p.data_ultimo_ping > systimestamp - 5 min` e `status_presenca='ONLINE'`; `ausente` se ping < 30 min; senão `offline`), `cab_dept` (na 1ª linha de cada departamento, via `row_number()`: `<button type=\"button\" class=\"ch-dept\" aria-expanded=\"false\">` com chevron `.ch-dept-ico`, `.ch-dept-nome` (`apex_escape.html(d.nome)`) e `.ch-dept-qtd` (`count(*) over (partition by d.nome)`)); `where c.status = true and nvl(upper(c.login_apex),'x') != upper(:APP_USER) and c.id_empresa = (empresa do colaborador logado, via subconsulta por login_apex) order by d.nome, c.nome_completo`. O template `chat-contatos` renderiza `#CAB_DEPT#` + `<a href=\"javascript:void(0)\" class=\"ch-contact\" data-id=\"#ID_COLABORADOR#\">` com avatar (iniciais + `<img src=\"#APP_FILES##FOTO_URL#\" onerror=\"this.remove()\">` por cima; CSS inline `.ch-avatar { position: relative; overflow: hidden }` + `.ch-avatar img` absoluta), dot, nome e cargo. Colunas: CAB_DEPT (`escapeSpecialChars: false`), CARGO, DEPARTAMENTO, FOTO_URL, ID_COLABORADOR, INICIAIS, NOME_COMPLETO, PRESENCA.\n    - `conversa` \"Conversa\" (staticContent, classe `ch-chat`). O HTML da região tem o estado vazio `.ch-vazio` (\"Selecione um colaborador\") e o cabeçalho `.ch-head` (avatar, dot de presença, nome, cargo), preenchido via JS ao clicar num contato. Sem a classe `is-aberto` em `.ch-chat`, o CSS mostra só o estado vazio; com ela, mostra cabeçalho + sub-regiões (`.container`).\n      - `msgs` \"Mensagens\" (classicReport, template `@chat-mensagens`, `customAttributes: class=\"ch-msgs-wrap\"`, sem condição de servidor: é sempre renderizada e volta vazia enquanto `P4_CANAL_ID` for nulo). SQL: `canal_mensagem m JOIN colaborador col ON col.id_colaborador = m.id_colaborador WHERE m.id_canal = :P4_CANAL_ID AND nvl(m.excluida,false) = false AND EXISTS (canal_participante do usuário logado) ORDER BY m.data_envio` → corpo, hora (`hh24:mi`), lado (`out` se `upper(col.login_apex) = upper(:APP_USER)`, senão `in`), sep_dia (HTML `ch-sep` com HOJE/ONTEM/dd/mm/yyyy na 1ª msg do dia; `escapeSpecialChars: false`). Mensagem sem dados: \"Nenhuma mensagem nesta conversa ainda.\" (`.nodatafound` estilizado). `.ch-txt` usa `white-space: pre-wrap` para manter quebras de linha.\n      - `composer` \"Composer\" (staticContent, seq 20, `rowCssClasses: ch-composer-col`; a coluna é estilizada por `.ch-chat .col:has(.ch-composer)` → `flex: 0 0 auto; margin-top: auto`, fixa no rodapé da conversa; `.ch-composer` com `padding: 12px 24px 30px` para não colar na borda inferior da página). HTML: `.ch-composer` com `<textarea id=\"ch-texto\" maxlength=\"4000\">` e `<button type=\"button\" class=\"ch-enviar\">`. Fica oculto junto com as sub-regiões enquanto `.ch-chat` não tem `is-aberto`.\n- **Itens**: `P4_CONTATO_ID` (hidden, seq 20), `P4_CANAL_ID` (hidden, seq 30), `P4_MENSAGEM` (hidden, seq 40, texto a enviar copiado do textarea). Todos com `valueProtected: false`, no slot body.\n\n- **Botões / processos / validações**: nenhum.\n- **Dynamic action** `selecionar-contato` (click, jQuery `.ch-contact`):\n  1. seq 20 `executeJsCode`: `apex.item(\"P4_CONTATO_ID\").setValue(this.triggeringElement.dataset.id)`; troca a classe `is-active`; copia avatar/dot/nome/cargo do contato para `.ch-head` e adiciona `is-aberto` em `.ch-chat`; limpa e foca `#ch-texto`.\n  2. seq 30 `executeServerSideCode` (submit P4_CONTATO_ID, retorna P4_CANAL_ID): busca `id_colaborador` do usuário (`upper(login_apex) = upper(:APP_USER)`, `fetch first 1 row only`; sem colaborador vinculado → `raise_application_error(-20001, ...)`); valida que `P4_CONTATO_ID` é colaborador ativo, da mesma `id_empresa` e diferente do usuário (senão `-20002`); depois `:P4_CANAL_ID := ch_get_canal_direto(l_eu, to_number(:P4_CONTATO_ID));`.\n  3. seq 40 `refresh` da região `msgs`.\n- **Dynamic action** `enviar-mensagem` (click, jQuery `.ch-enviar`):\n  1. seq 10 `executeJsCode`: lê `#ch-texto`; se vazio ou sem `P4_CANAL_ID`, `apex.da.cancelEvent.call(this)`; senão copia para `P4_MENSAGEM` e limpa o textarea (evita reenvio por duplo clique).\n  2. seq 20 `executeServerSideCode` (submit `P4_MENSAGEM,P4_CANAL_ID`): resolve o colaborador logado (-20001) e faz `insert into canal_mensagem ... select ... from canal_participante` só se o usuário participa do canal (senão -20003); corpo cortado com `substrb(...,1,4000)`.\n  3. seq 30 `refresh` da região `msgs`.\n- **Dynamic action** `enter-envia` (keydown, jQuery `#ch-texto`): Enter sem Shift (e fora de composição IME) faz `preventDefault` e clica em `.ch-enviar`.\n- **Dynamic action** `rolar-ultima-mensagem` (`apexafterrefresh` da região `msgs`): rola `.ch-msgs` até o fim.\n- **Dynamic action** `abrir-fechar-departamento` (click, jQuery `.ch-dept`, seq 50): alterna `aria-expanded` do cabeçalho e aplica/remove `.is-visivel` nos `.ch-contact` irmãos até o próximo `.ch-dept` (`$(cab).nextUntil(\".ch-dept\", \".ch-contact\")`). O CSS oculta `.ch-contact:not(.is-visivel)`, então todos os departamentos começam colapsados. O estado não é guardado: se a região `contatos` for atualizada (ex.: um futuro polling de presença), os grupos voltam a fechar.\n- **Banco**: tabelas COLABORADOR, DEPARTAMENTO, CARGO, PRESENCA_COLABORADOR, CANAL_MENSAGEM; função `CH_GET_CANAL_DIRETO(p_colab_a, p_colab_b)` (devolve ou cria o canal direto em `CANAL`/`CANAL_PARTICIPANTE`). DDL em `database/corlix-hub.sql`; ver `05` §4–4A.\n- **Navegação**: nenhuma (tudo AJAX).\n- **Pegadinhas**:\n  - A região `msgs` não declara \"Page Items to Submit\". O refresh funciona porque o PL/SQL da DA grava `P4_CANAL_ID` em sessão. Se o valor passar a ser definido só no cliente, declare o item na região.\n  - `.ch-shell .container/.row` têm `display: contents` (inclusive os internos da `conversa`), então as colunas das sub-regiões são itens flex diretos da região `conversa`. A regra que repassa a altura (`.ch-chat .col`, `.col>div`, `.col>div>div:not(.ch-composer)`) faz todas as colunas crescerem. A coluna do composer é identificada por `.ch-chat .col:has(.ch-composer)` (`flex: 0 0 auto; margin-top: auto`), independentemente de a classe `ch-composer-col` estar em Row ou Column CSS Classes no Builder. Qualquer novo conteúdo dentro das sub-regiões de `conversa` que não deva virar coluna flex precisa entrar no `:not(...)`.\n  - Envio funciona, mas não há polling/refresh periódico, nem atualização de presença (ping): mensagens recebidas só aparecem ao reabrir o contato.\n  - Multiempresa: a lista filtra pela empresa do colaborador logado e a DA revalida no servidor. Usuário sem colaborador vinculado vê a lista vazia.\n  - `c.status = true` usa BOOLEAN SQL nativo (Oracle 23ai).\n\n### Página 5 — Notificações (`p00005-notificacoes.apx`)\nPlaceholder: só `navegação-estrutural` (breadcrumb). Template `@corlix-standard-page`. Destino do sino do header (alias `notificacoes`) e do link rápido \"Holerite Digital\".\n\n### Página 6 — Configurações (`p00006-configuracoes.apx`)\nPlaceholder: só breadcrumb `navegação-estrutural`. Template `@corlix-standard-page`. Destino da engrenagem do header e do link rápido \"Ponto Eletrônico\".\n\n### Página 7 — Monitor de Logs (`p00007-monitor-logs.apx`)\n> **Isolamento (CD-61, a aplicar):** tela técnica, com logs de todas as empresas, e por isso só da equipe do Corlix Hub. Hoje a página e a entrada do menu exigem `ADMIN_RH`. As duas passam para `EQUIPE_CORLIX_HUB` (`modulos/isolamento-empresas/Etapas-isolamento-empresas.md` §5).\n- **Propósito**: tela técnica de observabilidade, para a equipe do Corlix Hub: ler os logs exige conhecimento técnico. O RH não usa esta página.\n- **Regiões**: `navegação-estrutural` (breadcrumb); `logs` \"Logs da aplicação\" (staticContent, @/tabs-container, `js-useLocalStorage t-TabsRegion-mod--simple`) com 3 IRs (@/interactive-report, header escondido, paginação `rowRangesXToY`, saved report primário 50 linhas, sort DATA_HORA desc) no slot `tabs`:\n  1. `app_log` \"Log da aplicação\" (seq 10): `select id, log_ts at time zone 'America/Sao_Paulo' as data_hora, nivel, nivel_css (ERRO→u-danger, AVISO→u-warning, INFO→u-info, senão u-normal), app_id, page_id, apex_user, session_id, origem, mensagem, detalhe from app_log`. NIVEL com HTML expression `<span class=\"t-Badge #NIVEL_CSS#\">#NIVEL#<\/span>`; DETALHE (CLOB) em `<details class=\"log-detalhe\"><summary>Ver detalhes<\/summary><pre>#DETALHE#<\/pre><\/details>`, sem filtro/sort/agregação. Header: \"Erros capturados automaticamente e mensagens gravadas pelo código com `log_pkg`\" + tags \"Automático\", \"Histórico de 30 dias\".\n  2. `apex_workspace_activity_log` \"Erros de página (APEX)\" (seq 20): view `apex_workspace_activity_log where error_message is not null`, data convertida de UTC para São Paulo; colunas app, pagina, nome_pagina, usuario, erro, tipo_componente, componente.\n  3. `apex_debug_messages` \"Debug detalhado (APEX)\" (seq 30): view `apex_debug_messages`, nível 1/2/4 → ERRO/AVISO/INFO, senão DEBUG, badge igual; mensagens de \"no data\" em PT.\n- **Itens/botões/processos/DAs**: nenhum. CSS das classes `log-descricao`, `log-tag`, `log-detalhe` vem do tema global.\n- **Banco**: tabela `APP_LOG` + package `LOG_PKG` (DDL em `database/corlix-hub.sql`; ver `05` §4.9), views APEX `APEX_WORKSPACE_ACTIVITY_LOG`, `APEX_DEBUG_MESSAGES`.\n- **Pegadinhas**: **sem autorização** na página e no menu → qualquer usuário logado vê logs/debug (dados sensíveis). As views APEX não são filtradas por `application_id` (mostram o workspace inteiro). Colunas DATA_HORA declaradas `dataType: DATE` mas a SQL retorna TIMESTAMP WITH TIME ZONE (máscara `DD/MM/YYYY HH24:MI:SS`). Mensagens \"no data\" só traduzidas no IR de debug. Também é destino do link rápido \"Suporte TI\" da Home.\n\n### Página 8 — Notificações (`p00008-notificações.apx`)\nPágina **vazia** (sem regiões, sem breadcrumb), alias com caracteres não-ASCII `NOTIFICAÇÕES`, template @/standard. Duplicata da página 5; não referenciada por menu/breadcrumb/links. Candidata a remoção (ou a 5 deveria ser a única).\n\n### Página 9 — Holerite Digital (`p00009-holerite-digital.apx`)\n\nHoje: filtros `P9_MES`/`P9_ANO` e região Dynamic Content com `pkg_holerite.render`, que gera a folha de todos ao abrir um mês vazio. O redesign (`modulos/holerite/Etapas-holerite.md`) troca por duas regiões Dynamic Content do `pkg_holerite_ui` (`render_cabecalho` no Breadcrumb Bar e `render_pagina(:P9_COMPETENCIA)` no Body), item oculto `P9 ery para 10/11 dígitos), SITUACAO (\"Status\", HTML Expression `cx-badge cx-badge--#SITUACAO_CLASSE#`), SITUACAO_CLASSE (hidden, `sucesso`/`neutro`), CEP, LOGRADOURO, NUMERO, COMPLEMENTO, BAIRRO, DATA_CRIACAO (\"Data de abertura\", `DD/MM/YYYY`). O *Primary* mostra só as sete primeiras visíveis, ordenado por NOME_FANTASIA; endereço, CEP e data ficam em *Ações › Colunas*. `STATUS` é BOOLEAN: a query usa `case when e.status`.\n- **DA**: `edit-report-dialog-closed` (`apexafterclosedialog` em `document`, porque o botão fica fora do IR) → refresh do IR.\n- **Banco**: EMPRESA.\n- **Pegadinhas**: lista todas as empresas (é tela de administrador da plataforma). A barra do IR sai em inglês (idioma do app `en`), mas a nota do rodapé fica \"Ações › Colunas\" (decisão: produto para o mercado nacional; bate quando o app for traduzido). `pageHeader` \"Empresas\" é só o cabeçalho do download em PDF.\n\n### Página 16 — Cadastro de Empresas (`p00016-cadastro-de-empresas.apx`)\n- **Estado**: descrito a partir do export do Builder de 27/10/2026. O `.apx` do repositório ainda é a versão anterior e só é atualizado pelo backup do time (`corlixhub/` é só leitura para agentes). Validações do §6.1, título pelo Page Load e confirmação em português conferidos no Builder e na app (Chrome) em 27/10/2026, inclusive o bloqueio do Remover na Corlix (empresa com vínculos).\n- **Propósito**: modal de CRUD da tabela EMPRESA. O CNPJ preenche os dados pela BrasilAPI (só em empresa nova) e o CEP preenche o endereço pelo ViaCEP. Montada pelo guia `modulos/tema/Etapas-cadastro-empresa.md` (protótipo `pen_dev/Nova empresa (modal).png`).\n- **Página**: `pageMode: modalDialog`, `@/modal-dialog`, width 1000, `chained: false`, título `&P16_TITULO.` (\"Nova empresa\"/\"Editar empresa\" por computação Before Header; o cabeçalho do modal é definido no *Execute when Page Loads* com `apex.util.getTopApex().jQuery(\".ui-dialog-content\").dialog(\"option\",\"title\", …)`, porque a substituição sozinha deixa o cabeçalho vazio ou com o valor da abertura anterior), `authorizationScheme: @administration-rights` (EQUIPE_CORLIX_HUB), `argumentsMustHaveChecksum`.\n- **Regiões**: `cadastro-de-empresas` (form EMPRESA, `edit.enabled` add/update/delete, @/blank-with-attributes, CSS Class `cx-form-modal`) com sub-regiões sem UI e header `<h2 class=\"cx-titulo-secao\">`: `new` \"Identificação\" (seq 10), `contato-e-endereço` (seq 40), `configurações` \"Logotipo e situação\" (seq 50); `buttons` (@/buttons-container, slot dialogFooter, CSS Class `cx-form-modal-rodape`, HTML com a nota \"Campos marcados com * são obrigatórios.\").\n- **Itens** (sem *Width*, em grade de 12 colunas; obrigatórios em Required - Floating):\n  - Identificação: P16_ID_EMPRESA (hidden PK, checksum); P16_CNPJ (span 5, max 20, placeholder com máscara, help) + P16_DATA_CRIACAO (datePicker `DD/MM/YYYY`, opcional, span 7); P16_NOME \"Razão social\" (12); P16_NOME_FANTASIA (12); P16_TITULO (hidden).\n  - Contato e endereço: P16_EMAIL_CORPORATIVO (email, lower, 8) + P16_TELEFONE (phone, max 15, 4); P16_CEP (max 9, help, 3) + P16_LOGRADOURO (7) + P16_NUMERO (max 4, 2); P16_COMPLEMENTO (opcional, max 100, coluna ampliada pelo `modulos/empresas/02`, 6) + P16_BAIRRO (6); P16_CIDADE (10) + P16_UF (Select List estática com as 27 siglas, 2).\n  - Logotipo e situação: P16_LOGOTIPO_EMPRESA (imageUpload, Inline Dropzone, storage na coluna BLOB sem colunas de metadados, Resize To 2048 KB, Optional - Above, 8) + P16_STATUS \"Situação\" (switch boolean, default `TRUE`, Optional - Above, help, 4).\n- **Botões** (Template Text): `cancel` (slot Next, cancelDialog), `delete` (\"Remover\", slot Delete, `t-Button--danger`, sem validações, confirmação \"Remover esta empresa? Esta ação não pode ser desfeita.\", só se ID não nulo), `save` (\"Salvar alterações\", Hot, update, só se ID não nulo), `create` (\"Criar empresa\", Hot, insert, só se ID nulo).\n- **DAs**:\n  - `dados-por-cnpj` (change em P16_CNPJ, Execute JavaScript Code): com 14 dígitos e sem `P16_ID_EMPRESA`, `fetch` em `brasilapi.com.br/api/cnpj/v1/{cnpj}` e preenche razão social, nome fantasia, data de abertura, e-mail, telefone e endereço (só os campos que vierem); erro inline no CNPJ se não achar.\n  - `endereço-por-cep` (keyup em P16_CEP): com 8 dígitos, `fetch` no ViaCEP, preenche logradouro, bairro, cidade e UF e foca Número (ou Logradouro, se vier vazio); erro inline no CEP. Campos de endereço sempre editáveis.\n- **Computações**: After Submit tiram a máscara de P16_CEP (10) e P16_TELEFONE (20), antes das validações; Before Header define P16_TITULO.\n- **Validações**: `cnpj-com-14-dígitos` (10), `cnpj-não-cadastrado` (15, compara só os dígitos e ignora a própria empresa), `cep-com-8-dígitos` (20), `telefone-com-ddd` (30, 10–11 dígitos), `empresa-sem-vínculos` (40, `alwaysExecute`, só no DELETE: percorre as FKs `NO ACTION` para EMPRESA em `user_constraints` e bloqueia a remoção com mensagem amigável, no lugar do ORA-02292).\n- **Processos**: `initialize-form-cadastro-de-empresas` (formInitialization, beforeHeader); `process-form-cadastro-de-empresas` (formAutoRowProcessing, seq 10); `close-dialog` (closeDialog, seq 50, quando REQUEST em CREATE,SAVE,DELETE).\n- **Banco**: EMPRESA (`DATA_CRIACAO` opcional depende de `modulos/empresas/01`). Serviços externos chamados do browser: BrasilAPI e ViaCEP (se a CSP bloquear, liberar os domínios).\n- **Pegadinhas**:\n  - O CNPJ é gravado com a máscara digitada; comparações têm de usar só os dígitos.\n  - `EMPRESA` não tem colunas de MIME type/nome do logotipo: se a pré-visualização não aparecer na edição, o próximo passo é criá-las.\n  - Image Upload não tem *File Types*; *MIME Type Column* recebe nome de item, não lista de tipos.\n  - Na grade, sequências repetidas na mesma linha deixam a ordem indefinida e podem estourar as 12 colunas.\n\n### Página 17 — Emitir Comunicado (`p00017-comunicado.apx`)\n- **Propósito**: modal (wizard template, altura 600) para publicar um comunicado.\n- **Estado em 12/11/2026:** diálogo no layout do protótipo **aplicado** pelo `modulos/comunicados/Etapas-comunicados.md` §4: Modal Dialog de 680 px, `P17_PUBLICO` (Todos/Um departamento) com Dynamic Action, validação e limpeza do departamento, Categoria obrigatória, Image Upload com recorte 16:9 e validação PNG/JPG, `P17_FL_FIXADO`, processo *Close Dialog* `Fechar`, data local e `comunicado.css`. Conferido na app sem publicar. Nos testes da §5 sem gravar, a validação PNG/JPG deixava passar GIF (consultava `APEX_APPLICATION_TEMP_FILES`, mas o item grava direto na coluna BLOB); o §4.7 foi corrigido, aplicado e retestado (PNG passa, GIF é barrado). Publicação testada em 12/11/2026 (comunicado de teste apagado depois): grava certo, e, depois da troca do §4.10 passo 2, mostra só \"Comunicado publicado.\" (conferido na app; **página concluída**). A hora fica `00:00` porque o formato de data da app é `DS` (limite conhecido). O resto desta seção descreve a versão anterior.\n- **Regiões**: `buttons` (slot wizardButtons); `step-1` \"emitir-comunicado\" (form sobre `COMUNICADO`, slot wizardBody, title \"Emitir novo comunicado\").\n- **Itens** (form `@step-1`; **todos com `sequence: 10`** → ordem de exibição indefinida/por nome):\n  - P17_ID_COMUNICADO (hidden PK, queryOnly).\n  - P17_TITULO (textField, req, 200, label \"Titulo\").\n  - P17_CONTEUDO (textarea CLOB, h=5).\n  - P17_ID_DEPARTAMENTO (selectList; LOV: departamentos da empresa do usuário logado via subquery `COLABORADOR.login_apex = :APP_USER`); sem `upper`/`trim` e sem opção vazia, a lista vem vazia quando o `LOGIN_APEX` não está em maiúsculas. Correção em `09` §4.9 (LOV compartilhada `LOV_DEPARTAMENTO_EMPRESA`, item nulo = Todos).\n  - P17_IMAGEM (imageUpload na coluna BLOB IMAGEM, `mimeTypeColumn: MIME_TYPE`, `filenameColumn: NOME_ARQUIVO`).\n  - P17_MIME_TYPE, P17_NOME_ARQUIVO (hidden, colunas).\n  - P17_DATA_PUBLICACAO (hidden, default expression `SYSDATE;`).\n  - P17_ID_AUTOR (hidden, default SQL `SELECT ID_COLABORADOR FROM COLABORADOR WHERE LOGIN_APEX = :APP_USER;`).\n  - P17_ID_EMPRESA (hidden, checksum, default SQL `SELECT ID_EMPRESA FROM COLABORADOR WHERE LOGIN_APEX = :APP_USER;`).\n- **Botões**: `cancel` (buttonName `cancelar`, cancelDialog); `next` (buttonName `enviar_comunicado`, \"Enviar Comunicado\", `fa-chevron-right`, insert, showProcessing, confirmação \"Certeza que deseja emitir o comunicado?\").\n- **Processos**: `initialize-form-emitir-comunicado` (formInitialization); `processo-emissao-comunicado` (formAutoRowProcessing, target tabela COMUNICADO, sucesso \"Comunicado Publicado com Sucesso!\", erro \"Não foi possível emitir o comunicado, tente novamente.\").\n- **Banco**: COMUNICADO (insert), COLABORADOR, DEPARTAMENTO.\n- **Pegadinhas**:\n  - **Não há processo `closeDialog` nem branch** → após inserir, o modal não fecha (recarrega a si mesmo); a Home não é atualizada.\n  - Default `SYSDATE;` com ponto e vírgula em \"PL/SQL expression\" pode gerar erro de compilação (deveria ser `SYSDATE`). Defaults SQL também terminam com `;`.\n  - `buttonName` em minúsculas (`cancelar`, `enviar_comunicado`) — REQUEST será esse nome; a DML automática usa `databaseAction: insert` do botão, então funciona.\n  - Template wizard + lista `emitir-comunicado` aponta para as páginas 18 e 19, que hoje são as páginas 18 (Movimentação) e 19 (Formações) do histórico de carreira. A lista não é usada por nenhuma página, então não quebra nada, mas pode ser apagada (wizard abandonado em 1 passo).\n  - P17_ID_DEPARTAMENTO opcional: nulo = \"Geral\" na Home.\n  - Sem autorização na página; só o menu exige `publicador-de-conteudo`, e o botão da Home é livre.\n  - P17_TITULO usa `@/optional-floating` apesar de `valueRequired: true`.\n\n### Página 26 — Central de Equipes (`p00026-central-de-equipes.apx`)\n> **Isolamento (CD-61, a aplicar):** hoje lista equipes de todas as empresas. Correção: Where Clause e listas filtradas (`modulos/isolamento-empresas/Etapas-isolamento-empresas.md` §3 e §4).\n- **Propósito**: listar equipes e abrir modal de criação/edição.\n- **Regiões**: `navegação-estrutural` (breadcrumb); `central-de-equipes` (classicReport sobre **tabela** `EQUIPE`, @/standard `t-Region--noPadding`, report @/standard com `t-Report--stretch/staticRowColors/rowHighlight/inline/hideNoPagination`). Colunas: ID_EQUIPE (link ícone `fa-edit` → página 27 com `P27_ID_EQUIPE=#ID_EQUIPE#`), ID_EMPRESA (LOV `@empresa-nome`), ID_DEPARTAMENTO (`@departamento-nome`), ID_CRIADOR (`@colaborador-nome-completo`), NOME, DESCRICAO, DATA_CRIACAO, STATUS (`@boolean`). Cabeçalhos são os gerados (\"Id Empresa\", \"Data Criacao\" etc.).\n- **Botão**: `create` (\"Criar\", slot `edit`) → página 27 `clearCache: 27`.\n- **DA**: `editar-relatório-caixa-de-diálogo-fechada` (`apexafterclosedialog`) → refresh do relatório.\n- **Banco**: EQUIPE (+ EMPRESA, DEPARTAMENTO, COLABORADOR via LOVs).\n- **Pegadinhas**: sem filtro por empresa (multi-tenant); sem autorização; rótulos não traduzidos/polidos.\n\n### Página 27 — Nova Equipe (`p00027-nova-equipe.apx`)\n> **Isolamento (CD-61, a aplicar):** hoje permite escolher qualquer empresa, departamento e criador, e editar equipe de outra empresa. Correção no §4 do mesmo guia.\n- **Propósito**: modal CRUD de EQUIPE.\n- **Regiões**: `nova-equipe` (form EQUIPE, add/update/delete); `botões` (dialogFooter).\n- **Itens**: P27_ID_EQUIPE (hidden PK); P27_ID_EMPRESA (selectList `@empresa-nome`, req); P27_ID_DEPARTAMENTO (selectList `@departamento-nome`, opc); P27_ID_CRIADOR (selectList `@colaborador-nome-completo`, req); P27_NOME (req, 150); P27_DESCRICAO (textarea, 500); P27_DATA_CRIACAO (datePicker, req, maxLength 255); P27_STATUS (switch boolean, req). Labels alinhados à direita, nomes técnicos (\"Id Criador\").\n- **Botões**: `cancel` (cancelDialog), `delete` (\"Excluir\", danger, confirmação, se ID não nulo), `save` (\"Aplicar Alterações\", se ID não nulo), `create` (\"Criar\", se ID nulo).\n- **Processos**: formInitialization; formAutoRowProcessing; `fechar-caixa-de-diálogo` (closeDialog quando CREATE,SAVE,DELETE).\n- **Pegadinhas**: LOVs não filtradas por empresa nem em cascata (departamento de outra empresa pode ser escolhido); criador escolhido manualmente (deveria ser o usuário logado); data de criação digitada manualmente. Mudança não commitada: botão Excluir ganhou `t-Button--danger`.\n\n### Páginas 30 a 33 — Ponto eletrônico\nMontadas pelo guia `modulos/ponto-eletronico/Etapas-ponto-eletronico.md`, a partir do protótipo `pen_dev/Ponto eletrônico.png`. Os ajustes da validação de 03/11/2026 foram aplicados (`modulos/ponto-eletronico/Etapas-ajustes-validacao.md`). Os de `Etapas-meus-pedidos.md` também (cartão Meus pedidos na região de Pendências). Assinatura do espelho, seletor de mês e demais fluxos validados na app em 03/11/2026, no ambiente DEV.\n- **p30 Ponto eletrônico** (`COLABORADOR`): regiões Dynamic Content do `pkg_ponto_ui`, 4 diálogos e os Ajax Callbacks `REGISTRAR_MARCACAO`, `ASSINAR_ESPELHO` e `BAIXAR_ESPELHO`. Item `P30_COMPETENCIA` (mês, YYYYMM).\n- **p31 Solicitar ajuste** (modal, `COLABORADOR`): chama `pkg_ponto.solicitar_ajuste`.\n- **p32 Ajustes de ponto** (`APROVADOR_PONTO`): Interactive Report dos pedidos pendentes.\n- **p33 Responder ajuste** (modal, `APROVADOR_PONTO`): chama `pkg_ponto.responder_ajuste`.\n\n### Páginas 34 a 43 — Suporte TI (criadas; ver as fichas)\nExistem no app desde o backup de 10/11/2026, ainda fora do menu e sem registro de testes; o estado de cada uma está nas [fichas](./paginas/README.md). Foram montadas pelo guia `modulos/suporte-ti/Etapas-suporte-ti.md`, a partir do protótipo `pen_dev/Suporte TI.png`:\n- **p34 Suporte TI** (`COLABORADOR`): regiões Dynamic Content do `pkg_suporte_ui` e os Ajax Callbacks `BUSCAR_ARTIGOS` e `CONFIRMAR_SOLUCAO`. A região `Meus chamados` precisa do HTML DOM ID `suporte_chamados`.\n- **p35 Abrir chamado** (modal, `COLABORADOR`): chama `pkg_suporte.abrir_chamado`, com anexo.\n- **p36 Chamado** (modal, `COLABORADOR`): conversa, `responder` e `reabrir`. Com o request `BAIXAR_ANEXO`, faz o download do anexo, inclusive para a p39.\n- **p37 Base de conhecimento** (`COLABORADOR`): artigos por assunto e leitura; `P37_ID_ARTIGO` soma um acesso.\n- **p38 Atendimento TI** (`SUPORTE_TI`): Interactive Report sobre `vw_suporte_fila`.\n- **p39 Atender chamado** (modal, `SUPORTE_TI`): chama `pkg_suporte.atender`.\n- **p40/p41 Status dos sistemas** e **p42/p43 Artigos** (`SUPORTE_TI`): lista + modal do assistente, sobre `suporte_sistema` e `suporte_artigo`.\n\n### Página 9999 — Login (`p09999-login.apx`)\n- Página padrão gerada pelo APEX: `@/login`, `authentication: public`, title \"CorlixHub - Log In\".\n- **Região** `corlixhub` (template @/login, imagem `#APP_FILES#icons/app-icon-512.png`).\n- **Itens**: P9999_USERNAME (textField, ícone `fa-user`, `autocomplete=\"username\"`, storage request), P9999_PASSWORD (password, `fa-key`, `autocomplete=\"current-password\"`), P9999_REMEMBER (checkbox, só se `apex_authentication.persistent_cookies_enabled`). Labels em inglês (\"Username\", \"Password\", \"Remember username\").\n- **Botão**: `login` (LOGIN, \"Sign In\", hot).\n- **Processos**: `get-username-cookie` (beforeHeader: lê cookie de usuário); `set-username-cookie` (seq 10, `APEX_AUTHENTICATION.SEND_LOGIN_USERNAME_COOKIE(lower(:P9999_USERNAME), :P9999_REMEMBER)`); `login` (seq 20, `APEX_AUTHENTICATION.LOGIN(:P9999_USERNAME, :P9999_PASSWORD, p_set_persistent_auth default)`); `clear-page-s-cache` (seq 30, clearSessionState).\n- **Pegadinhas**: textos não traduzidos para PT-BR.\n\n---\n\n## 5. Mudanças não commitadas em `corlixhub/pages` (git diff na branch DEV)\n\n`git diff --stat`: p00001-home (291 linhas), p00004-chat (24), p00014-cadastros-de-usuarios (14), p00016-cadastro-de-empresas (11), p00027-nova-equipe (5). Tema geral: **migração de estilos inline para classes/tokens do novo tema** (`corlix-tema.css`, não commitado, em `shared-components/static-files/`).\n- **Home**: (a) corrigido bug em que o bloco `javaScript.fileUrls` continha código JS (com comentários `//` e strings soltas) — substituído por `executeWhenPageLoads` com `carregarCapasComunicados()`; o preenchimento do badge do mês continua via DA. (b) SQLs de aniversariantes passaram de `SYSDATE` para `CAST(SYSTIMESTAMP AT TIME ZONE 'America/Sao_Paulo' AS DATE)` (e ganharam indentação extra). (c) fallbacks `onerror` trocados de `https://dicebear.com` (URL inválida) para `#APP_FILES#default-user.jpeg`. (d) HTML inline com `style=` substituído por classes `cx-cabecalho-card`, `cx-badge cx-badge--info`, `cx-acoes-card`, `cx-pessoa*`, `cx-etiqueta` (no lugar de `cmt-badge &CLASSE_DEPTO.`). (e) SVGs `#4f46e5` → `currentColor`. (f) `B_VER_TODOS`: \"Ver Todos\"→\"Ver todos\", template text-with-icon, removido `customAttributes style=...!important`. (g) botão \"Emitir Comunicado\" → \"Novo comunicado\" com ícone `fa-plus`. (h) header \"MEU GESTOR\" → \"Meu gestor\".\n- **Chat**: cores hex das variáveis `--ch-*` trocadas por tokens `--cx-primaria`, `--cx-primaria-suave`, `--cx-tag`, `--cx-borda`, `--cx-superficie-2`, `--cx-texto(-2/-3)`, `--cx-raio-card`.\n- **Página 14**: header com classes `cx-titulo`/`cx-descricao`; 5 itens obrigatórios passaram a usar `@/required-floating`.\n- **Página 16**: cabeçalhos das seções `<h2 class=\"cx-titulo-secao\">`; botão Remover `t-Button--danger`.\n- **Página 27**: botão Excluir `t-Button--danger`.\n\n---\n\n## 6. Mapa de navegação\n\n```\n                       [9999 Login] --(APEX_AUTHENTICATION.LOGIN)--> homeUrl = [1 Home]\n\nGlobal Page 0 (header em todas): sino -> [5 Notificações]   engrenagem -> [6 Configurações]\n\nMenu lateral: 1, 2, 3, 11, 12, 13, 14*, 17**, 15***, 26, 4, 7, Sair(&LOGOUT_URL.)\n   * somente-diretoria   ** publicador-de-conteudo   *** administration-rights\n\n[1 Home]\n  ├─ botão \"Novo comunicado\" ──────────────> [17 Emitir Comunicado] (modal; não fecha sozinho)\n  ├─ \"Ver todos\" ──────────────────────────> POPUP_ANIVERSARIANTES (inline dialog na própria página)\n  ├─ Link rápido \"Holerite Digital\" ───────> [5]   (placeholder)\n  ├─ Link rápido \"Ponto Eletrônico\" ───────> [6]   (placeholder)\n  ├─ Link rápido \"Suporte TI\" ─────────────> [7 Monitor de Logs]\n  └─ Meu gestor: \"Chat\"/\"E-mail\" e link da empresa -> href=\"#\" (mortos)\n\n[15 Empresas Cadastradas] ── \"Cadastrar\" (clear 16) / ícone editar (P16_ID_EMPRESA) ──> [16 Cadastro de Empresas] (modal)\n[16] ── CREATE/SAVE/DELETE ──> closeDialog ──> 15 refresca IR (apexafterclosedialog)\n\n[26 Central de Equipes] ── \"Criar\" (clear 27) / ícone editar (P27_ID_EQUIPE) ──> [27 Nova Equipe] (modal)\n[27] ── CREATE/SAVE/DELETE ──> closeDialog ──> 26 refresca relatório\n\n[14 Cadastro de Usuários] ── submit ──> branch para 14 (clearCache 14) ; \"Cancelar\" -> 14\n\n[4 Chat] — sem navegação; AJAX (DA) seleciona contato -> P4_CANAL_ID -> refresh msgs\n\nLista \"emitir-comunicado\" (wizard, não usada): 17 -> 18 -> 19   (18 e 19 hoje são do histórico de carreira)\nÓrfãs: [8 Notificações duplicada] (nenhum link). Páginas 2,3,11,12 só via menu, sem conteúdo.\n```\n\n---\n\n## 7. Tabelas, views e objetos de banco usados pelas páginas\n\n| Objeto | Tipo | Páginas |\n|---|---|---|\n| COLABORADOR | tabela | 1, 4, 14 (insert), 17 (defaults/LOV), 26/27 (LOV), app processes |\n| CARGO | tabela | 1, 4, 14 (LOV), app process APP_USER_CARGO |\n| DEPARTAMENTO | tabela | 1, 4, 14, 17, 26/27 (LOV) |\n| EMPRESA | tabela | 14 (LOV), 15 (IR), 16 (CRUD), 26/27 (LOV), app process G_NOME_EMPRESA |\n| COMUNICADO | tabela | 1 (top 3), 17 (insert) |\n| EQUIPE | tabela | 26 (report), 27 (CRUD) |\n| PRESENCA_COLABORADOR | tabela | 4 |\n| CANAL_MENSAGEM | tabela | 4 |\n| CH_GET_CANAL_DIRETO | função | 4 (DA server-side) |\n| APP_LOG / LOG_PKG | tabela / package | 7 |\n| APEX_WORKSPACE_ACTIVITY_LOG, APEX_DEBUG_MESSAGES, APEX_WORKSPACE_APEX_USERS | views APEX | 7, 7, app process G_NOME_USUARIO |\n| APEX_UTIL.CREATE_USER, APEX_AUTHENTICATION.* | APIs APEX | 14, 9999 |\n\nColunas relevantes inferidas: COLABORADOR(ID_COLABORADOR, NOME_COMPLETO, PRIMEIRO_NOME, ULTIMO_NOME, EMAIL, LOGIN_APEX, DATA_ADMISSAO, DATA_DE_NASCIMENTO, FOTO_URL, ID_EMPRESA, ID_DEPARTAMENTO, ID_CARGO, ID_GESTOR, STATUS boolean); CARGO(ID_CARGO, NOME, ID_DEPARTAMENTO, ID_EMPRESA); DEPARTAMENTO(ID_DEPARTAMENTO, NOME, ID_EMPRESA); EMPRESA(ID_EMPRESA, NOME, NOME_FANTASIA, CNPJ, DATA_CRIACAO, EMAIL_CORPORATIVO, TELEFONE, CEP, LOGRADOURO, NUMERO, COMPLEMENTO, BAIRRO, CIDADE, UF, STATUS boolean, LOGOTIPO_EMPRESA blob); COMUNICADO(ID_COMUNICADO, TITULO, CONTEUDO clob, DATA_PUBLICACAO, IMAGEM blob, MIME_TYPE, NOME_ARQUIVO, ID_DEPARTAMENTO, ID_AUTOR, ID_EMPRESA); EQUIPE(ID_EQUIPE, ID_EMPRESA, ID_DEPARTAMENTO, ID_CRIADOR, NOME, DESCRICAO, DATA_CRIACAO, STATUS boolean); PRESENCA_COLABORADOR(ID_COLABORADOR, DATA_ULTIMO_PING, STATUS_PRESENCA); CANAL_MENSAGEM(ID_CANAL, ID_COLABORADOR, CORPO, DATA_ENVIO, EXCLUIDA boolean); APP_LOG(ID, LOG_TS tstz, NIVEL, APP_ID, PAGE_ID, APEX_USER, SESSION_ID, ORIGEM, MENSAGEM, DETALHE clob).\nO DDL dessas tabelas, de `CH_GET_CANAL_DIRETO` e de `LOG_PKG` está em `database/corlix-hub.sql` (snapshot sem dados); detalhes em `05`.\n\n---\n\n## 8. Pegadinhas transversais (checklist para quem for editar)\n\n1. **Autorização só no menu**: nenhuma página tem `authorizationScheme`; 7 (logs), 14 (cria usuários), 15/16 (empresas) e 17 (comunicados) são acessíveis por URL por qualquer usuário autenticado. Para proteger, adicionar `security { authorizationScheme: @... }` na página.\n2. **Multi-tenant ausente nas consultas**: quase nenhuma SQL filtra por `ID_EMPRESA` do usuário (exceção: LOV de departamento da página 17).\n3. **Duas páginas de Notificações** (5 implementada como placeholder com breadcrumb e alias ASCII `NOTIFICACOES`, usada pelo header; 8 vazia, alias `NOTIFICAÇÕES`, órfã).\n4. **Aliases e nomes de arquivo com acento** (8, 19) — cuidado com URLs amigáveis e scripts. A 13 e a 21 foram trocadas em 19/10/2026.\n5. Chat: região de mensagens condicionada no servidor + refresh por DA = não funciona; `templateOptions: \"[object Object]\"`; CAB_DEPT só para admins; sem envio.\n6. Modal 17 sem closeDialog; lista do wizard aponta para 18/19, hoje páginas do histórico de carreira; `SYSDATE;` no default.\n7. Modal 16: campos de endereço desabilitados (não submetidos); maxLengths curtos; logotipo em `appTempFiles`.\n8. ~~Caminhos de foto divergentes~~: corrigido em 13/10/2026; header e Home usam `#APP_FILES#Fotos Colaboradores/` (o organograma monta a mesma pasta via `apex.env.APP_FILES`, ver 06).\n9. Links mortos/placeholder: busca global sem JS, `href=\"#\"` (gestor, empresa), links rápidos apontando para 5/6/7.\n10. Comparações de `LOGIN_APEX` ora com `UPPER`, ora sem (Home gestor, 17, lado do chat) — padronizar `UPPER(TRIM(login_apex)) = UPPER(:APP_USER)`.\n11. Templates de página misturados: `@/standard` (1, 2, 3, 8, 11, 12, 13, 14, 15) vs `@corlix-standard-page` (4, 5, 6, 7, 26) — o header da Global Page usa slots `afterLogo`/`afterNavigationBar` definidos no template customizado.\n12. Ao editar `.apx`: preservar `executionMappingIdentifier`/`savedReportMappingIdentifier`, manter escape `\\#COL#\\` em targets, uma opção por linha em listas, e blocos de código cercados com a linguagem correta (`javascript-browser`, não `javascript`).\n"}, {"arquivo": "03-componentes-compartilhados.md", "titulo": "03 — Componentes compartilhados (Shared Components) da app 100 CORLIXHUB", "md": "# 03 — Componentes compartilhados (Shared Components) da app 100 CORLIXHUB\n\n> **Estado em 13/11/2026 (backup `84f8625`).** Fonte da verdade: `corlixhub/application.apx`, `corlixhub/page-groups.apx`, `corlixhub/shared-components/*.apx`, `corlixhub/shared-components/themes/universal-theme/**`, as 42 páginas em `corlixhub/pages/` e trechos de `database/f100.sql` (só grep).\n> APEXlang `mmdVersion` `26.1.0+3102` (`corlixhub/.apex/apexlang.json`). O cabeçalho do `f100.sql` desse backup diz `Version: 26.1.6`; os guias do projeto continuam escritos para o Builder **26.1.5** (ver
