dmin-rh`, authorization `ADMIN_RH`, processo e LOV de gestor na P14); SQL instalado no banco em 06/10/2026, com papéis vinculados à mão aos cargos antigos. Guia: `Etapas-perfis-acesso.md`; histórico: `Registro-implantacao.md` |\n| `modulos/empresas/` | versionado | p. 16 `Cadastro de Empresas` | **Sim** (01 e 02, confirmados no DDL do backup de 27/10/2026) | `01_data_criacao_opcional.sql`: `EMPRESA.DATA_CRIACAO` passa a aceitar NULL; `02_complemento_100.sql`: `EMPRESA.COMPLEMENTO` de 30 para 100 caracteres (idempotentes). Sem package nem página própria |\n| `modulos/colaboradores/` | versionado (07/11/2026) | p. 12 `Colaboradores` | **Parcial**: página e ACL no backup; package de cabeçalho preparado, ainda sem confirmação de instalação | `01_vw_colaboradores_lista.sql` (view com avatares, vínculo, perfil e isolamento multiempresa); CSS próprio `colaboradores.css`; função `00_fn_colab_tem_papel.sql` antes da view para isolar ACL das contagens. Teste isolado passou; view e página pendentes de validação. Coluna Pessoa: HTML em Link Text do tipo Link, sem âncora interna; validação no Builder pendente (§5.1 do guia). Guia revisado em 09/11: cabeçalho em pkg_colaboradores_ui, ADMIN_RH somente na ação em alinhamento com o destino p14, escape explícito, layout a conferir e paginação. Edição na p14, isolamento e facetas ainda exigem validação na app |\n\nO histórico de carreira já está integrado: `G_ID_EMPRESA`, as authorizations `GESTOR` e `COLABORADOR`, as LOVs, os static files e as páginas 13 e 18–23 estão em `corlixhub/` e no `database/f100.sql`. O papel `Admin RH` e a authorization `ADMIN_RH` foram criados pelo módulo `perfis-acesso`.\n\n### Padrão arquitetural comum (\"Dynamic Content renderizado por PL/SQL\")\n\n```\nTabelas existentes (COLABORADOR, CARGO, DEPARTAMENTO, EMPRESA, COMUNICADO)\n   └─ view(s) do módulo (filtro/joins)          ex.: vw_org_colaborador, vw_movimentacao_valida\n        └─ package *_UI / render  → CLOB de HTML (escapado com apex_escape)\n             └─ Região APEX \"Dynamic Content\" (template Blank with Attributes, Static ID fixo,\n                Source = PL/SQL Function Body returning CLOB, Page Items to Submit = item de foco)\n                  ├─ CSS do módulo (Static Application File), escopado num prefixo (.org / .hc)\n                  └─ JS do módulo em blocos: Function and Global Variable Declaration /\n                     Execute when Page Loads / Dynamic Actions; eventos delegados via data-*,\n                     apex.region(id).refresh() e apex.server.process(<Ajax Callback>)\n```\n\nPor que: os layouts dos protótipos (pen.dev em `pen_dev/`) não cabem nos templates do Universal Theme; HTML gerado no servidor evita bibliotecas externas (o organograma abandonou a OrgChart JS e sua questão de licença) e mantém regras de visibilidade no banco.\n\nConvenções de geração de HTML (idênticas nos dois packages): CLOB temporário global `g_html` + `inicia` / `p(texto)` (`dbms_lob.writeappend`); `e()` = `apex_escape.html`, `a()` = `apex_escape.html_attribute`; ícones Lucide inline (SVG stroke, `currentColor`, `aria-hidden`); textos com entidades HTML (`&atilde;`, `&middot;`) ou `unistr`; datas por extenso com `NLS_DATE_LANGUAGE='BRAZILIAN PORTUGUESE'`; URLs via `apex_page.get_url` (gera checksum); iniciais = 1ª letra do primeiro nome + 1ª do último sobrenome.\n\n---\n\n## 1. Organograma\n\n### 1.1 Objetivo e regras de negócio\n\nNavegação **por níveis** na hierarquia de gestão (`COLABORADOR.ID_GESTOR`): uma pessoa em foco, o caminho até o topo (breadcrumb) e os subordinados diretos em cards. Clique no card abre um **drawer** de detalhes (redesign em `Organograma — redesign (navegação por níveis).png` e `Organograma · detalhes da pessoa (Drawer) — redesign.png`).\n\n- Só **contas ativas** aparecem (`colaborador.status = true`; `STATUS` nulo/false = inativo). Se um gestor fica inativo, os subordinados dele somem da navegação até serem realocados.\n- Sem foco (ou foco inválido/inativo) → abre no **topo**: `id_raiz` = `min(id_colaborador)` ativo sem gestor.\n- Card em foco: avatar, nome, \"cargo · departamento\", tag \"Topo da hierarquia\" (se sem gestor), resumo \"N subordinados diretos · M pessoas na estrutura\" (M = todos os descendentes ativos, `connect by`), botões \"Ver perfil\" (abre o drawer) e \"Conversar\" (oculto se a pessoa é o próprio `APP_USER`, comparando `login_apex`).\n- Cards dos filhos (ordem alfabética): prévia da equipe com até 3 avatares/nomes; acima disso \"+N\" e \"e mais N\"; \"Sem equipe direta\" se 0; botão \"Ver equipe\" desce um nível.\n- Avatar: sempre renderiza as iniciais e, se houver foto, uma `<img>` por cima (`onerror=\"this.remove()\"` → volta às iniciais). `FOTO_URL` é só o nome do arquivo em `Fotos Colaboradores/`: o PL/SQL emite `data-org-foto=\"Fotos Colaboradores/<arquivo>\"` e o JS `orgCarregarFotos(raiz)` monta o `src` com `apex.env.APP_FILES` (chamado no load, no `apexafterrefresh` da região e após preencher o drawer). URL absoluta (`http(s)://`, `//`, `/`) vai direto no `src`; prefixo `#APP_FILES#` é removido. Sem `FOTO_URL`, usa BLOB (`IMAGEM_PERFIL`) via `APPLICATION_PROCESS=DOWNLOAD_FOTO` com item `ID_COLABORADOR`.\n- Drawer: Contato (e-mail `mailto` + botão copiar com ✓ por 2 s), Na estrutura (\"Reporta-se a\" gestor ou \"Topo da hierarquia\"/\"Gestor inativo ou não encontrado\"; \"Equipe direta\" até `c_max_equipe` = 8, depois \"e mais N na equipe\"; \"Ver equipe no organograma\"), Sobre (Departamento, Empresa, \"Na Corlix desde\" = \"fevereiro de 2026 · 7 meses\" a partir de `DATA_ADMISSAO`, ou \"admissão em ...\" se futura; Aniversário só dia e mês), nota de privacidade, rodapé \"Conversar\" + \"Ver perfil completo\".\n- **Privacidade:** a nota diz \"você vê só os dados visíveis para todos\", mas hoje e-mail, admissão e aniversário aparecem para qualquer usuário logado. Sugestão do guia: flag de visibilidade no cadastro.\n\n### 1.2 Arquitetura\n\n| Camada | Artefato | Detalhes |\n|---|---|---|\n| View | `vw_org_colaborador` | `colaborador` ⨝ `cargo` ⨝ `departamento`, `where c.status = true`. Colunas: `id_colaborador, id_gestor, nome_completo, email, login_apex, data_admissao, data_de_nascimento, cargo, departamento, foto_url, tem_imagem ('S'/'N')` |\n| Package | `pkg_organograma` | Constantes: `c_nome_empresa = 'Corlix'`, `c_pagina_perfil = 20` / `c_item_perfil = 'P20_ID_COLABORADOR'`, `c_pagina_chat = 30` / `c_item_chat = 'P30_ID_COLABORADOR'` (**placeholders**), `c_max_equipe = 8`. Públicas: `id_raiz`, `render(p_id_foco, p_nome_empresa default c_nome_empresa) return clob`, `render_detalhes(p_id, p_nome_empresa) return clob`. Privadas: `render_caminho`, `render_foco`, `render_filhos`, `avatar`, `linha_pessoa`, `dado`, `tempo_de_casa`, `aniversario`, `eh_usuario_atual` (usa `v('APP_USER')`) |\n| Região | Dynamic Content, Static ID `organograma` | Source `return pkg_organograma.render(to_number(:P10_ID_FOCO default null on conversion error));` |\n| Ajax Callback | `ORG_DETALHES` | `apex_util.prn(p_clob => pkg_organograma.render_detalhes(to_number(apex_application.g_x01 default null on conversion error)), p_escape => false);` |\n| Front | `organograma.css` (escopo `.org` e `.org-drawer`), `organograma.js` (3 blocos) | drawer = `<dialog>` nativo criado pelo JS |\n\nArquivo SQL único: `modulos/organograma/organograma.sql` (view + spec + body). A versão anterior (commitada) não tinha `render_detalhes`; recebia o nome da empresa como 2º argumento obrigatório e \"Ver perfil\" era link direto para a página de perfil.\n\n### 1.3 Passo a passo de integração (resumo fiel de `Etapas-organograma.md`)\n\nO guia usa **página 10** — no app real a página é a **3** (troque `P10_` → `P3_`; o histórico de carreira já espera `P3_ID_FOCO`).\n\nRemover da versão antiga (se existir): URLs da OrgChart JS, região `painel-detalhes`, DA de Page Load, processos `GET_ORGANOGRAMA` e `GET_DETALHES_SETOR`, função `fn_organograma_json`. Pode manter `DOWNLOAD_FOTO`; tabela `departamento_metrica` e coluna `id_lider` ficaram sem uso.\n\n1. **Banco:** rodar `organograma.sql` (cria/recria view e package). Reexecutar após cada mudança.\n2. **Itens:** `P10_ID_FOCO` Hidden, *Value Protected = No* (o JS altera). `P10_BUSCA` Popup LOV, placeholder \"Buscar pessoa no organograma\", label oculto, na região de título alinhado à direita; LOV:\n   `select nome_completo || ' — ' || cargo d, id_colaborador r from vw_org_colaborador order by nome_completo`\n3. **Região de título:** template de título Redwood, \"Organograma\" / \"Estrutura da Corlix a partir das relações de gestão.\"\n4. **Região principal:** Dynamic Content · Static ID `organograma` · Template *Blank with Attributes* · Page Items to Submit `P10_ID_FOCO` · Source acima.\n5. **Processo** `ORG_DETALHES`: Execute Code, ponto *Ajax Callback* (código acima).\n6. **CSS:** `organograma.css` como Static Application File (`#APP_FILES#organograma.css`) ou CSS Inline.\n7. **JS:** bloco 1 → *Function and Global Variable Declaration*; bloco 2 → *Execute when Page Loads*; bloco 3 → DA *Change* em `P10_BUSCA` → Execute JavaScript Code.\n8. **Ajustar constantes** do package (`c_pagina_perfil/c_item_perfil`, `c_pagina_chat/c_item_chat`, `c_nome_empresa`) e reexecutar o SQL.\n9. **Fotos BLOB:** criar Application Item `ID_COLABORADOR` + Application Process `DOWNLOAD_FOTO` (não existem no app hoje).\n\nDeep-link previsto: `...:P10_ID_FOCO:<id>`. Atenção: a página 3 tem `pageAccessProtection: argumentsMustHaveChecksum`, então só URLs geradas com checksum (`apex_page.get_url`) funcionam.\n\n### 1.4 API JavaScript (`organograma.js`)\n\nConstantes: `ORG_ITEM_FOCO = \"P10_ID_FOCO\"`, `ORG_REGIAO = \"organograma\"`, `ORG_PROCESSO_DETALHES = \"ORG_DETALHES\"`. Estado: `orgDrawer` (dialog singleton), `orgPedido` (contador para descartar respostas atrasadas).\n\n| Função | Faz |\n|---|---|\n| `orgId(valor)` | converte para número > 0 ou `null` |\n| `orgIrPara(id)` | `apex.item(ORG_ITEM_FOCO).setValue(id)` + `apex.region(ORG_REGIAO).refresh()` (só a região, sem recarregar a página) |\n| `orgObterDrawer()` | cria uma vez `<dialog class=\"org-drawer\" aria-labelledby=\"org-drawer-nome\"><div class=\"org-drawer__painel\">` no `body`, com listener `orgCliqueNoDrawer` |\n| `orgAbrirDetalhes(id)` | mostra spinner (`aria-busy`), `showModal()`, chama `apex.server.process(\"ORG_DETALHES\", {x01: id}, {dataType: \"text\"})`; `done` → injeta HTML e foca `#org-drawer-nome`; `fail` → estado de erro com \"Tentar novamente\"/\"Fechar\" |\n| `orgCopiar(botao)` | `navigator.clipboard.writeText(data-valor)`, classe `is-copiado` por 2 s, anuncia em `.org-sr` (`aria-live`) |\n| `orgCliqueNoDrawer(ev)` | clique no backdrop fecha; delegação por `data-acao`: `fechar`, `detalhe` (troca conteúdo sem fechar), `equipe` (fecha + `orgIrPara`), `copiar` |\n\nExecute when Page Loads: `$(\"#organograma\").on(\"click\", \"[data-acao]\")` → `foco` ⇒ `orgIrPara`, `detalhe` ⇒ `orgAbrirDetalhes`; `$(\"#organograma\").on(\"apexafterrefresh\")` → foca `#org-foco-nome` (`preventScroll`). DA de busca: `orgIrPara($v(\"P10_BUSCA\"))` e limpa o item com `setValue(\"\", null, true)` (suppressChangeEvent).\n\nContrato HTML↔JS: atributos `data-acao` ∈ {`foco`, `detalhe`, `equipe`, `fechar`, `copiar`} + `data-id` / `data-valor`. Esc, foco preso e scrim vêm do `<dialog>` nativo.\n\n### 1.5 HTML gerado e classes CSS\n\n```\ndiv.org\n ├─ nav.org-caminho[aria-label] > svg + ol > li > (button.org-link[data-acao=foco] | span[aria-current=page]) ; li > span.org-caminho__sep\n ├─ div.org-arvore\n │   ├─ section.org-foco > div.org-foco__id > span.org-avatar.org-avatar--lg + div.org-foco__texto(h2#org-foco-nome.org-foco__nome[tabindex=-1], p.org-foco__cargo) + span.org-tag\n │   │                   p.org-foco__resumo ; div.org-foco__acoes > button.org-btn[data-acao=detalhe] + a.org-btn (Conversar)\n │   ├─ div.org-conectores.org-conectores--um|--varios[aria-hidden]\n │   └─ ul.org-filhos(.org-filhos--um) > li.org-card\n │        ├─ div.org-card__id > avatar--md + div.org-card__texto(button.org-card__nome[data-acao=detalhe], p.org-card__cargo)\n │        └─ div.org-card__equipe > (p.org-card__sem | div.org-avatares(avatar--sm…, .org-avatar--mais) + div.org-card__equipe-texto(span.org-card__rotulo, span.org-card__nomes) + button.org-ver-equipe[data-acao=foco])\n │   (ou p.org-vazio \"… não tem subordinados diretos.\")\n └─ p.org-ajuda\ndialog.org-drawer > div.org-drawer__painel >\n   header.org-drawer__cab (avatar--lg, div.org-drawer__ident > h2#org-drawer-nome.org-drawer__nome + p.org-drawer__cargo, button.org-icone-btn[data-acao=fechar])\n   div.org-drawer__corpo > section.org-secao (h3.org-secao__titulo)\n       Contato: div.org-contato > svg + div.org-campo(span.org-campo__rotulo, a.org-campo__valor) + button.org-icone-btn.org-copiar[data-acao=copiar](.org-ico-copiar/.org-ico-ok) + span.org-sr\n       Na estrutura: div.org-grupo > ul.org-lista > li > button.org-linha[data-acao=detalhe](avatar--row, span.org-linha__texto > .org-linha__nome/.org-linha__sub, chevron) ; p.org-grupo__vazio ; p.org-grupo__mais ; button.org-ver-equipe[data-acao=equipe]\n       Sobre: dl.org-dados > div > dt/dd\n       p.org-privacidade\n   footer.org-drawer__rodape > a.org-btn.org-btn--auto (+ .org-btn--primario \"Ver perfil completo\")\n   (estados: div.org-drawer__estado com span.org-spinner)\n```\n\nCSS: tokens `--org-*` declarados em `.org, .org-drawer`, lendo `--cx-*` do `corlix-tema.css` com fallback (`var(--cx-primaria, #00688C)` etc.); variantes de avatar `--lg 56px / --md 48px / --row 36px / --sm 30px`; o card inteiro é clicável via `.org-card__nome::after { position:absolute; inset:0 }` e \"Ver equipe\" fica acima com `z-index:1`; foco de teclado do card via `:has(.org-card__nome:focus-visible)`; conectores com `::before/::after`; drawer lateral com animação (desligada em `prefers-reduced-motion`), `::backdrop` rgba; breakpoint `max-width: 760px` (1 coluna, sem barra horizontal dos conectores).\n\n### 1.6 Status\n\nFeito (nos arquivos do módulo): view, package com `render` + `render_detalhes`, CSS e JS do redesign + drawer, guia. Pendente: **nada montado na página 3**; criar itens/região/callback; ajustar `P10_`→`P3_` (JS e Source); apontar `c_pagina_perfil`/`c_pagina_chat` para páginas reais; criar `ID_COLABORADOR`/`DOWNLOAD_FOTO`; commitar as mudanças locais; flag de privacidade (opcional); filtro por empresa (ver pegadinhas).\n\n### 1.7 Pegadinhas\n\n- **Sem isolamento multi-tenant:** `vw_org_colaborador` e `id_raiz` **não filtram por `id_empresa`**. Com mais de uma empresa no schema, o \"topo\" é o menor ID global e a LOV de busca lista todos. O histórico de carreira resolve isso com `G_ID_EMPRESA`; o organograma precisa do mesmo filtro (ex.: `and c.id_empresa = to_number(sys_context('APEX$SESSION', ...))`/`v('G_ID_EMPRESA')` ou parâmetro).\n- `c_nome_empresa` é constante \"um app por cliente\" — o app já tem `G_NOME_EMPRESA`; considerar usá-lo.\n- `c_pagina_perfil = 20` **colide** com a página 20 \"Dashboard RH\" planejada pelo histórico de carreira. O perfil existente é a p. 2 (Meu Perfil, sem item de ID); o chat é a p. 4, que usa `P4_CONTATO_ID`/`P4_CANAL_ID` setados por DA de clique — confirme se aceita deep-link antes de apontar `c_item_chat`.\n- Mais de 2 subordinados: cards quebram em linhas de 2 e os conectores só ligam a primeira linha.\n- `P10_ID_FOCO` precisa de *Value Protected = No* e estar em *Page Items to Submit*; senão o refresh ignora a troca de foco.\n- O Ajax Callback devolve HTML cru (`p_escape => false`); todo dado já é escapado no package — mantenha `e()`/`a()` ao editar.\n- `render_detalhes` não verifica permissão; qualquer sessão pode pedir qualquer `x01`.\n\n---\n\n## 2. Histórico de Carreira\n\n### 2.1 Objetivo e regras de negócio\n\nTrajetória profissional de cada colaborador (admissão, promoção, mudança de cargo, transferência, mudança de gestão, efetivação de contrato, mérito, jornada, afastamento/retorno, desligamento, readmissão) + formações/certificações, exibida em linha do tempo (protótipo \"Histórico de carreira — nova página\"). O histórico é **fonte de verdade do RH e imutável**: efetivado não se altera nem exclui; correção = **estorno + novo lançamento**.\n\n- Ciclo de vida: `RASCUNHO` (`registrar_movimentacao` / `atualizar_rascunho` / `excluir_rascunho`) → `EFETIVADO` (`efetivar_movimentacao`, atualiza `COLABORADOR`: cargo, departamento, gestor, status) → `ESTORNADO` (`estornar_movimentacao` cria um lançamento de estorno `EFETIVADO` com `ID_REGISTRO_ESTORNADO` e restaura a situação anterior). Só a **última** movimentação válida pode ser estornada.\n- \"Movimentação válida\" = efetivada, não estornada e que não é estorno (`VW_MOVIMENTACAO_VALIDA`).\n- Snapshot completo (anterior e novo, inclusive `ID_GESTOR_ANTERIOR`) gravado na efetivação.\n- Bloqueios: data retroativa à última efetivada; data além de `qt_dias_futuro` (padrão 30); antes da admissão; após desligamento; cargo de outro departamento; objetos de outra empresa. Erros `-20001..-20020` (constantes `c_err_*` na spec), traduzidos por `fn_tratar_erro`.\n- Readmissão = `ADMISSAO` após `DESLIGAMENTO` (reativa `STATUS`, atualiza `DATA_ADMISSAO`). Desligamento grava `STATUS = false` → some do organograma.\n- \"Hoje\" no fuso da empresa (`fn_hoje`, `CONFIG_CARREIRA.DS_FUSO_HORARIO`, padrão `America/Sao_Paulo`) — o ADB roda em UTC.\n- Comunicado automático (admissão, readmissão, promoção, transferência) em `COMUNICADO` para o departamento destino, mesma transação; nunca menciona salário; desligável por `FL_COMUNICADO_AUTOMATICO`.\n- Perfis: `ADMIN_RH` vê/altera tudo da empresa (salário com log em `LOG_ACESSO_SALARIAL`, transação autônoma); `GESTOR` vê a equipe em qualquer nível abaixo, sem mérito e sem motivo de afastamento; `COLABORADOR` vê o próprio histórico (inclusive mérito) e pode **solicitar correção** (`SOLICITACAO_CORRECAO`).\n- Multi-tenant por Application Item `G_ID_EMPRESA` (não VPD), em 3 camadas: queries filtram `:G_ID_EMPRESA`; o package recusa objetos de outra empresa; em sessão APEX confere a empresa contra `G_ID_EMPRESA` (sessão sem empresa é bloqueada).\n- Package **não faz commit** (APEX comita no fim do request: salvar+efetivar é uma transação só).\n- Triggers só de auditoria (`DT_`/`USR_`, `LOG_AUDITORIA_CARREIRA`, bloqueio de UPDATE/DELETE direto em efetivado — erro `-20013`).\n\n### 2.2 Arquitetura e arquivos\n\n| Ordem | Arquivo | Conteúdo |\n|---|---|---|\n| — | `instalar.sql` | roda tudo no SQLcl (`whenever sqlerror exit failure rollback`), lista inválidos no fim |\n| 00 | `00_verificar_schema.sql` | exige 23ai e confere colunas reaproveitadas (`EMPRESA`, `DEPARTAMENTO`, `CARGO`, `COLABORADOR`, `COMUNICADO`) |\n| 01 | `01_ddl_historico_carreira.sql` | `config_carreira`, `tipo_movimentacao`, `historico_carreira`, `formacao_colaborador`, `solicitacao_correcao`, `log_acesso_salarial`, `log_auditoria_carreira` (`create table if not exists`) |\n| 02 | `02_seed_tipo_movimentacao.sql` | `prc_seed_tipo_movimentacao` + 11 códigos: `ADMISSAO, PROMOCAO, MUDANCA_CARGO, MUDANCA_GESTOR, TRANSFERENCIA_DEPTO, EFETIVACAO_CONTRATO, MERITO, ALTERACAO_JORNADA, AFASTAMENTO, RETORNO, DESLIGAMENTO` (por empresa, `MERGE ... USING (VALUES ...)`) |\n| 03 | `03_views_carreira.sql` | `fn_carreira_ve_salario`, `vw_movimentacao_valida`, `vw_historico_carreira` (salário nulo p/ não-RH), `vw_carreira_timeline`, `vw_situacao_atual_colaborador` |\n| 04 | `04_pkg_historico_carreira.pks/.pkb` | regras de negócio (API abaixo) |\n| 08 | `08_pkg_historico_carreira_ui.sql` | `pkg_historico_carreira_ui.render` → HTML da p. 13 (instalado como \"04b\", antes das triggers) |\n| 05 | `05_triggers_auditoria.sql` | `trg_*_aud` / `trg_*_log` |\n| 06 | `06_carga_inicial.sql` | admissão para colaboradores existentes (sem comunicado) |\n| 07 | `07_testes.sql` | 2 empresas, 10 colaboradores, teste por regra e isolamento; termina em rollback |\n| 09 | `09_dados_demo_dashboard.sql` | Opcional (fora do `instalar.sql`): massa `[DEMO]` na empresa `C_EMPRESA` para a p. 20, com login `DEMO.CARREIRA.*`, cargos `[DEMO] Analista I/II` nos 4 primeiros departamentos e 10 promoções (4/3/2/1). Faz DML direto (efetivado, sem comunicado), porque no SQL Workshop o package deve ver a sessão do Builder sem `G_ID_EMPRESA` e recusar com -20012 (dedução pelo código, não testada) |\n| 10 | `10_remover_dados_demo.sql` | Remove a massa do 09. Desliga `trg_historico_carreira_aud` só durante o DELETE e a religa, inclusive se der erro |\n| front | `historico-carreira.css` (p. 13), `historico-carreira-pagina.js` (p. 13), `historico-carreira.js` (modal p. 18) | |\n\nInstalação: `cd modulos/historico-carreira && sql <usuario>@<servico> @instalar.sql`.\n\n**API PL/SQL (`pkg_historico_carreira`)**: `fn_hoje(id_empresa)`, `fn_data_local(id_empresa, ts)`, `fn_id_tipo(id_empresa, cd)`, `registrar_movimentacao(...) return id`, `atualizar_rascunho`, `excluir_rascunho`, `efetivar_movimentacao(id)`, `estornar_movimentacao(id, motivo)`, `registrar_admissao_automatica(id_colaborador)`, `solicitar_correcao(...) return id`, `responder_solicitacao(id, st, resposta)`, `fn_periodo`, `fn_tempo_no_cargo`, `fn_tempo_de_casa`, `fn_pode_ver_colaborador(id) return 'S'|'N'` (RH; o próprio; gestor de qualquer nível acima via `connect by`; fora de sessão APEX = 'S'), `registrar_acesso_salarial(id, contexto)`, `fn_empresa_contexto`, `definir_empresa_contexto`, `fn_tratar_erro(apex_error.t_error)`. Constantes: `c_st_rascunho/efetivado/estornado`, `c_auth_admin_rh = 'ADMIN_RH'`, `c_dias_futuro_padrao = 30`, `c_fuso_padrao`.\n\n**`pkg_historico_carreira_ui`** (`authid definer`), constantes de destino (página nula ⇒ link some):\n\n| Constante | Padrão |\n|---|---|\n| `c_pagina_organograma` / `c_item_organograma` | 3 / `P3_ID_FOCO` |\n| `c_pagina_comunicado` / `c_item_comunicado` | 11 / null (abre a lista) |\n| `c_pagina_holerite` | null (link \"Ver holerite\" oculto) |\n| `c_pagina_solicitacao` / `c_item_solicitacao` | 22 / `P22_ID_COLABORADOR` |\n| `c_pagina_painel_rh` | 20 |\n\n`render(p_id_colaborador)`: valida `fn_pode_ver_colaborador` (senão `-20012`); lê colaborador + empresa (`nvl(nome_fantasia, nome)`); `g_proprio` (login = `APP_USER`), `g_rh` (`apex_authorization.is_authorized('ADMIN_RH')` ou fora do APEX); situação atual de `vw_situacao_atual_colaborador` com fallback ao cadastro; cursor `c_eventos` = `union all` de `MOV` (historico efetivado/estornado + joins de nomes, início do cargo anterior, desligamentos anteriores), `DEV` (formações) e `MARCO` (aniversários de casa, 1 por ano completo); filtra `MERITO` para quem não é o próprio nem RH; motivo de `AFASTAMENTO/RETORNO` oculto para terceiros não-RH. Nunca exibe salário.\n\n### 2.3 Passo a passo de integração (resumo fiel de `Etapas-historico-carreira.md`)\n\nPré-requisito: `instalar.sql`. Depois de montar no Builder, exportar em APEXlang para `corlixhub/pages/`. Páginas: 13 Histórico de carreira, 18 Movimentação (modal), 19 Formações, 20 Dashboard RH, 21 Formação (modal, formulário com anexo), 22 Solicitar correção (modal), 23 Responder solicitação (modal). Se o número estiver ocupado, trocar prefixos no Builder, no `historico-carreira.js` e nas constantes do `08_`.\n\n**1. Shared Components**\n- App Item `G_ID_EMPRESA` (Restricted – may not be set from browser) + App Process `SET_G_ID_EMPRESA` (*After Authentication*): `select id_empresa into :G_ID_EMPRESA from colaborador where upper(trim(login_apex)) = upper(trim(:APP_USER))` (null em no_data_found/too_many_rows). Sessões abertas precisam relogar.\n- Role `Admin RH` (Static ID `ADMIN_RH`); Authorization Schemes **com estes nomes exatos**: `ADMIN_RH` (Is In Role), `GESTOR` (tem ≥1 subordinado direto na empresa), `COLABORADOR` (é RH ou tem cadastro na empresa) — todos *Once per session*.\n- Erros: no `log_pkg.apex_error_handler`, delegar `ora_sqlcode between -20099 and -20001` para `pkg_historico_carreira.fn_tratar_erro` (opção A) ou usar essa função como Error Handling das p. 18/19/21 (opção B).\n- LOVs: `LOV_TIPO_MOVIMENTACAO`, `LOV_DEPARTAMENTO_EMPRESA`, `LOV_COLABORADOR_ATIVO` (todas filtram `:G_ID_EMPRESA`), `LOV_TIPO_FORMACAO` estática (`GRADUACAO, POS, MBA, CURSO, CERTIFICACAO, IDIOMA`).\n\n**2. Página 13**\n- Authorization `COLABORADOR`; item `P13_ID_COLABORADOR` Hidden, Value Protected, *Checksum Required – Session Level*; **remover** a região Breadcrumb (título e \"Exportar PDF\" vêm na região).\n- Before Header: (10) colaborador padrão = o próprio usuário; (20) validar acesso (`fn_pode_ver_colaborador = 'N'` ⇒ `-20012`); (30, auth `ADMIN_RH`) `registrar_acesso_salarial(..., 'P13 · lançamentos do histórico')`.\n- CSS `#APP_FILES#historico-carreira#MIN#.css` (subir também `.min.css`) ou inline; JS `historico-carreira-pagina.js` bloco 1/bloco 2; page template Standard, *Remove Body Padding* se houver.\n- Região **Dynamic Content**, Static ID **`historico_carreira`**, *Blank with Attributes*, Source `return pkg_historico_carreira_ui.render(:P13_ID_COLABORADOR);`, Page Items to Submit `P13_ID_COLABORADOR`.\n- Região \"Lançamentos (RH)\": Interactive Report sobre `vw_historico_carreira` (auth `ADMIN_RH`, collapsible fechada); colunas de salário com condição `ADMIN_RH`; `ID_HISTORICO_CARREIRA` como link para p. 18 (`P18_ID_HISTORICO_CARREIRA`, `P18_ID_COLABORADOR`).\n- Região \"Barra do RH\" (seq. 10, auth `ADMIN_RH`, template Blank with Attributes (No Grid), CSS class `hc-barra-rh`, Static ID `hc_barra_rh`): numa linha acima do título, `P13_COLABORADOR_SELECIONADO` (10), `FORMACOES` → p. 19 (20) e `NOVA_MOVIMENTACAO` → p. 18 (30, Hot). Fica fora do protótipo e só o RH vê; o estilo está em `historico-carreira.css` (os tokens `--hc-*` valem para `.hc` e `.hc-barra-rh`) e a barra é escondida na impressão. O mesmo CSS zera o padding do corpo e pinta o fundo `--cx-fundo` só nessa página (`body:has([data-hc])`), para a P13 (e a P19, que usa o mesmo cabeçalho) ocupar a largura e a altura toda como no protótipo.\n- DA \"Atualizar depois da modal\": *Dialog Closed* em `document` → Refresh das duas regiões.\n- Seletor do RH: Popup LOV `P13_COLABORADOR_SELECIONADO` (auth `ADMIN_RH`, inclui inativos) → DA Change › Submit `TROCAR_COLABORADOR` → processo `:P13_ID_COLABORADOR := :P13_COLABORADOR_SELECIONADO` → branch para a 13. Recarrega a página para os processos Before Header rodarem de novo.\n\n**3. Página 18 (modal, `ADMIN_RH`)** — Form sobre `VW_HISTORICO_CARREIRA`, **sem** Automatic Row Processing. Itens: `P18_ID_HISTORICO_CARREIRA`, `P18_ID_COLABORADOR` (checksum), `P18_ST_REGISTRO` (display, default RASCUNHO), `P18_FL_ESTORNO`, `P18_CD_TIPO` (Hidden, Value Protected **No**), `P18_ID_DEPARTAMENTO_ATUAL`, `P18_ID_TIPO_MOVIMENTACAO`, `P18_DT_EFETIVA` (`DD/MM/YYYY`), `P18_NM_CARGO_ANTERIOR`, `P18_NM_DEPARTAMENTO_ANTERIOR`, `P18_ID_DEPARTAMENTO_NOVO`, `P18_ID_CARGO_NOVO` (cascading LOV pai `P18_ID_DEPARTAMENTO_NOVO`, submit `P18_ID_DEPARTAMENTO_ATUAL`, Parent Required No), `P18_ID_GESTOR_NOVO`, `P18_VL_SALARIO_ANTERIOR/NOVO` (condição `ADMIN_RH`), `P18_DS_MOTIVO`, `P18_ID_APROVADOR` (LOV `LOV_COLABORADOR_ATIVO`, opcional, todos os tipos), `P18_DS_OBSERVACAO`; `P18_DS_MOTIVO_ESTORNO` fica numa região Static Content própria (\"Estorno\", condição EFETIVADO e não estornado), fora do Form, porque dentro dele não aceita digitação num lançamento existente (Form sem bloco `edit`; ver `09` §4.8). Read Only quando `ST_REGISTRO <> 'RASCUNHO'`. DA \"Tipo mudou\" (Change em `P18_ID_TIPO_MOVIMENTACAO`): Set Value SQL → `P18_CD_TIPO` (Items to Submit `P18_ID_TIPO_MOVIMENTACAO`, Wait For Result On, Fire on Initialization Off); depois `carreira.ajustarCampos(true);` (seq. maior, Fire on Initialization Off). Itens de cargo/depto/gestor/salário com Value Required Off (a obrigatoriedade é do JS + package). Botões na região `Botões` (Static Content · Buttons Container · slot Dialog Footer, como na P27), todos com `ADMIN_RH`: `CANCELAR` (Close · DA Cancel Dialog), `EXCLUIR` (Delete · confirmação · sem validações), `ESTORNAR` (Delete · Danger · confirmação · sem validações orizontal**, série única \"Promoções\" (`#00688C`, sem legenda, rótulo na ponta, eixo y inteiro a partir de 0, Page Items to Submit na série, `group by d.id_departamento, d.nome`); 5.2 = Chart Bar **vertical agrupado** (Stack Off, static ID `grafico_turnover`, seq 25), séries \"Admissões\" (`#00688C`) e \"Desligamentos\" (`#B3261E`) com a mesma query e Page Items to Submit nas duas, legenda e nome da série no tooltip; a query gera todos os meses do período (`connect by`, zero nos meses vazios) e conta só as datas exatas entre De e Até, então o primeiro e o último mês podem ser parciais; 5.3 = tempo médio no cargo, `group by s.id_departamento, s.nm_departamento`, sem Refresh (usa `fn_hoje`); relatório de formações a vencer (qualquer tipo com validade); IR de solicitações abertas com link \"Responder\" (modal 23 → `responder_solicitacao`).\n\n**6. Página 22** — modal \"Solicitar correção\" (`P22_ID_COLABORADOR` checksum, `P22_ID_HISTORICO_CARREIRA` opcional, `P22_DS_MENSAGEM`) → `solicitar_correcao`; o package confere que quem pede é o próprio.\n\n**7. Ligações:** p. 14 processo \"Registrar admissão\" (seq. 15, após \"Salvar Dados Colaborador\") → `registrar_admissao_automatica(:P14_ID_COLABORADOR)` + botão \"Histórico de carreira\"; p. 12 coluna-link \"Histórico\"; p. 2 botão \"Meu histórico\"; menu \"Histórico de carreira\" e \"Dashboard RH\". Checklist de teste no item 8 do guia.\n\n### 2.4 API JavaScript\n\n**`historico-carreira-pagina.js` (p. 13, namespace `hc`)** — puramente client-side, sem chamadas ao servidor (abas e ano filtram no DOM):\n\n| Função | Faz |\n|---|---|\n| `hc.plural(n)` | \"1 registro\" / \"N registros\" |\n| `hc.filtrar(raiz)` | lê aba `[role=tab][aria-selected=true]` (`data-hc-filtro` = `tudo|mov|dev`) e `select[data-hc-ano]`; seta `hidden` em `.hc-evento` (por `data-grupo`/`data-ano`), marca último visível `.is-ultimo`, recalcula `.hc-ano__qt`, esconde anos vazios, `.is-primeiro`, mostra `[data-hc-sem-resultado]` |\n| `hc.iniciar()` | idempotente (`hc.iniciado`); listeners **delegados no `document`** (sobrevivem ao refresh): click em aba / `[data-hc-acao=exportar]` (`window.print()`), change em `[data-hc-ano]`, setas ←/→ entre abas (WAI-ARIA tablist), `beforeprint/afterprint` mostram tudo e restauram (`data-hc-oculto`) |\n| `hc.preparar()` | aplica `hc.filtrar` a cada `[data-hc]` |\n\nPage Load: `hc.iniciar(); hc.preparar(); $(\"#historico_carreira\").on(\"apexafterrefresh\", hc.preparar);`\n\n**`historico-carreira.js` (modal p. 18, namespace `carreira`)** — `carreira.visivelEm` / `carreira.obrigatorioEm` / `carreira.itens` mapeiam grupos (`cargo`, `departamento`, `gestor`, `salario`) → códigos de tipo → itens P18. `carreira.ajustarCampos(limpar)`: lê `$v('P18_CD_TIPO')`, `apex.item().show()/hide()`, limpa ocultos quando `limpar !== false`, alterna `is-required` no `#<ITEM>_CONTAINER`; ignora itens não renderizados (`$x`). Page Load: `ajustarCampos(false)` (preserva rascunho); DA: `ajustarCampos(true)`. Visibilidade: cargo em PROMOCAO/MUDANCA_CARGO/TRANSFERENCIA_DEPTO/ADMISSAO; departamento em TRANSFERENCIA_DEPTO/ADMISSAO; gestor também em MUDANCA_GESTOR (obrigatório); salário em PROMOCAO/MUDANCA_CARGO/MERITO/ADMISSAO. O servidor revalida.\n\n### 2.5 HTML gerado e classes CSS\n\n```\ndiv.hc[data-hc]\n ├─ header.hc-titulo > div(h1 \"Histórico de carreira\", p) + button.hc-btn[data-hc-acao=exportar]\n └─ div.hc-conteudo\n     ├─ div.hc-principal\n     │   ├─ section.hc-card.hc-resumo > div.hc-indicadores > div.hc-indicador×3 (.hc-indicador__rotulo/__valor/__detalhe: Tempo de casa, No cargo atual|No último cargo, Promoções)\n     │   │      div.hc-cargos > h2.hc-subtitulo + div.hc-faixa[role=list] > div.hc-faixa__seg(.is-atual|--vazio)[style=flex-grow:<dias>] + div.hc-eixo > span[style=left:%] … span.hc-eixo__fim\n     │   └─ section.hc-card.hc-linha-tempo\n     │        div.hc-abas > div.hc-abas__lista[role=tablist] > button[role=tab][data-hc-filtro=tudo|mov|dev] ; label.hc-filtro > select[data-hc-ano]\n     │        ol.hc-linha > li.hc-ano[data-ano](span.hc-ano__rotulo, span.hc-ano__divisor > span.hc-ano__qt)\n     │                    li.hc-evento(.is-estornado)[data-grupo=mov|dev|marco][data-ano]\n     │                       time.hc-evento__data + div.hc-evento__corpo > span.hc-ponto.hc-ponto--forte|suave|neutro|alerta (svg)\n     │                         div.hc-evento__titulo(h3, span.hc-tag(.hc-tag--alerta|--aviso), span.hc-pill \"Cargo atual\")\n     │                         p.hc-evento__desc ; div.hc-antes-depois (span.hc-rotulo Antes/Depois) | div.hc-pessoas > div.hc-pessoa(span.hc-avatar(.hc-avatar--destaque))\n     │                         div.hc-evento__rodape > div.hc-evento__metas > span.hc-meta ; a.hc-link\n     │                         div.hc-aviso (comunicado automático + \"Ver comunicado\")\n     │        p.hc-vazio[data-hc-sem-resultado][hidden]\n     └─ aside.hc-lateral > section.hc-card (h2.hc-card__titulo \"Posição atual|Última posição\", dl.hc-posicao, div.hc-card__rodape \"Ver no organograma\")\n                         section.hc-card > div.hc-sobre > ul(li > span.hc-sobre__icone …) + div.hc-sobre__correcao + p.hc-sobre__status + a.hc-btn.hc-btn--bloco \"Solicitar correção\"\n```\n\nCSS: tokens `--hc-*` em `.hc` lendo `--cx-*` com fallback; `.hc [hidden] { display:none !important }` (necessário porque as classes usam `display:flex`); breakpoints 1100px e 720px; `@media print` esconde chrome do Universal Theme (`.t-Header, .t-Body-nav, .t-Body-actions, .t-Breadcrumb, .t-Footer`), abas e botões, força `print-color-adjust` na faixa atual — é o \"Exportar PDF\".\n\n### 2.6 Status\n\nFeito (no módulo): DDL, seed, views, package de regras, package de UI, triggers, carga inicial, testes, CSS/JS, README + guia detalhado. Pendente: **pasta inteira untracked** (não commitada); nada instalado no export `database/f100.sql`; nenhuma página montada (13 é placeholder; 18–23 inexistentes); faltam `G_ID_EMPRESA` + `SET_G_ID_EMPRESA`, role/authorizations, LOVs, delegação no `log_pkg.apex_error_handler`, ligação com p. 14/12/2 e menu. Sem dado no modelo: PDI/Resultados 360 (aba \"Desenvolvimento\" mostra só formações; acrescentar `union all` em `c_eventos` com `ds_grupo = 'DEV'`), regime CLT. \"Aprovado por\" vem de `HISTORICO_CARREIRA.ID_APROVADOR`, informado pelo RH (sem fluxo de aprovação).\n\n### 2.7 Pegadinhas\n\n- Nomes de authorization scheme **exatos** (`ADMIN_RH`): o package chama `apex_authorization.is_authorized('ADMIN_RH')`.\n- Usuário sem linha em `COLABORADOR` não recebe `G_ID_EMPRESA` ⇒ bloqueado (inclusive RH). `G_ID_EMPRESA` só é setado no After Authentication: relogar após publicar.\n- `fn_pode_ver_colaborador` e `render` liberam tudo **fora de sessão APEX** (scripts/jobs do owner) — `07_testes.sql` depende disso; `url()` devolve `#` fora do APEX.\n- Remover o gestor não é possível por movimentação (gestor vazio = manter atual). Excluir colaborador com histórico é bloqueado por FK (use `DESLIGAMENTO`).\n- Carga inicial: inativos pré-instalação recebem só admissão (sem desligamento) → turnover histórico incompleto.\n- Comunicados automáticos não têm imagem; o card da Home reserva 260px para capa.\n- `c_pagina_painel_rh = 20` colide com o `c_pagina_perfil = 20` do organograma (ver 1.7). `c_item_organograma = 'P3_ID_FOCO'` exige que o organograma seja montado na p. 3 com esse nome de item (o guia do organograma usa `P10_`).\n- Enquanto o organograma não estiver instalado, `c_pagina_organograma` fica `null` em `08_pkg_historico_carreira_ui.sql` (o link \"Ver no organograma\" some). Ao integrar o organograma na p. 3, volte para `3` e rode o arquivo de novo.\n- Formações não usam Interactive Grid: no 26.1.5 não há onde ligar a edição de uma região existente, e o IG não tinha upload. Por isso lista (19) + formulário em modal (21).\n- Instalação manual (sem `instalar.sql`): rode `04_pkg_historico_carreira.pks` **antes** do `.pkb` e os dois antes do `08_pkg_historico_carreira_ui.sql`. Rodar fora de ordem gera `PLS-00201`/`PLS-00304` (ver 08 §3, \"SQL e PL/SQL\").\n- Salvar e efetivar na mesma submissão: se a efetivação falha, o rascunho também é desfeito (sem commit no package).\n\n---\n\n## 2A. Home (`modulos/home/`)\n\nNova Home conforme `pen_dev/Início.png`. O guia previa a página nova 28, mas o time montou direto na página 1 (renomeada \"Início\"). Mesmo padrão \"Dynamic Content renderizado por PL/SQL\", sem tabelas novas.\n\n| Arquivo | Conteúdo |\n|---|---|\n| `pkg_home_ui.pks` / `.pkb` | `mes_atual`, `render_hero` (\"Olá, <primeiro nome>\", data por extenso no fuso `America/Sao_Paulo`, 3 links rápidos), `render_meu_gestor` (gestor com Chat → p4 via `apex_page.get_url` e E-mail `mailto:`; dois estados vazios: sem vínculo com a empresa × sem gestor), `render_aniversariantes(p_id_empresa, p_limite default 3, p_ver_todos default 'S')` (mês inteiro, `status = true`, próximos primeiro, selo \"Hoje\") |\n| `instalar.sql` | instala o package pelo SQLcl |\n| `home.css` / `home.min.css` | (§6 do guia) complementa a §12 do `custom.css` só na p. 1 (`#APP_FILES#home#MIN#.css`): hero sem arte, comunicados em carrossel (`cx-home-carrossel`, `cx-carrossel__*`), botões do Meu gestor, destaque \"hoje\" das celebrações |\n| `home-pagina.js` | bloco 1 `cxHomeCarregarFotos` e `cxHomeCarrossel` (setas e pontos sobre a Cards; refeito no `apexafterrefresh`) (fotos via `data-cx-foto` + `apex.env.APP_FILES`, mesmo padrão do organograma); bloco 2: \"Ver todos\" → `apex.theme.openRegion('aniversariantes_todos')` e aviso nos atalhos sem destino |\n| `home-hero.jpg` | arte do hero (recorte do protótipo); também em `corlixhub/shared-components/static-files/` |\n| `Etapas-home.md` | passo a passo no Builder 26.1.5 |\n\n**Protótipo de 28/10/2026 (§6 do guia):** saudação por horário (\"Bom dia/Boa tarde/Boa noite\"), atalhos Holerite (p9), Organograma (p3), Suporte TI (p34, depois do `modulos/suporte-ti/Etapas-suporte-ti.md` §13) e Chat (p4); comunicados em carrossel (5 mais recentes, selo \"N \"Ver em tabela\"/\"Ver gráfico\" e \"Ver todas\" → `apex.theme.openRegion` (HTML DOM IDs `dash_solicitacoes_todas`, `dash_formacoes_todas`) |\n| `instalar.sql` | instala o package |\n\n\"Responder\" → p23 e nome da formação → p19, ambos com `apex_page.get_url`. A DA de fechamento da p23 escuta `document` (mesmo padrão da p13).\n\n## 2D. Holerite digital (`modulos/holerite/`)\n\nRedesign da página 9 conforme `pen_dev/Holerite digital.png`, na própria página, no padrão \"Dynamic Content com package\". Guia: `modulos/holerite/Etapas-holerite.md`.\n\n| Arquivo | Conteúdo |\n|---|---|\n| `00_pkg_holerite.pks` / `.pkb` | cálculo da folha, sem o corte de 01/06/2026 e com `gerar_holerite` por pessoa |\n| `01_prc_gerar_holerites_pendentes.sql` | gera, por pessoa, o que falta desde a admissão, com o mês atual só a partir do dia 25; a página deixa de gerar ao abrir |\n| `02_pkg_holerite_ui.pks` / `.pkb` | `render_cabecalho`, `render_pagina(p_competencia)`; só leitura; o holerite do mês só aparece a partir do dia 25. `render_pagina` também gera o **aviso de crédito** do PDF (`aviso_credito`: grade do modelo de holerite impresso, matrícula = ID com 6 dígitos, códigos de rubrica fixos em `codigo_item`), oculto na tela |\n| `03_job_folha_mensal.sql` | job `JOB_FOLHA_MENSAL`, todo dia às 06:00 |\n| `holerite.css` / `.min.css` | classes `cx-hol-*`; o §8 (`@media print`) esconde a tela e imprime só o `.cx-hol-aviso` |\n| `holerite-pagina.js` | \"Mostrar/Ocultar valores\": a página sempre abre com os valores ocultos (máscara já no HTML do package, valor em `data-cx-hol-original`); o \"mostrar\" só sobrevive à troca de mês/ano, via `sessionStorage`; `window.print()`, seletor de ano e mensagem do modal |\n| `instalar.sql` | instala os packages e a procedure; não gera folha nem cria o job |\n\nMeses → p9 com `P9_COMPETENCIA`; \"Solicitar correção\" → p22 com `P22_DS_MENSAGEM` = `Holerite-MM/YYYY` (sem tabela nova; o pedido cai na fila do RH da p20). Ambos com `apex_page.get_url`.\n\n## 2B. Busca na intranet (`modulos/busca/`)\n\nGuia: `modulos/busca/Etapas-busca.md`. Protótipo `pen_dev/Busca (resultados).png` (`07` §4.17).\n\n| Arquivo | Conteúdo |\n|---|---|\n| `pkg_busca_ui.pks` / `.pkb` | `c_pagina` (29); `render_campo` (campo do header na Global Page, com `data-url` de `apex_page.get_url(29, p_clear_cache => 29)`; Enter → `&p29_termo=` + `encodeURIComponent`, ou sem termo na busca vazia, que lista tudo); `render_cabecalho(p_termo)` (\"Resultados para “…”\" + contagem); `render_resultados(p_termo, p_id_empresa, p_login)` (cards Pessoas e Comunicados, até 20 por grupo); `render_ajuda` |\n| `busca-pagina.js` | `cxBuscaCarregarFotos` (mesmo padrão da Home) |\n| `instalar.sql` | instala o package |\n\nPessoas: `colaborador` ativo (`status = true`) da empresa, por nome, cargo ou departamento; nome → p3 com `P3_ID_FOCO` (checksum via `apex_page.get_url`), \"Conversar\" → p4 (o chat não abre conversa por parâmetro). Comunicados: da empresa, por título ou pelos primeiros 2.000 caracteres do conteúdo; título → p11. Busca sem diferença de maiúsculas e acentos (`translate(lower(...))` com constantes do package) e com `%`/`_` do termo escapados. A p29 é *Unrestricted* e o `P29_TERMO` sem Value Protected, porque o termo chega pela URL. Fica para depois o grupo \"Páginas do menu\" do protótipo.\n\n---\n\n## 2E. Suporte TI (`modulos/suporte-ti/`)\n\nGuia: `modulos/suporte-ti/Etapas-suporte-ti.md`. Protótipo `pen_dev/Suporte TI.png`. Páginas 34 a 43, ainda não criadas no app. Os packages foram compilados e testados em Oracle 23ai local com as APIs do APEX simuladas; falta instalar no banco do app.\n\n| Arquivo | Conteúdo |\n|---|---|\n| `01_ddl_suporte.sql` / `02_seed_suporte.sql` | Tabelas, triggers, view; assuntos, sistemas, artigos e contatos de exemplo, por empresa |\n| `03_pkg_suporte.pks` / `.pkb` | `abrir_chamado`, `responder`, `confirmar_solucao`, `reabrir`, `atender`, `encerrar_vencidos`, `registrar_acesso_artigo`, `baixar_anexo`, `fn_situacao`, `fn_e_ti` |\n| `04_pkg_suporte_ui.pks` / `.pkb` | `render_*` das regiões; `ajax_buscar` e `ajax_confirmar` (respondem JSON `{ok, mensagem}`) |\n| `05_job_suporte.sql` | Job diário `SUPORTE_ENCERRAR_VENCIDOS` (23:30) |\n| `suporte.css` / `suporte.min.css`, `suporte-pagina.js` | Classes `cx-sup-*`; abas, busca, confirmação e fechamento do aviso |\n\nSituações: `ABERTO` → `EM_ATENDIMENTO` ⇄ `AGUARDANDO_USUARIO` → `RESOLVIDO` → `ENCERRADO`; `RESOLVIDO` volta para atendimento quando o colaborador reabre. Quem atende tem o papel `suporte-ti` (autorização `SUPORTE_TI`) e precisa de colaborador vinculado. O solicitante e a TI da mesma empresa veem o chamado; qualquer outra conta recebe -20077. Toda mensagem é vista pelo colaborador: não há nota interna. Anexo: até 5 MB, em PNG, JPG, PDF, TXT ou LOG; o tipo gravado vem da extensão, e o download nunca abre na página.\n\n---\n\n## 2D. Ponto eletrônico (`modulos/ponto-eletronico/`)\n\nGuia: `modulos/ponto-eletronico/Etapas-ponto-eletronico.md`. Protótipo `pen_dev/Ponto eletrônico.png`. Páginas 30 a 33 na app e packages no banco. Ajustes da validação de 03/11/2026 aplicados (`Etapas-ajustes-validacao.md`). Ajustes de `Etapas-meus-pedidos.md` também aplicados (o cartão Meus pedidos sai de `render_pendencias`). Fluxos validados na app em 03/11/2026, no ambiente DEV.\n\n| Arquivo | Conteúdo |\n|---|---|\n| `01_ddl_ponto.sql` / `02_seed_ponto.sql` | Tabelas, trigger, view; jornada padrão, vínculos e feriados nacionais de 2026–2027 |\n| `03_pkg_ponto.pks` / `.pkb` | `fn_dias` (cálculo por dia), `calcular_banco` (créditos com vencimento, o mais antigo é consumido primeiro), `registrar_marcacao`, `solicitar_ajuste`, `responder_ajuste`, `assinar_espelho`, `fn_pode_aprovar`, `fn_e_aprovador` |\n| `04_pkg_ponto_ui.pks` / `.pkb` | `render_*` das regiões e diálogos; `ajax_registrar`, `ajax_assinar`, `ajax_baixar_espelho` (respondem JSON `{ok, mensagem}`) |\n| `05_dados_demo.sql` / `06_remover_dados_demo.sql` | Dados de teste (`ds_origem = 'DEMO'`) |\n| `ponto.css` / `ponto.min.css`, `ponto-pagina.js` | Classes `cx-ponto-*`; relógio, chamadas Ajax e atualização das regiões por HTML DOM ID (`ponto_*`) |\n\nA hora registrada é sempre a do servidor no fuso da empresa (`pkg_historico_carreira.fn_data_local`). Marcação não muda: ajuste aprovado é uma nova linha, e `vw_ponto_marcacao_vigente` escolhe a que vale. Quem aprova é o gestor direto ou o RH, nunca o próprio colaborador. Não é um REP-P homologado (Portaria MTP 671/2021). Fora do escopo: férias e afastamentos, turno noturno, telas de cadastro de jornada e feriado, notificações.\n\n---\n\n## 3. `modulos/tema/`\n\n`README.md` + `Etapas-tema-paginas.md`: camada de variáveis CSS (`corlix-tema.css`, tokens `--cx-*`) sobre o Redwood Light. Os CSS dos módulos acima leem esses tokens com fallback, então funcionam com ou sem o tema carregado. Detalhes em **`04-tema-e-estilos.md`**.\n\n---\n\n## 4. Template: como criar um novo módulo no mesmo padrão\n\n```\nmodulos/<modulo>/\n  README-<modulo>.md          objetivo, regras, decisões, limitações (opcional p/ módulos pequenos)\n  Etapas-<modulo>.md          passo a passo no Builder (itens, regiões, callbacks, static IDs, constantes)\n  instalar.sql                @@ em ordem, whenever sqlerror exit failure rollback, lista INVALID no fim\n  00_verificar_schema.sql     (se reaproveita tabelas) confere colunas e versão 23ai\n  01_ddl_*.sql                create table if not exists …, sempre com ID_EMPRESA + índices iniciando por ela\n  03_views_*.sql              views com filtros de status/empresa\n  04_pkg_<modulo>.pks/.pkb    regras; erros -200xx em constantes c_err_*; sem commit\n  08_pkg_<modulo>_ui.sql      render(...) return clob\n  <modulo>.css                tudo escopado em .<prefixo>; tokens --<prefixo>-*: var(--cx-*, fallback)\n  <modulo>.js                 blocos comentados: 1 Global Declaration / 2 Page Load / 3 DAs\n```\n\nChecklist:\n1. **Prefixo** curto e único (`org`, `hc`, …) para classes CSS, namespace JS e Static ID da região.\n2. **Package UI**: copiar o esqueleto `g_html`/`inicia`/`p`/`e`/`a`; escapar **todo** dado (`e()` em texto, `a()` em atributo); ações como `<button type=\"button\" data-acao=\"...\" data-id=\"...\">` (nunca `onclick` inline); acessibilidade (`aria-label`, `aria-current`, títulos com `tabindex=\"-1\"` para receber foco após refresh); destinos de navegação em **constantes** (página/item) com `apex_page.get_url` (checksum).\n3. **Multi-tenant**: filtrar por `:G_ID_EMPRESA` nas views/queries e validar no package (o organograma ainda não faz — não repetir).\n4. **Região APEX**: Dynamic Content · Template *Blank with Attributes* · Static ID = prefixo · Source `return pkg_<m>_ui.render(:Pnn_ITEM);` · Page Items to Submit = itens lidos.\n5. **Interação**: troca de estado → `apex.item(...).setValue()` + `apex.region(id).refresh()`; conteúdo sob demanda → Ajax Callback (`apex_util.prn(p_clob => ..., p_escape => false)`, parâmetros em `apex_application.g_x01..`) chamado com `apex.server.process(NOME, {x01: ...}, {dataType: \"text\"})`, com contador para descartar respostas antigas; reaplicar estado no `apexafterrefresh`; preferir delegação de eventos (região ou `document`).\n6. **Itens alterados por JS**: *Value Protected = No*. Itens de ID vindos da URL: *Checksum Required – Session Level*.\n7. **CSS/JS**: subir como Static Application File (`#APP_FILES#<m>#MIN#.css` + versão `.min`) ou colar inline; incluir `@media (max-width …)`, `prefers-reduced-motion`, `print` se houver exportação.\n8. **Números de página**: o guia deve dizer quais prefixos `Pnn_` trocar (JS, Source, constantes do package). Conferir colisões com `corlixhub/pages/`.\n9. Após montar no Builder: exportar em APEXlang (`corlixhub/pages/pNNNNN-*.apx`) e commitar módulo + páginas juntos.\n\n### Colaboradores — acompanhamento da implantação\n\nO [registro de implantação](../../modulos/colaboradores/Registro-implantacao.md) consolida o diagnóstico das facetas, correções instaladas, recomendações revistas e o botão ainda pendente. Novas orientações devem seguir a regra 14 do [08](./08-convencoes-e-pegadinhas.md), comparando Histórico de carreira, Holerite e Ponto eletrônico antes de propor componentes.\n\nO guia de Colaboradores foi revisto para ações no cabeçalho seguindo Holerite/Ponto, sem restringir toda a lista ao RH. A revisão é documental e os testes na app continuam pendentes; encerramentos seguem a regra 15 do 08.\n\nCorreção arquitetural: os módulos de referência centralizam HTML em packages de UI com render_* retornando CLOB. O cabeçalho inline proposto para Colaboradores não encerra essa adequação; pkg_colaboradores_ui ainda precisa ser implementado, conforme o registro de implantação.\n\nAtualização de 09/11/2026: pkg_colaboradores_ui foi preparado em modulos/colaboradores/02_pkg_colaboradores_ui.pks/.pkb. O guia agora fornece instalação e chamada render_cabecalho; Classic Report/Faceted Search permanecem nativos. Package ainda não compilado nem validado no ambiente; substitui a pendência anterior de criação, sem declarar implantação concluída.\n\nColaboradores, 09/11/2026: usuário confirmou NOME_COMPLETO já configurado com Link Text. O §5.1 do guia orienta apenas quatro substituições de escape, preservando Type e Target; aplicação do escape ainda pendente.\n\nValidação visual de Colaboradores em 09/11: posicionamento dos filtros e botão confirmado na captura, mas fidelidade parcial. [Auditoria](../../modulos/colaboradores/Validacao-visual-2026-11-09.md) registra HTML literal em Perfil, tabela e barra superior divergentes; correções pendentes.\n\nColaboradores: §11 do guia transforma a auditoria em ajustes ordenados (Perfil, DOM/CSS, card/colunas, facetas e paginação), com proposta visual ainda não homologada. Barra de contagem/ordenação permanece pendente de implementação integrada.\n\nRevalidação DEV b1ff0d6 (backup de 09/11 às 12:06): package de cabeçalho, paginação de 15 linhas com links, layout, RAW de Perfil e traduções já constam no export. Ainda não homologada: barra de ordenação/total, edição na p14, isolamento/acesso, escape de Vínculo e teste visual atual. Ver auditoria no módulo.\n\nColaboradores: estilos de card/colunas transferidos do Inline exportado para colaboradores.css/.min.css. Publicação e remoção do Inline no Builder pendentes; novos ajustes seguem exclusivamente arquivos estáticos.\n"}, {"arquivo": "07-design-pen-dev.md", "titulo": "07 · Design (pen.dev) — telas-alvo do redesign CorlixHub", "md": "# 07 · Design (pen.dev) — telas-alvo do redesign CorlixHub\n\n> Fonte: PNGs em `pen_dev/` (28 arquivos, 27 telas distintas) e `modulos/organograma/` (2 PNGs de redesign).\n> Objetivo deste documento: permitir que uma IA implemente cada tela no Oracle APEX 26.1 (Universal Theme, estilo Redwood Light) **sem ver a imagem**.\n> Os dados exibidos nas telas (Sarah Silva, Rafael Nunes, Ana Beatriz Souza, Fernanda Lima etc.) são dados de exemplo/mock.\n> O CSS/tokens são detalhados em outro documento; aqui há só um resumo do Design System.\n\n---\n\n## 1. Tabela-resumo\n\n| # | Arquivo (pen_dev/) | Tela | Página APEX correspondente | Prioridade aparente |\n|---|---|---|---|---|\n| 1 | `Design System · Redwood Light (CorlixHub).png` | Componentes, estados e estrutura da aplicação | Global (p00000 + tema / `corlix-tema.css`) | **Alta** (base de tudo) |\n| 2 | `Início.png` | Início (home) | p00001-home | **Alta** |\n| 3 | `Novo comunicado (diálogo).png` | Diálogo \"Novo comunicado\" | p00017-comunicado (modal; hoje é *wizard-modal*) | **Alta** |\n| 4 | `Comunicados.png` | Lista de comunicados com filtros | p00011-comunicados-oficiais | **Alta** |\n| 5 | `Colaboradores · visão de administração.png` | Lista de colaboradores (admin) | p00012-colaboradores | **Alta** |\n| 6 | `Novo colaborador.png` | Formulário de criação | p00014-cadastros-de-usuarios | **Alta** |\n| 7 | `Editar colaborador.png` | Formulário de edição | p00014-cadastros-de-usuarios (modo edição) | **Alta** |\n| 8 | `Empresas.png` | Lista de empresas | p00015-empresas-cadastradas (+ p00016 modal) | Média |\n| 8.1 | `Nova empresa (modal).png` | Modal \"Nova empresa\" | p00016-cadastro-de-empresas | Média |\n| 9 | `Organograma.png` | Organograma por níveis | p00003-organograma | **Alta** |\n| 10 | `modulos/organograma/Organograma — redesign (navegação por níveis).png` | Organograma por níveis (variante com texto de ajuda) | p00003-organograma | **Alta** |\n| 11 | `modulos/organograma/Organograma · detalhes da pessoa (Drawer) — redesign.png` | Drawer de detalhes da pessoa | p00003 + nova página modal (drawer) — não implementada | **Alta** |\n| 12 | `Meu perfil (com trajetória).png` | Meu perfil · aba Trajetória | p00002-meu-perfil | **Alta** |\n| 13 | `Meu perfil · aba Dados pessoais.png` | Meu perfil · aba Dados pessoais | p00002-meu-perfil | **Alta** |\n| 14 | `Meu perfil · foto de perfil (Drawer).png` | Drawer \"Foto de perfil\" | não implementada (nova modal drawer) | Média |\n| 15 | `Histórico de carreira — nova página.png` | Histórico de carreira (linha do tempo) | p00013-histórico-de-carreira (+ `modulos/historico-carreira/`) | **Alta** |\n| 16 | `Configurações (equipe de produto).png` | Configurações | p00006-configuracoes | Média |\n| 17 | `Monitor de logs.png` | Monitor de logs | p00007-monitor-logs | Média |\n| 18 | `Monitor de logs · detalhe em Drawer.png` | Drawer \"Detalhe do registro #N\" | não implementada (nova modal drawer) | Média |\n| 19 | `Busca (resultados).png` | Resultados da busca global | p00029 (em montagem: `modulos/busca`) | Média |\n| 20 | `Minha equipe (gestores).png` | Minha equipe (visão do gestor) | não implementada (≠ p00026 Central de equipes, que é admin) | Média |\n| 21 | `Minhas aprovações (Unified Task List).png` | Minhas aprovações | não implementada | Baixa/Média (depende de PDI) |\n| 22 | `PDI · aprovação pela gestão (detalhe da tarefa).png` | Detalhe da tarefa de aprovação de PDI | não implementada | Baixa/Média |\n| 23 | `PDI · aprovação pela gestão (detalhe da tarefa)(1).png` | **Duplicata exata** do item 22 (mesmo MD5 `db9ba902…`) | — | — (pode ser apagado) |\n| 24 | `Plano de desenvolvimento (PDI).png` | Plano de desenvolvimento | não implementada | Baixa/Média |\n| 25 | `PDI · novo objetivo (Drawer).png` | Drawer \"Novo objetivo\" | não implementada | Baixa/Média |\n| 26 | `Avaliações · avaliação de pares.png` | Avaliação 360 (fluxo de pares) | não implementada | Média |\n| 27 | `Resultados 360.png` | Resultados 360 | não implementada | Média |\n| 28 | `Feedbacks.png` | Feedbacks · aba Recebidos | não implementada | Baixa |\n| 29 | `Feedbacks · aba Enviados.png` | Feedbacks · aba Enviados | não implementada | Baixa |\n| 30 | `Feedbacks · dar feedback (Drawer).png` | Drawer \"Dar feedback\" | não implementada | Baixa |\n| 31 | `Holerite digital.png` | Holerite digital: líquido a receber, detalhamento de proventos e descontos, bases de cálculo e FGTS, lista de holerites do ano, \"Ocultar valores\", \"Baixar PDF\" e \"Solicitar correção\" | p00009-holerite-digital; guia `modulos/holerite/Etapas-holerite.md` | Média |\n| 32 | `Ponto eletrônico.png` | Ponto eletrônico: relógio com \"Registrar saída\", linha do tempo das marcações do dia, espelho de ponto do mês, banco de horas, pendências (justificar, assinar espelho) e dados da jornada | guia pronto, páginas 30 a 33 a criar (`modulos/ponto-eletronico/`) | Baixa/Média |\n| 33 | `Suporte TI.png` | Suporte TI: aviso de instabilidade, busca e assuntos da base de conhecimento, \"Meus chamados\" (abertos/resolvidos), status dos sistemas, artigos mais acessados e \"Conversar com a TI\" | guia pronto, páginas 34 a 43 a criar (`modulos/suporte-ti/`) | Baixa/Média |\n| 34 | `Login.png` | Login: formulário à esquerda (\"Acesse sua conta\", login ou e-mail, senha, Manter conectado, Esqueci minha senha, Entrar, Primeiro acesso) e arte à direita com o card \"Intranet Corlix\" | p09999-login; guia `modulos/login/Etapas-login.md` (§4.28) | Alta |\n\nPáginas APEX existentes **sem tela no pen.dev**: p00004-chat, p00005/p00008-notificações, p00026-central-de-equipes, p00027-nova-equipe. Devem apenas herdar o tema/estrutura do Design System.\n\nPrioridade: \"Alta\" = página já existe e o redesign é visual/estrutural; \"Média\" = página nova simples ou admin; \"Baixa/Média\" = depende de módulo inteiro sem backend (seção 5). Na tela de Configurações os toggles \"Plano de desenvolvimento (PDI)\", \"Feedbacks\", \"Exportação em PDF\", \"Notificações\" e \"Links rápidos\" aparecem **Inativos** e \"Busca na intranet\" e \"Avaliações 360\" **Ativos** — isso sugere a ordem pretendida de entrega.\n\n---\n\n## 2. Estrutura comum (todas as telas)\n\n### 2.1 Cabeçalho (Navigation Bar)\n- Esquerda: botão hambúrguer (colapsa o menu lateral) + logotipo texto **\"CorlixHub\"** (negrito, preto).\n- Centro-esquerda: campo de busca global com ícone de lupa e placeholder **\"Buscar na intranet...\"** (fundo cinza claro, borda sutil; foco = borda azul petróleo). Ao enviar → página \"Busca (resultados)\".\n- Direita: ícone sino (notificações), divisor vertical, avatar circular com iniciais (ex.: \"SS\", fundo azul-claro, texto azul petróleo), nome do usuário (\"Sarah Silva\") e chevron ▾ que abre o **menu do usuário**.\n- Menu do usuário (aberto): cabeçalho com nome (negrito) e linha \"sarahsilva · sem empresa vinculada\" (login · situação do vínculo); itens **Meu perfil**, **Preferências** (ícone engrenagem); separador; **Sair**.\n- APEX: Navigation Bar List com entrada de usuário (`&APP_USER.`) e sublista; busca = item de página global (p00000) com submit para a página de busca (ou Search Region / `apex.navigation.redirect`).\n\n### 2.2 Menu lateral (Navigation Menu, side, expandido)\nOrdem exata (completa, para perfil administrador + gestor):\n1. **Início** (ícone casa)\n2. **Comunicados** (megafone)\n3. **Chat** (balões)\n4. **Pessoas** (ícone pessoas, grupo expansível)\n   - Colaboradores\n   - Organograma\n   - Minha equipe *(só gestores)*\n   - Minhas aprovações *(só gestores; badge numérico azul petróleo, ex.: \"2\")*\n5. **Minha carreira** (maleta, grupo)\n   - Meu perfil\n   - Histórico de carreira *(aparece na tela de Histórico)*\n   - Avaliações\n   - Resultados 360\n   - Plano de desenvolvimento\n   - Feedbacks\n6. **Administração** (escudo, grupo — só com Authorization Scheme de admin)\n   - Empresas\n   - Central de equipes\n   - Monitor de logs\n   - Configurações\n\nItem ativo: fundo cinza (#ecebe8 aprox.), barra indicadora vertical azul petróleo à esquerda e texto em negrito. Hover: fundo cinza mais claro. Subitens sem ícone, indentados.\nDecisões registradas no Design System: \"Emitir comunicado\" deixa de ser item de menu (vira botão \"Novo comunicado\"); \"Sair\" sai do rodapé do menu e vai para o menu do usuário; o rótulo \"SEM VÍNCULO\" sai do cabeçalho (estado aparece no menu do usuário e no card Meu gestor); ícones distintos para Comunicados (megafone) × Chat (balões) e Organograma (hierarquia) × Histórico (relógio); a engrenagem vira \"Preferências\" no menu do usuário.\n\n### 2.3 Cabeçalho de página\nFaixa branca abaixo do header com: breadcrumb opcional (link azul petróleo › item atual cinza), **título H1 grande** (negrito, ~32px), subtítulo cinza de uma linha e, à direita, a ação primária (botão escuro \"+ Novo …\") ou secundárias (botão cinza \"Exportar\", \"Atualizar\"). Corpo da página em fundo cinza-quente (#f1efed aprox.) com cards brancos, borda 1px e raio ~8px.\n- APEX: região \"Title Bar\"/Hero no Breadcrumb Bar position, ou Static Content com template \"Blank with Attributes\" + classes; botões na posição `NEXT`/`EDIT` do breadcrumb.\n\n### 2.4 Padrões recorrentes\n- **Avatar de iniciais**: círculo azul-claro, iniciais azul petróleo em negrito. Usado em listas, cards e drawers.\n- **Badge de status** (pílula com bolinha + texto): verde = Ativa/Concluída/Aprovado; cinza = Inativa/Não iniciado; vermelho = Erro/Atrasada; laranja/âmbar = Aviso/Aguardando aprovação; azul = Informação/Em andamento/Novo/Atual.\n- **Etiqueta neutra** (retângulo cinza com borda): departamento (\"Para: Operações\"), categoria (\"Institucional\"), competência (\"Trabalho em equipe\"), tipo (\"PDI\", \"Promoção\").\n- **Linha de visibilidade**: ícone cadeado + texto cinza pequeno (\"Só você\", \"Visível só para você e sua linha de gestão\").\n- **Alertas** inline: info (azul-claro, ícone ⓘ), aviso (âmbar), sucesso (verde), erro (vermelho) — título em negrito + frase com próxima ação.\n- **Drawer**: painel à direita (~35% da largura), título no topo + ×, corpo rolável, rodapé fixo cinza-claro com \"Cancelar\" (secundário) + ação primária escura. Fundo da página escurecido.\n- **Rodapé de formulário fixo**: texto à esquerda (\"Todos os campos são obrigatórios.\") e botões à direita.\n- **Paginação**: texto \"1 – 8 de 8\" alinhado à direita abaixo da tabela.\n\n---\n\n## 3. Design System (resumo)\n\nArquivo: `Design System · Redwood Light (CorlixHub).png` — título \"CorlixHub — componentes e estados (base Redwood Light)\". \"Os tokens aproximam o Oracle Redwood Light; no APEX, use os componentes nativos, Template Options e Theme Roller correspondentes (a fonte real do tema é a Oracle Sans).\"\n\n- **Paleta**: neutros quentes (fundo da página cinza-areia, cards brancos, bordas cinza claras); **primária = quase-preto** (#2b2826 aprox.) para botões de ação principal; **acento azul petróleo** (#0f6b8f / #00688c aprox.) para links, foco, item ativo, avatar e barra de progresso (a barra usa azul mais vivo #2a72d4 sobre trilho azul-claro); status: verde (sucesso), vermelho (erro), âmbar (aviso), azul (informação). Gráfico 360: azul (Autoavaliação), laranja (Gestor), verde (Pares).\n- **Tipografia**: Figtree (também no APEX, desde 26/10/2026), ícones Lucide; H1 ~32px bold; títulos de card ~18–20px semibold; corpo 14–16px; legendas/ajuda 12–13px cinza.\n- **Botões**: Primária (escuro, \"Salvar\") = botão **Hot**; Secundária (cinza, \"Cancelar\") = botão padrão; Terciária (\"Ver todos →\", link azul) = Template Option *Style › Remove UI Decoration*; Somente ícone (sino); estados Hover (mais escuro), Foco (teclado: anel azul), Desabilitado (cinza claro), Carregando (\"Salvando…\" com spinner). Regra: \"Uma única ação primária por contexto\".\n- **Campos**: rótulo interno flutuante (template **\"Required - Floating\"** nos obrigatórios, asterisco vermelho), estados Vazio, Preenchido, Foco (borda azul), Erro (borda vermelha + mensagem inline abaixo, ex.: \"As senhas não coincidem.\"), Desabilitado (fundo cinza + Inline Help \"Disponível após selecionar a empresa.\"). Switch \"Ativa/Inativa\" e Checkbox (\"Administrador\", \"Publicador\").\n- **Status e etiquetas**: Badge de status sempre com texto (Ativa, Inativa, Erro, Aviso, Informação) — Template Component *Badge* ou classes `u-success-text / u-danger-text / u-warning-text / u-info-text`. Etiqueta de departamento é neutra (Operações, Diretoria, Vendas): cor não sugere status.\n- **Feedback do sistema**: mensagens em pt-BR, específicas e com próxima ação. Exemplos: sucesso \"Colaborador salvo com sucesso. O acesso da nova conta já está disponível.\"; aviso \"Seu perfil ainda não está vinculado a uma empresa. Gestor e equipe aparecem assim que o vínculo for cadastrado.\"; erro \"Não foi possível salvar o colaborador. Corrija os 2 campos destacados e tente novamente.\"; info \"Departamento, cargo e gestor dependem da empresa. Selecione a empresa para carregar as opções.\" APEX: Success Message do processo, erros *Inline with Field*, regiões template **Alert** para avisos persistentes.\n- **Navegação lateral**: estados Padrão, Hover, Ativo (fundo + indicador + negrito — \"não depende só de cor\"), Grupo + subitem.\n- **Estados de região**: toda região com dados precisa de **carregando** (\"Carregando comunicados…\" + spinner), **vazio** (ícone + \"Nenhum comunicado publicado\" + \"Os comunicados oficiais aparecerão aqui.\") e **erro** (ícone vermelho + \"Não foi possível carregar\" + botão \"Tentar novamente\"). APEX: Lazy Loading, \"When No Data Found\" personalizado, botões condicionados à existência de dados. Exemplo \"Meu gestor\" preenchido: avatar NG, \"Nome do gestor\", \"Cargo · Departamento\", botões \"Chat\" e \"E-mail\".\n- **Estrutura da aplicação**: ver seção 2.\n\n---\n\n## 4. Telas\n\n### 4.1 Início — `Início.png` → p00001-home\n> **Protótipo atualizado em 28/10/2026.** Layout: hero \"Boa tarde, Sarah\" + data + 4 atalhos (Holerite, Organograma, Suporte TI, Chat) com o card **Ponto de hoje** à direita (relógio 14:32, \"4h33 trabalhadas · faltam 3h27\", badge \"Em jornada\", botão \"Registrar saída\", linha Entrada 08:57 → Intervalo 12:02 → Retorno 13:04 → Saída prev. 17:59). Faixa de 4 indicadores: Banco de horas \"+6h15\", Próximo pagamento \"R$ 2.875,44\", Férias disponíveis \"18 dias\", Meu PDI \"2 de 5 objetivos\" (barra 40%). Coluna principal: **Comunicados** em carrossel (imagem de fundo escurecida, selos \"Novo\" e categoria \"Institucional\", \"Para: Todos · 26 de outubro\", título, resumo, \"Ler comunicado →\", \"Não lido\", setas e pontos; subtítulo \"· 3 não lidos\"); **Suas pendências** (6: marcação incompleta, avaliação de pares, assinar aditivo, pedido de feedback, autoavaliação, chamado de TI; cada uma com status e botão de ação); **Feedbacks recebidos** (2 cartões com autor, tipo Reconhecimento/Sugestão e texto). Coluna lateral: **Meu gestor** (avatar com \"Disponível agora\", \"Próxima conversa 1:1 Quinta, 29/10 às 10:00\", botões Mensagem e Dar feedback); **Pesquisa de clima 2026** (arte, \"Aberta até 06/11\", \"Responder pesquisa\"); **Próximos eventos** (data em bloco, título, horário/local, selo \"Amanhã\"/\"Feriado\", \"Ver agenda\"); **Celebrações de outubro** (aniversário e tempo de empresa, \"Parabenizar\", \"Ver todos\"). Na página 1 entram hero, atalhos, carrossel, Meu gestor e Celebrações (`modulos/home/Etapas-home.md` §6) e, do ponto eletrônico, o card Ponto de hoje, o indicador Banco de horas e as pendências do ponto em \"Suas pendências\" (§7). O §8 traz o resto, com tabelas novas em `modulos/comunicados` e `modulos/home-blocos`: categoria e \"Não lido\" no carrossel, os outros 3 indicadores, Feedbacks recebidos, Pesquisa de clima, Próximos eventos, 1:1 e presença no Meu gestor, Dar feedback e Parabenizar. Ficam de fora só os \"Ver todos\" sem tela de destino. A descrição a seguir é a da versão anterior.\n\n**Layout**: header + menu lateral (Início ativo). Corpo em 2 colunas (≈ 2/3 + 1/3) sob um hero de largura total.\n- **Hero (card branco largura total)**: esquerda — \"Olá, Sarah\" (H1, primeiro nome do usuário) e data por extenso \"Sexta-feira, 25 de setembro de 2026\"; abaixo, 3 botões-atalho (card com ícone em quadrado azul-claro + texto + chevron ›): **Holerite digital**, **Ponto eletrônico**, **Suporte TI** (são os \"Links rápidos\" configuráveis). Direita — imagem decorativa (padrão orgânico em laranja/azul/creme) ocupando ~1/3, colada à borda.\n- **Card \"Comunicados\"** (coluna esquerda): título + subtítulo \"Publicações oficiais da empresa\"; à direita link \"Ver todos →\" e botão primário \"**+ Novo comunicado**\" (só para perfil Publicador). Lista: o 1º item é destaque com imagem 16:9 à esquerda e, à direita, etiqueta \"Para: Operações\" + data \"28 de julho\", título grande \"Teste formulário\", resumo. Itens seguintes sem imagem: etiqueta \"Para: Diretoria\" + \"15 de julho\", título negrito \"Segundo comunicado\", resumo; \"Para: Vendas\" + \"7 de janeiro\", \"Primeiro comunicado\". Separadores horizontais entre itens.\n- **Card \"Meu gestor\"** (coluna direita): estado vazio mostrado — ícone pessoa-com-x em círculo cinza, \"**Nenhum gestor vinculado**\", \"Seu perfil ainda não está vinculado a uma empresa. Procure o RH ou a administração do CorlixHub para concluir o cadastro.\" Estado preenchido (do Design System): avatar, nome, \"Cargo · Departamento\", botões \"Chat\" e \"E-mail\".\n- **Card \"Aniversariantes de setembro\"** (ícone bolo): lista avatar \"HG\" + \"Henrique Oliveira Garcia\" + \"23 de setembro\"; rodapé \"Ver todos →\".\n**APEX**: hero = Static Content/Hero + Cards ou Lista com template \"Media List\"/botões; comunicados = **Content Row** ou Cards (layout horizontal, 1º com mídia); Meu gestor = Static Content com PL/SQL Dynamic Content ou Content Row, mensagem de vazio custom; Aniversariantes = **Content Row**/Avatar List (já existe \"Todos os Aniversariantes do Mês\" na p00001). Botão \"Novo comunicado\" abre p00017 (modal) com Authorization Scheme de publicador.\n\n### 4.2 Novo comunicado (diálogo) — `Novo comunicado (diálogo).png` → p00017-comunicado\n**Layout**: **Modal Dialog** centralizado (~900px) sobre a Início escurecida. Título \"Novo comunicado\" + ×.\n- Texto: \"Campos marcados com * são obrigatórios.\"\n- **Público *** — controle segmentado (3 opções): **Todos** | **Uma empresa** | **Um departamento** (selecionado mostra ✓ e fundo escuro). APEX: item **Radio Group** comum; o visual de botões vem do `modulos/comunicados/comunicado.css` (classe `cx-comunicado__publico`), porque o 26.1.5 não oferece \"Display as Pill Button\" nesse item.\n- Linha de 2 campos: **Departamento destinatário *** (Select List; ajuda \"Só esse departamento verá o comunicado.\") — visível condicionalmente conforme Público (para \"Uma empresa\" seria \"Empresa destinatária\"); **Categoria *** (Select List; ajuda \"Tipo do comunicado (ex.: Eventos).\").\n- **Título *** (Text Field; ajuda \"Frase curta e objetiva. Evite escrever tudo em maiúsculas.\").\n- **Comunicado *** (Textarea / Rich Text, várias linhas).\n- **Imagem (opcional)** — dropzone com ícone de imagem: \"Arraste uma imagem ou clique para selecionar\" / \"PNG ou JPG · você poderá recortar em 16:9 após selecionar\". APEX: **Image Upload** com Cropping (aspect ratio 16:9), tamanho máx. pela Application Setting de imagem (5 MB).\n- Checkbox **Fixar no topo** — \"Aparece primeiro na lista de comunicados.\"\n- Rodapé: \"Cancelar\" (secundário) + \"**Publicar comunicado**\" (Hot).\nMudança vs. atual: substituir o *wizard-modal-dialog* por um modal simples de uma etapa. Passo a passo em `modulos/comunicados/Etapas-comunicados.md` §4 (proposto em 11/11/2026; \"Uma empresa\" fica de fora porque todo comunicado é da empresa da sessão).\n\n### 4.3 Comunicados — `Comunicados.png` → p00011-comunicados-oficiais\n**Layout**: cabeçalho \"Comunicados\" / \"Comunicados oficiais para toda a empresa e para o seu departamento.\" + botão \"**+ Novo comunicado**\". Corpo: coluna de filtros à esquerda (~1/4) + lista à direita.\n- **Filtros (Faceted Search)**: busca \"Título ou texto\"; facetas checkbox com contagem: **Categoria** (Institucional 3, Eventos 2, Novos colaboradores 1); **Leitura** (Não lidos 2, Lidos 4); **Público** (Todos 5, Operações 1).\n- **Barra da lista**: \"6 comunicados\" (contagem), link \"**Marcar todos como lidos** ✓✓\", \"Ordenar por\" + select \"Mais recentes\".\n- **Itens** (card único com separadores): miniatura opcional à esquerda (~240×135); linha de metadados: ícone alfinete \"Fixado\", badge azul \"• Novo\" (não lido), etiqueta categoria (\"Institucional\"), \"Para: Todos · 22 de setembro\"; título em link azul petróleo (\"Planejamento estratégico do 4º trimestre\"); resumo de uma linha; opcionalmente anexo com clipe \"Manual de boas práticas remotas (PDF)\". Exemplos: \"Workshop: cultura de transparência e feedback 360\" (Novo, Eventos), \"Boas-vindas aos novos talentos do time de Tecnologia\" (Novos colaboradores, sem imagem), \"Happy hour de encerramento do mês\" (Eventos, Para: Operações), \"Novos benefícios: parceria com plataformas de saúde mental\", \"Atualização do manual de boas práticas remotas\".\n- Paginação \"1 – 6 de 6\".\n**APEX**: **Faceted Search** + **Cards** (ou Content Row) com mídia condicional; ordenação via Sort Order do Cards; \"Marcar todos como lidos\" = botão estilo link + processo AJAX. Usuário exibido: Ana Beatriz Souza (publicadora).\n\n### 4.4 Colaboradores (admin) — `Colaboradores · visão de administração.png` → p00012-colaboradores\n**Layout**: cabeçalho \"Colaboradores\" / \"Encontre pessoas e gerencie contas, vínculos e perfis de acesso.\" + botão \"**+ Novo colaborador**\". Corpo: filtros à esquerda + tabela à direita.\n- **Facetas**: busca \"Nome, login ou e-mail\"; **Situação** (Ativa 7, Inativa 1); **Empresa** (Corlix 7, Sem vínculo 1); **Departamento** (Operações 3, Vendas 3, Diretoria 1); **Perfil de acesso** (Administrador 1, Publicador de conteúdo 1, Colaborador 6).\n- Barra: \"8 colaboradores\" + \"Ordenar por\" select \"Nome\".\n- **Tabela** colunas: **Pessoa ↑** (avatar + nome em link azul + e-mail abaixo), **Login**, **Vínculo** (\"Corlix · Operações\" + cargo abaixo em cinza; caso sem vínculo: ícone ⚠ \"**Sem vínculo**\" em âmbar + \"Cadastro incompleto\"), **Perfil** (etiqueta neutra \"Publicador de conteúdo\"/\"Administrador\" ou texto \"Colaborador\"), **Situação** (badge Ativa verde / Inativa cinza). Linhas: Ana Beatriz Souza, Bruno Carvalho, Camila Rocha, Diego Martins (Inativa), Fernanda Lima (Administrador, CEO), Lucas Almeida, Rafael Nunes, Tiago Ferreira (Sem vínculo).\n- Paginação \"1 – 8 de 8\". Clique no nome → Editar colaborador.\n**APEX**: **Faceted Search** + **Classic Report** (template Standard, colunas HTML Expression para avatar/badges) ou Interactive Report.\n\n### 4.5 Novo colaborador — `Novo colaborador.png` → p00014-cadastros-de-usuarios\n**Layout**: breadcrumb \"Colaboradores › Novo colaborador\"; H1 \"Novo colaborador\"; subtítulo \"Preencha os dados pessoais, o vínculo profissional e o acesso ao CorlixHub.\" Corpo em 3 cards, cada um com coluna de descrição à esquerda (~1/3) e campos à direita (grade 2 colunas). Rodapé fixo.\n- **Card \"Dados pessoais\"** — descrição: \"Identificação da pessoa em todo o CorlixHub. Primeiro nome e sobrenome são sugeridos a partir do nome completo e podem ser ajustados.\" Campos: **Nome completo *** (largura total); **Primeiro nome *** | **Sobrenome ***; **Data de nascimento *** (Date Picker; ajuda \"Usada na lista de aniversariantes.\").\n- **Card \"Vínculo profissional\"** — descrição: \"Empresa, área e liderança da pessoa. Departamento, cargo e gestor são carregados depois que a empresa é selecionada. Quem está no topo da hierarquia não tem gestor.\" Campos: **Empresa *** (Select List) | **Data de admissão *** (Date Picker); **Departamento *** | **Cargo *** (Select List em cascata, desabilitados até ter empresa; ajuda \"Disponível após selecionar a empresa.\"); **Gestor *** (Popup LOV com lupa; desabilitado; ajuda \"Busque pelo nome após selecionar a empresa.\") | checkbox **Topo da hierarquia** \"Não se reporta a ninguém (ex.: CEO).\" (marcar torna Gestor não obrigatório/oculto).\n- **Card \"Acesso ao sistema\"** — \"Credenciais usadas para entrar no CorlixHub.\" Campos: **E-mail corporativo *** | **Login corporativo ***; **Senha *** | **Confirmar senha *** (Password com olho mostrar/ocultar; ajuda \"Mínimo de 12 caracteres. A troca será exigida no primeiro acesso.\"); grupo **Perfis de acesso**: checkbox \"Publicador de conteúdo — Pode publicar comunicados.\", checkbox \"Administrador — Acessa o grupo Administração.\"; ajuda \"Todas as contas têm acesso de colaborador.\"; **Situação da conta**: Switch \"Ativa\" (ligado), ajuda \"Novas contas nascem ativas. Contas inativas não conseguem entrar no sistema.\"\n- Rodapé: \"Todos os campos são obrigatórios.\" | \"Cancelar\" + \"**Salvar colaborador**\".\n**Guia**: `modulos/tema/Etapas-cadastro-colaborador.md` (CSS `custom.css` §14). Ficam de fora, por depender de backend: perfis de acesso manuais, checkbox \"Topo da hierarquia\" (o Gestor fica opcional), sugestão de primeiro nome/sobrenome, senha mínima de 12 e troca no primeiro acesso.\n**APEX**: Form region dividida em 3 regiões com template \"Standard\"/\"Blank\" + coluna lateral (Region Display Selector não; usar layout de 2 colunas: Static Content de descrição col-span 4 + itens col-span 8); Cascading LOV (Parent Item = Empr tiva 1; Conhecimento técnico 1; Trabalho em equipe 1). Card \"**Como dar um bom feedback**\": **Situação** — Quando e onde aconteceu.; **Comportamento** — O que a pessoa fez, sem julgamentos.; **Impacto** — O efeito no time ou no resultado.\n**APEX**: Tabs (Region Display Selector) com 2 regiões **Cards**/Content Row; \"Agradecer\" = DA AJAX; resumo = Classic Report key/value.\n\n### 4.26 Feedbacks · Enviados — `Feedbacks · aba Enviados.png` → não implementada\nMesma página, aba \"**Enviados · 2**\". Cards com \"Para Bruno Carvalho / Colega de equipe\" e data \"Hoje, 10:15\"; etiquetas \"🎖 Reconhecimento\" \"Trabalho em equipe\"; texto \"Na virada do mês, você reorganizou a fila de chamados sem que ninguém pedisse. O time zerou o atraso em dois dias.\"; rodapé \"🔒 Só a pessoa\" e, enquanto dentro de 24 h, \"Pode ser excluído até 26/09 às 10:15\" + link vermelho \"**Excluir 🗑**\". Segundo card: \"Para Lucas Almeida / Vendas\" \"02/09/2026\", \"💡 Sugestão\" \"Comunicação assertiva\", \"Nas passagens de turno, vale registrar os chamados pendentes no canal da equipe para ninguém perder o contexto.\", \"🔒 A pessoa e a linha de gestão dela\", à direita \"♡ Lucas agradeceu\" (estado de agradecimento recebido).\n\n### 4.27 Feedbacks · Dar feedback (Drawer) — `Feedbacks · dar feedback (Drawer).png` → não implementada\n**Drawer** \"Dar feedback\" + ×. \"Campos marcados com * são obrigatórios.\"\n- **Para quem *** (Popup LOV com lupa; valor \"Bruno Carvalho\"; ajuda \"Busque pelo nome de qualquer colaborador.\").\n- **Tipo *** — segmentado \"🎖 **Reconhecimento**\" (selecionado, escuro) | \"💡 Sugestão\".\n- **Competência** (Select; \"Trabalho em equipe\"; ajuda \"Opcional. Liga o feedback às competências do 360.\").\n- **Feedback *** (Textarea; ajuda \"Situação, comportamento e impacto. 114 de 1.000 caracteres.\" — contador, máx. 1000).\n- **Quem pode ver *** — Radio: ◉ \"Só a pessoa\" / ○ \"A pessoa e a linha de gestão dela\".\n- Alerta info: \"**Feedbacks não são anônimos nem
