Resultados 360 (\"Criar PDI\") | `PDI` (id, colaborador_id, ciclo_origem_id, prazo, status [RASCUNHO/AGUARDANDO/APROVADO/AJUSTES], enviado_em, aprovado_por, aprovado_em, proxima_conversa); `PDI_OBJETIVO` (id, pdi_id, competencia_id, titulo, resultado_esperado, prazo, status [NAO_INICIADO/EM_ANDAMENTO/CONCLUIDO], aprovado); `PDI_ACAO` (id, objetivo_id, descricao, prazo, concluida_em); `PDI_SOLICITACAO_PRAZO` (objetivo_id, prazo_atual, prazo_novo, motivo, status). |\n| **Minhas aprovações** | Minhas aprovações, PDI aprovação | Preferencialmente **APEX Human Tasks** (Task Definitions \"Aprovar PDI\", \"Novo objetivo\", \"Alterar prazo\"; tabelas internas `APEX_TASKS`), ou tabela própria `SOLICITACAO_APROVACAO` (id, tipo, solicitante_id, aprovador_id, referencia_id, payload, prazo_resposta, status, comentario, decidido_em). |\n| **Feedbacks** | Feedbacks (Recebidos/Enviados/Drawer); a tabela `FEEDBACK` já existe em `modulos/home-blocos` (Home §8) | `FEEDBACK` (id, autor_id, destinatario_id, tipo [RECONHECIMENTO/SUGESTAO], competencia_id nullable, texto ≤1000, visibilidade [PESSOA/PESSOA_E_GESTAO], criado_em, excluido_em, agradecido_em). Regra: excluir só até 24 h. |\n| **Minha equipe** | Minha equipe | Reaproveita colaborador.gestor_id (hierarquia `connect by`), `MOVIMENTACAO_CARREIRA` (última movimentação) e `AVALIACAO` (status do ciclo). |\n| **Monitor de logs — detalhe** | Drawer de log | Tabela de log da `log_pkg` precisa de: sessão, aplicação, componente técnico, mensagem completa, mensagem exibida ao usuário, flag \"viu mensagem técnica\"; cruzamento com `APEX_WORKSPACE_ACTIVITY_LOG` / `APEX_DEBUG_MESSAGES`. |\n| **Configurações: Recursos e Parâmetros** | Configurações | **Build Options** (Configuration Options) para Busca, Links rápidos, Notificações, Avaliações 360, Exportação PDF, PDI, Feedbacks; **Application Settings** para empresa padrão, retenção de log (dias), tamanho máx. de imagem (MB), grupo mínimo de percentil, respostas mínimas de pares. |\n| **Exportação em PDF** | Histórico de carreira, Resultados 360, Minha equipe (\"Exportar\") | Servidor de impressão (ORDS/BI Publisher/APEX Office Print) — sem tabela; depende de infraestrutura. |\n| **Comunicado automático** | Histórico (promoção/admissão \"Equipe avisada\") | Trigger/processo que cria `COMUNICADO` vinculado a `MOVIMENTACAO_CARREIRA.comunicado_id`. |\n| **Uso da aplicação** | Configurações (card) | Views sobre `APEX_WORKSPACE_ACTIVITY_LOG` (páginas mais acessadas, pessoas ativas, erros por página). |\n"}, {"arquivo": "08-convencoes-e-pegadinhas.md", "titulo": "08 · Convenções, regras de trabalho e pegadinhas conhecidas", "md": "# 08 · Convenções, regras de trabalho e pegadinhas conhecidas\n\n> Consolida as regras de trabalho e os problemas encontrados nos demais documentos (02–07). Detalhes e números de linha estão nos documentos de origem.\n> Estado: §1 atualizado continuamente; §3 revisado em 13/11/2026 contra o backup de DEV `84f8625` e as [fichas das páginas](./paginas/README.md). Regras de conduta e fluxos de trabalho para qualquer agente: [`docs/agentes/`](../agentes/README.md).\n\n## 1. Regras para uma IA trabalhando neste repositório\n\n1. **Proibido modificar** `corlixhub/`, `backups/`, `pen_dev/` e `scripts/` (regra obrigatória do projeto). São só para leitura: nada de criar, editar, apagar ou reverter arquivos nelas. A app muda pelo Builder, feita pelo time, e o `.apx` chega ao repositório pelo export/backup; o agente valida, escreve o guia em `modulos/<nome>/Etapas-*.md` e atualiza `docs/`. Se a tarefa parecer exigir mudança nessas pastas, pare e pergunte. `database/f100.sql` também não se edita: é um export gerado (12 MB), só para consulta via `grep`.\n2. **Sempre em pt-BR**: textos da UI, comentários, nomes de objetos (`colaborador`, `departamento`, `id_empresa`…), mensagens de commit.\n3. **Nomes de objetos de banco** em `snake_case` minúsculo nos scripts. Prefixos: `pkg_` (packages), `vw_` (views), `trg_<tabela>_aud|log` (triggers), `fn_` (funções), `prc_` (procedures), `id_<entidade>` (PKs/FKs), `dt_` (datas), `fl_` (flags `S/N`), `ds_`/`nm_` quando aparecem.\n4. **Módulos novos** seguem o padrão de `modulos/<nome>/`: scripts SQL numerados + `instalar.sql`, package `pkg_<nome>` com a lógica, `pkg_<nome>_ui` (ou procedure `render_*`) que devolve HTML para uma região *Dynamic Content*, `<nome>.css` e `<nome>.js`, e um `Etapas-<nome>.md` com o passo a passo no Builder. Veja o template em [`06-modulos.md`](./06-modulos.md).\n5. **CSS**: não usar CSS Inline de página/região nem atributo style para novos ajustes, inclusive testes provisórios. Manter estilos em arquivos do módulo/tema e carregá-los por File URLs. Ao migrar Inline já instalado, publicar os arquivos completos antes de remover o bloco no Builder.\n    tokens `--cx-*` em `corlix-tema.css`; ajustes e componentes em `custom.css`. **Atualize sempre o `.min.css` junto**, porque não existe script de minificação e os pares são mantidos à mão. Novos arquivos precisam ser registrados em `shared-components/static-files.apx` e, se forem globais, em `application.apx > css.fileUrls`. Prefixo de classes novas: `cx-` (tema), `org-`/`hc-`/`ch-`/`log-` (por módulo). Não há dark mode. A política visual é **sem sombras**. Veja [`04-tema-e-estilos.md`](./04-tema-e-estilos.md).\n6. **Links entre páginas**: as páginas usam `argumentsMustHaveChecksum`, então gere URLs com `apex_page.get_url(...)` ou com o link builder. URLs `f?p=` montadas manualmente com parâmetros quebram.\n7. **Multiempresa**: toda consulta nova a dados de negócio deve filtrar por `id_empresa` da empresa do usuário. Hoje quase nenhuma filtra (ver §3).\n8. **Segurança**: quando criar ou alterar páginas administrativas, defina `authorizationScheme` **na página**, e não apenas na entrada do menu.\n9. **Commits**: Conventional Commits (`feat(escopo): …`). Branches e PRs seguem a regra 13. Nunca versione `apex/`, `oracle_oradata/`, `ords_config/`, `.env`.\n10. **Não invente**: o README e o código divergem em vários pontos (ver [`01`](./01-arquitetura-e-ambiente.md) §6). Confie no código e pergunte ao time sobre o que não estiver confirmado (ambiente atual, DDL das tabelas base, `log_pkg`).\n11. **Passo a passo do Builder é para o APEX 26.1.5.** Os guias (`Etapas-*.md`) descrevem caminhos do Page Designer desta versão, com passos detalhados (onde clicar, seção › atributo, valor, como testar).\n    - Não copie caminhos de versões antigas: no 26.1.5 o painel de propriedades **não tem a aba \"Attributes\"** e a região de Form **não mostra a seção \"Edit\"**.\n    - Caminho que não foi conferido na tela do 26.1.5 vai marcado **(confirmar no 26.1.5)** e acompanhado de um jeito de verificar o resultado (o processo que o APEX cria, ou o trecho esperado no export APEXlang).\n    - Se o usuário disser que um caminho não existe, **não chute outro**: peça um print da árvore e do painel de propriedades, e depois corrija o guia com o caminho real.\n12. **Protótipos ficam em `pen_dev/`.** Toda tela-alvo, mockup ou protótipo do projeto está nessa pasta (PNGs exportados do pen.dev, um arquivo por tela, nomeado pelo título da tela). Quando a tarefa falar em \"protótipo\", \"tela do pen.dev\", \"design\" ou \"tela-alvo\", procure primeiro em `pen_dev/` e não em outro lugar; a descrição de cada tela está em [`07-design-pen-dev.md`](./07-design-pen-dev.md). Se o protótipo pedido não estiver lá, pergunte ao time em vez de inventar o layout. A pasta continua somente leitura (regra 1).\n\n13. **Toda alteração vai numa branch própria, com PR.** Vale para qualquer alteração no repositório, por menor que seja:\n    - Use `feature/<assunto>` para funcionalidade nova (módulo, tela, recurso) e `fix/<assunto>` para as demais (correção, documentação, ajuste).\n    - Crie a branch a partir da `DEV` atualizada. Nunca faça commit direto na `DEV` ou na `PROD`.\n    - Faça commit e push e abra o PR para `DEV`. Mudanças de assuntos diferentes ficam em branches e PRs diferentes.\n    - Quando a `DEV` tiver commits que ainda não estão na `PROD`, abra o PR `DEV` → `PROD`, se não houver um aberto. Antes do merge do PR para `DEV`, o `DEV` → `PROD` ainda não tem o que mostrar: o GitHub recusa um PR sem commits.\n    - O merge é do time: o agente só abre os PRs.\n    - A regra não libera as pastas somente leitura (regra 1).\n\n\n14. **Páginas devem partir dos módulos já implementados.** As regras concretas, a ordem das referências e o formulário de exceção estão em [11 · Padrões de páginas](./11-padroes-de-paginas.md); a exceção precisa de aprovação do time antes de ser implementada. Antes de criar, redesenhar ou corrigir uma página:\n    - Atualize as referências remotas e confira a DEV atualizada, o último export e os relatos do time. Distinga código instalado, proposta em PR e teste executado; não peça para reinstalar algo já confirmado no backup.\n    - Leia o protótipo em pen_dev/ e escolha o módulo existente mais próximo. Referências iniciais: Histórico de carreira (modulos/historico-carreira/), Holerite (modulos/holerite/) e Ponto eletrônico (modulos/ponto-eletronico/). Consulte o guia, o SQL/PLSQL, o CSS/JS necessário e o export da página de referência.\n    - Registre no guia uma seção **Referências reutilizadas**: arquivos, componente reaproveitado e adaptações necessárias. Reutilize primeiro cabeçalho, ações, templates, tokens, espaçamento, estados vazios, ícones e padrões de navegação já adotados.\n    - **Reutilize a arquitetura de packages de UI**, não apenas as classes CSS. HTML personalizado deve ser centralizado em `pkg_<modulo>_ui`, com funções `render_*` retornando CLOB; as regiões Dynamic Content fazem chamadas curtas ao package. Separe regras de negócio e acesso a dados da apresentação, seguindo o módulo equivalente. Registre a estratégia de CLOB, escape de texto/atributos, URLs com checksum e ícones. Não distribua grandes blocos de HTML/PLSQL pelas regiões como substituto desse padrão. Componentes nativos podem coexistir quando necessários (por exemplo, fonte filtrável do Faceted Search); justificar a composição no guia.\n    - Preserve a integração entre HTML, CSS, JS e APEX. Antes de trocar uma ação renderizada por botão nativo (ou o contrário), confira posição disponível no template, DOM, autorização, checksum, ação e resultado visual. Não suponha que um botão nativo ficará dentro de um contêiner HTML retornado por PL/SQL.\n    - **Padrão existente é a escolha obrigatória por padrão.** Só adote outra abordagem quando uma boa prática for demonstravelmente melhor para o caso. Antes da mudança, registre o padrão comparado, evidência técnica (documentação oficial e/ou teste), benefício concreto em segurança, manutenção, desempenho, acessibilidade ou compatibilidade, impactos de integração e validação prevista. Preferência pessoal, novidade ou conveniência isolada não bastam. Sem evidência suficiente, preserve o padrão. A alternativa deve ser compatível com o APEX 26.1.5. Reuso não autoriza copiar falhas de segurança; corrigir uma falha comprovada é justificativa técnica válida.\n    - Diferencie permissão de consultar a página, executar uma ação e acessar o destino. Não restrinja toda uma listagem ao RH só porque contém uma ação administrativa. Não use empresa nula como substituto de autorização explícita.\n    - Confirme como os ícones são renderizados: fonte Lucide mapeada por classes fa-* e SVG Lucide inline coexistem no projeto. Siga o padrão do componente escolhido.\n    - Se o usuário informar que a orientação não funciona, interrompa as tentativas por suposição: confira o exemplo existente e obtenha o export/print necessário. Marque propostas não verificadas e não declare a página validada só por ler o código.\n    - Registre resultados, falhas e pendências no módulo, com evidência e próximo passo. Mantenha as pastas protegidas somente para leitura.\n\n\n15. **Documentar o encerramento de toda tarefa ou módulo.** Antes da entrega final:\n    - Atualize o registro existente do módulo (preferencialmente Registro-implantacao.md ou seção Situação na app do guia). Para tarefa sem módulo, use o documento temático em docs/. Não crie registros duplicados quando já existe um apropriado.\n    - Registre objetivo/escopo, data e referência do código consultado, alterações e arquivos/componentes, decisões e referências reutilizadas, comandos ou testes relevantes, resultado e evidências (export, print, relato do usuário, commit/PR).\n    - Diferencie proposto, versionado, aplicado no Builder/banco e validado em execução. Registre também tentativas malsucedidas e hipóteses descartadas. Não trate revisão estática ou backup como prova de funcionamento.\n    - Liste o que falta, bloqueios e próximo passo concreto; se nada falta, indique conclusão e sua evidência. Se a tarefa terminar parcialmente, documente esse estado sem afirmar que o módulo foi concluído.\n    - Atualize o guia e docs/ai-context/ correspondentes quando a mudança afetar instruções ou estado do projeto. Registre casos novos no 09 ou em Se não funcionar e rode casos.py indexar quando aplicável.\n    - Para mudanças apenas documentais, registre o que foi revisado e a verificação feita; não invente testes de app. Escale o tamanho do registro à tarefa, sem transcrever toda a conversa ou incluir credenciais/dados pessoais desnecessários.\n    - Inclua o registro no mesmo fluxo de branch/commit/PR da tarefa e aponte o resultado na resposta final. Não peça confirmação só para documentar trabalho já autorizado.\n\n## 2. Lacunas estruturais (objetos que faltam no repositório)\n\n| Lacuna | Impacto |\n|---|---|\n| Dados do banco (empresas, cargos, colaboradores) | Só `DEPARTAMENTO` tem export (`database/dados/departamento.xlsx`). `database/corlix-hub.sql` é só o DDL (snapshot com blocos duplicados, não roda de ponta a ponta) e `f100.sql` é só a app. Para contagens e listas, consulte o banco (ver `05` §3.2). |\n| Schema real com furos | `CARGO.ID_DEPARTAMENTO` sem FK; 8 FKs para `COLABORADOR` desabilitadas; códigos -20010..-20012 repetidos entre `PKG_EQUIPE_CANAL` e `PKG_HISTORICO_CARREIRA`; `07_testes.sql` falha no INSERT de `EMPRESA` (ver `05` §3–4A). |\n| Função `ch_get_canal_direto` (Chat) | Usada na p4, sem fonte. |\n| `docker-compose.yml` e `.env.example` | Deletados no working tree. `scripts/setup.*` dependem deles. O CI ignora a validação do compose quando o arquivo não existe. |\n| Supporting objects | Estão vazios: o export da app não instala nada do schema. |\n| Itens exigidos pelo organograma (`ID_COLABORADOR`, processo `DOWNLOAD_FOTO`) | Não aparecem em `shared-components/`. O histórico de carreira já está integrado: `G_ID_EMPRESA`, `GESTOR`, `COLABORADOR` e as páginas 18–23 estão no app. |\n\n## 3. Pegadinhas por área\n\n### Segurança / multi-tenant\n- **Autorização na página (estado em 13/11/2026, backup `84f8625`):** várias páginas já têm `authorizationScheme` próprio (2, 7, 9, 12–16, 18–23, 30–44; ver as fichas em [`paginas/`](./paginas/README.md)). **Continuam sem:** 1, 3, 4, 5, 6, 8, 11, **17** (Novo comunicado: só o botão da Home exige `publicador-de-conteudo`), **26 e 27** (Equipes, que ficam no grupo Administração do menu). A lista completa de autorizações e de quem usa cada uma está no [`03`](./03-componentes-compartilhados.md) §2.\n- Menus sem a autorização da página: \"Dashboard RH\" (p20 exige `ADMIN_RH`) e \"Solicitar correção\" (p22 exige `COLABORADOR`). Quem não tem o papel vê o item e recebe \"acesso negado\".\n- **Filtro por `id_empresa`:** comunicados e as LOVs `LOV_*` já filtram por `:G_ID_EMPRESA`. Ainda não filtram: equipes (p26/p27), os forms da p18 e da p21, os artigos do suporte (p42; a p43 deixa escolher a empresa) e a `vw_org_colaborador` do organograma. Correções em `modulos/isolamento-empresas/Etapas-isolamento-empresas.md` e no §11 do guia do suporte, não aplicadas.\n- Os app processes (4, `BEFORE_HEADER`, sem condição) rodam em todas as páginas, inclusive no login. Eles ligam o usuário ao colaborador por `COLABORADOR.login_apex = :APP_USER` es not support being opened and closed`, `modulos/home/Etapas-home.md` §3.7), e o organograma (p3, `organograma`) e o histórico (p13, `historico_carreira`) dependem do mesmo id.\n\n### Módulos\n- O guia do organograma usa a página 10 (`P10_ID_FOCO`), mas a página real é a **3**.\n- `c_pagina_perfil = 20` do organograma conflita com o Dashboard RH (página 20) planejado pelo histórico de carreira.\n- `vw_org_colaborador` não filtra por empresa, e o drawer de detalhes não verifica permissão.\n- `G_ID_EMPRESA` só é preenchido depois de um novo login. Sem esse item, toda chamada a `pkg_historico_carreira` dentro de uma sessão APEX falha com `-20012`.\n- A p14 chama `registrar_admissao_automatica` (processo \"Registrar admissão\", seq 15) desde 18/10/2026.\n- Os erros do módulo de carreira (-20001 a -20099) só aparecem sem \"ORA-\" porque o `log_pkg.apex_error_handler` delega para `pkg_historico_carreira.fn_tratar_erro` (aplicado em 19/10/2026). Se recriar o `log_pkg`, mantenha essas três linhas (guia do módulo, §9.1).\n- `corlixhub/shared-components/static-files/` traz a versão do CSS que está **no ambiente**. Ao mudar `modulos/historico-carreira/historico-carreira.css`, reenvie `.css` e `.min.css` pelo Builder (guia §2.3 e §9.3).\n- O botão \"Histórico de carreira\" da p14 nunca aparece: a página só cadastra, e o branch pós-salvar limpa `P14_ID_COLABORADOR`.\n- `COMUNICADO.TITULO` aceita até 200 caracteres no formulário (p17), mas o package corta em 100.\n- O README do módulo de carreira fala em \"nove códigos padrão\" de movimentação, mas o seed cria 11.\n- Perfis de acesso: os papéis vêm de `CARGO_PAPEL`, mas os colaboradores da empresa 1 estão em cargos antigos (101–604) vinculados à mão. Os cargos 605–633 do seed estão vazios. Antes de mexer em cargos, leia `modulos/perfis-acesso/Registro-implantacao.md`.\n- `apex_acl` (atribuir papéis) não funciona no SQL Commands do APEX: sem sessão da app dá `ORA-01403`, e `apex_session.create_session` é bloqueado (`ORA-20987`). Use o Builder, a P14 ou o SQLcl/SQL Developer.\n- SQL Commands: um comando por vez (sem `;` final, sem `commit;` junto), mostra só 10 linhas por padrão (campo **Rows**) e não mistura `unistr()` (NVARCHAR2) com VARCHAR2 em `union` sem `to_char`.\n- As contas SARAHSILVA, EDUARDOMARINS e ALAIRTONROCHA são da equipe e não têm colaborador: \"SEM VINCULO\" na Home é esperado para elas.\n\n### SQL e PL/SQL\nOs erros já vistos (ORA-12704, PLS-00201/00304, PLS-00231, ORA-02000, ORA-01403, Access Denied etc.), com causa, correção e prevenção, estão em [09 · Erros e soluções](./09-erros-e-solucoes.md). Para achar um caso pela mensagem ou pelo sintoma (inclusive nas tabelas \"Se não funcionar\" dos módulos), use `python3 scripts/busca-casos/casos.py buscar \"<texto>\"` (01 §8.2). Consulte o checklist da §5 desse documento antes de entregar SQL ou PL/SQL.\n\nRegras gerais para scripts PL/SQL:\n- Todo bloco `create or replace package|package body|procedure|function|trigger|type` e todo bloco anônimo `begin … end;` termina com `/` sozinho na linha seguinte. Sem a `/`, o SQLcl não executa o bloco e o próximo comando é anexado a ele.\n- Comandos SQL simples (`create view`, `comment`, `insert`) terminam com `;`, sem `/`. Um `;` seguido de `/` executa o comando duas vezes.\n- Spec e body ficam em arquivos separados (`.pks` e `.pkb`), cada um com sua `/`, e são instalados nessa ordem.\n- Depois de compilar, confira com `show errors package body <nome>` (SQLcl) ou com `select * from user_errors where name = '<NOME>'`. O APEX mostra só a primeira linha do erro.\n- `set define off` no início do script: sem ele, `&` em strings (HTML, URLs) vira variável de substituição.\n- Ao ler `Error at line N`, conte as linhas **a partir do início do comando** (`create or replace …`), não do arquivo.\n\n### Configuração\n- O idioma primário da app é `en`, com máscaras de data `DS`. Para pt-BR, formate explicitamente com `to_char(..., 'dd/mm/yyyy')`. A LOV `BOOLEAN` mostra \"Yes/No\".\n- `400 Request Header Or Cookie Too Large` no host do Autonomous: são cookies acumulados, e o limite do proxy da OCI não pode ser alterado. Limpe **só o host** (DevTools → Application → Clear site data). Veja [`10-erro-400-cookies.md`](./10-erro-400-cookies.md).\n- A sessão do Builder cai e pede o workspace de novo: ou os cookies foram perdidos, ou houve timeout (padrão de 1 h de inatividade e 8 h de duração; a app não define timeout próprio). Diagnóstico com `scripts/apex-sessao-timeouts.sql`; ver `10` §8.\n- O último commit (`feature: …`) não segue o padrão do hook `commit-msg`.\n\n## 4. Checklist rápido antes de entregar uma mudança\n- [ ] Editei o `.apx` correto (e o `.min.css` junto com o `.css`, quando aplicável)?\n- [ ] Os novos estáticos estão registrados em `static-files.apx`?\n- [ ] As queries filtram por empresa? A página tem authorization?\n- [ ] Os links foram gerados com checksum (`apex_page.get_url`)?\n- [ ] Os textos estão em pt-BR e as datas formatadas explicitamente?\n- [ ] O SQL novo está num script numerado e idempotente (`create table if not exists`, `create or replace`) e foi adicionado ao `instalar.sql` do módulo?\n- [ ] O SQL/PL/SQL novo passa no checklist da §5 do [09 · Erros e soluções](./09-erros-e-solucoes.md)?\n- [ ] A documentação em `docs/ai-context/` foi atualizada se a mudança altera páginas, schema, tema ou módulos?\n"}, {"arquivo": "09-erros-e-solucoes.md", "titulo": "09 · Erros já vistos e como evitá-los (SQL, PL/SQL e APEX)", "md": "# 09 · Erros já vistos e como evitá-los (SQL, PL/SQL e APEX)\n\n> Referência de diagnóstico. Cada entrada traz o **sintoma** (a mensagem como aparece), a **causa**, a **correção** e a **prevenção**.\n> Origem: instalação e integração do módulo de histórico de carreira (página 13), em 09/10/2026.\n> Busca: `python3 scripts/busca-casos/casos.py buscar \"<mensagem>\"` acha a entrada certa por código, sintoma ou descrição (01 §8.2). Mantenha o formato `### N.M` + **Sintoma:**/**Causa:**/**Correção:**/**Prevenção:** para que a entrada seja indexada como caso, e rode `casos.py indexar` depois de editar.\n> Antes de escrever SQL ou PL/SQL, leia a [§5 (checklist)](#5-checklist-antes-de-entregar-sqlplsql). Antes de configurar uma página, leia a [§4](#4-apex-configuração-de-páginas).\n\n## 1. Como ler uma mensagem de erro\n\n### 1.1 Erros de compilação (`Error at line N`)\n- O número da linha é contado **a partir do `create or replace`**, não do início do arquivo. Se o arquivo tem um cabeçalho de comentários, some essas linhas. Exemplo: o `04_pkg_historico_carreira.pkb` tem 4 linhas antes do `create`, então a linha 490 do erro é a linha 494 do arquivo.\n- O APEX (SQL Commands e SQL Scripts) mostra só a primeira linha de cada erro. Para ver a lista completa:\n  ```sql\n  select line, position, text from user_errors where name = 'PKG_X' order by sequence\n  ```\n- Mensagens como `PL/SQL: SQL Statement ignored` e `Compilation unit analysis terminated` são **consequência** de outro erro. Procure o erro de verdade nas linhas vizinhas.\n\n### 1.2 Erros em tempo de execução (página de erro do APEX)\nNa seção *Technical Info*:\n| Campo | O que diz |\n|---|---|\n| `component.type` / `component.name` | O componente que falhou: `APEX_APPLICATION_PAGE_PROCESS` (processo), `APEX_APPLICATION_AUTHORIZATION` (authorization scheme), `APEX_APPLICATION_PAGES` + \"Error during rendering of region\" (região) |\n| `ora_sqlerrm` | O erro Oracle original |\n| `error_backtrace` | A pilha. A **primeira linha `WKSP_CORLIXHUB.<objeto>`** é onde o erro aconteceu, com o número de linha contado como em 1.1 |\n| `error_statement` | O código que o APEX executou (o processo ou a fonte da região) |\n\nAs linhas `APEX_260100.*` e `SYS.*` são internas do APEX. Ignore-as.\n\n---\n\n## 2. Instalação e compilação\n\n### 2.1 `ORA-12704: character set mismatch` ao criar uma view\n**Sintoma:** `create or replace view …` falha com ORA-12704, e o `comment on table` seguinte dá `ORA-00942: table or view does not exist`.\n\n**Causa:** `unistr()` sempre devolve **NVARCHAR2**. Num `case`, `decode`, `coalesce` ou `union`, todos os ramos precisam ter o mesmo tipo. Misturar `unistr(...)` com texto `VARCHAR2` quebra a view. O ORA-00942 é só consequência: a view não foi criada.\n\n**Correção:** envolva com `to_char`:\n```sql\nnvl(ca.nome, '?') || to_char(unistr(' \\2192 ')) || nvl(cn.nome, '?')\n```\n**Prevenção:** em SQL (views e queries), use sempre `to_char(unistr(...))`. Em PL/SQL, atribuir a uma variável `varchar2` já converte sozinho.\n\n### 2.2 `PLS-00201` + `PLS-00304`: body sem especificação\n**Sintoma:**\n```\nPLS-00201: identifier 'PKG_HISTORICO_CARREIRA' must be declared\nPLS-00304: cannot compile body of 'PKG_HISTORICO_CARREIRA' without its specification\n```\n**Causa:** o `.pkb` (body) foi executado sem que a spec (`.pks`) existisse no schema. Ou só o `.pkb` foi rodado, ou a spec falhou antes.\n\n**Correção:** execute o `.pks` e depois o `.pkb`.\n\n**Prevenção:**\n- Instale pelo `instalar.sql` do módulo no SQLcl, que já segue a ordem certa.\n- No APEX (SQL Workshop › SQL Scripts), `@@` não funciona. Envie e execute um arquivo por vez, **na ordem do `instalar.sql`**.\n- Se a spec deu erro, corrija-a antes de rodar o body.\n\n### 2.3 `PLS-00905: object … is invalid`\n**Causa:** um package dependente (ex.: `pkg_historico_carreira_ui` → `pkg_historico_carreira`) foi compilado antes da dependência, ou a dependência ficou inválida.\n\n**Correção:** `alter package pkg_x compile;` e depois `alter package pkg_x compile body;`. Confira com:\n```sql\nselect object_type, object_name from user_objects where status = 'INVALID'\n```\n\n### 2.4 `PLS-00231: function 'X' may not be used in SQL`\n**Sintoma:** vários blocos de\n```\nPLS-00231: function 'USUARIO_ATUAL' may not be used in SQL\nPL/SQL: ORA-03066: invalid PL/SQL expression\nPL/SQL: SQL Statement ignored\n```\n**Causa:** uma função **privada** (declarada só no body, sem estar na spec) foi chamada dentro de um comando SQL (`select … where`, `insert … values`, `update … set`). Quem executa esse comando é o motor SQL, e ele só enxerga funções de schema e funções **públicas** de package. O mesmo vale para funções locais declaradas dentro de uma procedure.\n\n**Correção:** leia o valor numa variável local antes do SQL:\n```sql\nprocedure efetivar_movimentacao (p_id in number) is\n  l_usuario constant varchar2(255) := usuario_atual;  -- função privada não pode ser chamada dentro de SQL\nbegin\n  update historico_carreira set usr_efetivacao = l_usuario where …;\n```\n**Prevenção:** em PL/SQL puro (`if`, atribuições) a função privada funciona normalmente. Dentro de SQL, use variável. Só coloque a função na spec se ela realmente fizer parte da API do package.\n\n**Também acontece em blocos anônimos.** Exemplo: o `09_dados_demo_dashboard.sql` declarava a função local `id_tipo` no `declare` e a chamava dentro do `insert … values`. O erro apontou `line 53, column 25`, e a linha é contada a partir do `declare`, não do início do arquivo. A correção foi a mesma: guardar `id_tipo(p_cd)` numa constante antes do `insert`. Como o bloco não compilou, nada foi gravado, e o script pode ser rodado de novo depois de corrigido.\n\n### 2.5 `ORA-00984: column not allowed here` em trigger (`inserting`/`updating` dentro do SQL)\n**Sintoma** (SQL Scripts, 19/10/2026, `05_triggers_auditoria.sql`): as três triggers `trg_*_log` com\n```\nError at line 2: PL/SQL: SQL Statement ignored\nError at line 8: PL/SQL: ORA-00984: column not allowed here\n```\n**Causa:** `inserting`, `updating` e `deleting` são predicados de trigger e só existem em PL/SQL. Dentro de um `insert … values (case when inserting then 'I' … end)` quem avalia é o motor SQL, que não os conhece. Igual ao 2.4, a linha conta a partir do `begin`/`declare` da trigger.\n\n**Correção:** calcule o valor numa variável no `declare` e use a variável no `insert`:\n```sql\ndeclare\n  l_op log_auditoria_carreira.tp_operacao%type :=\n    case when inserting then 'I' when updating then 'U' else 'D' end;\nbegin\n  insert into log_auditoria_carreira (…, tp_operacao, …) values (…, l_op, …);\n```\n**Atenção:** com erro de compilação, o `create or replace trigger` **cria a trigger mesmo assim, inválida e habilitada**. A partir daí, todo `insert`/`update`/`delete` na tabela falha com `ORA-04098: trigger '…' is invalid and failed re-validation`. Corrija e rode o script de novo na hora, ou desabilite a trigger (`alter trigger … disable`) até corrigir. Confira com `select trigger_name, status from user_triggers` e `select object_name from user_objects where object_type = 'TRIGGER' and status = 'INVALID'`.\n\n---\n\n## 3. PL/SQL em tempo de execução (compila, mas falha ao rodar)\n\n### 3.1 `ORA-02000: missing AS keyword` com `AT TIME ZONE`\n**Sintoma:** a página falha com \"Error during rendering of region\", `ora_sqlerrm: ORA-02000: missing AS keyword`, e o backtrace aponta para `PKG_HISTORICO_CARREIRA` (`fn_data_local`, chamada por `fn_hoje`). O package compila sem erro.\n\n**Causa:** em SQL dentro de PL/SQL, toda variável vira bind (`:B1`). O Oracle não aceita bind em `AT TIME ZONE`, então `cast(p_momento at time zone l_fuso as date)` só falha quando a linha executa. Tirar a conversão de dentro do `CAST` ou colocar parênteses **não resolve**.\n\n**Correção** (aplicada em `fn_data_local`): passar o fuso como literal em SQL dinâmico, validando o valor:\n```sql\nif l_fuso is null or not regexp_like(l_fuso, '^[A-Za-z0-9_/+:-]{1,64}$') then\n  l_fuso := c_fuso_padrao;\nend if;\nexecute immediate\n  'select cast(:momento at time zone ''' || l_fuso || ''' as date) from dual'\n  into l_data\n  using p_momento;\n```\n**Prevenção:**\n- Nunca use variável PL/SQL depois de `AT TIME ZONE`.\n- Sempre que concatenar um valor em SQL dinâmico, valide-o antes com `regexp_like` ou uma lista fixa. Isso impede injeção de SQL.\n- Teste funções de data isoladas antes de usar na página: `select pkg_historico_carreira.fn_hoje(1) from dual`.\n\n### 3.2 `ORA-01403: no data found` em `select … into`\n**Sintoma:** página de erro com `component.type: APEX_APPLICATION_PAGE_PROCESS` e o `select … into` no `error_statement`.\n\n**Causa:** um `select … into` sem tratamento de exceção não encontrou nenhuma linha. Na página 13, o processo \"Colaborador padrão\" procura o colaborador do usuário logado, e as contas da equipe (SARAHSILVA, EDUARDOMARINS, ALAIRTONROCHA) não têm cadastro em `COLABORADOR`.\n\n**Correção:** trate `no_data_found` e `too_many_rows` com uma mensagem clara:\n```sql\nbegin\n  if :P13_ID_COLABORADOR is null then\n    select id_colaborador\n      into :P13_ID_COLABORADOR\n      from colaborador\n     where upper(trim(login_apex)) = upper(trim(:APP_USER))\n       and id_empresa = :G_ID_EMPRESA;\n  end if;\nexception\n  when no_data_found or too_many_rows then\n    raise_application_error(-20012,\n      'Sua conta não está vinculada a um colaborador desta empresa. Fale com o RH.');\nend;\n```\n**Prevenção:** todo `select … into` em processo de página precisa de `exception`. Use códigos do módulo (-20001 a -20099) para que `fn_tratar_erro` mostre a mensagem sem \"ORA-\".\n\n---\n\n### 3.3 Carga inicial \"com sucesso\" que não cria nada\n**Sintoma:** `06_carga_inicial.sql` termina sem erro no **SQL Workshop**, mas nenhum colaborador ganha a `ADMISSAO`. A conferência no fim do script lista todos.\n\n**Causa:** o SQL Workshop roda dentro de uma sessão APEX (`sys_context('APEX$SESSION', 'APP_SESSION')` não é nulo). O package entende que está no app e exige `G_ID_EMPRESA`, que não existe nessa sessão: cada colaborador falha com \"Sua sessão não está vinculada a uma empresa\". O script captura o erro por colaborador e segue, e o resumo sai por `dbms_output`, que o SQL Scripts não mostra.\n\n**Correção:** rode o script fora do APEX, no SQLcl ou no SQL Developer (desktop ou extensão do VS Code), conectado como `WKSP_CORLIXHUB`. O script é reexecutável.\n\nNo Autonomous o schema do workspace costuma não ter login; conectado como `ADMIN`, o script dá `ORA-00942: table or view \"ADMIN\".\"COLABORADOR\" does not exist`. Aponte a sessão para o schema antes: `alter session set current_schema = WKSP_CORLIXHUB;` e depois `@06_carga_inicial.sql`. Nesse caso `USR_EFETIVACAO` das admissões fica `ADMIN`.\n\n**Prevenção:** scripts de carga e manutenção do módulo vão no SQLcl/SQL Developer. No SQL Workshop, só consultas.\n\n## 4. APEX: configuração de páginas\n\n### 4.1 \"Access denied by Page security check\"\n**Sintoma:** `apex_error_code: ACCESS_DENIED_SIMPLE`, `component.type: APEX_APPLICATION_AUTHORIZATION`, `component.name: COLABORADOR`.\n\n**Causas, da mais comum para a menos comum:**\n1. **Resultado guardado na sessão.** Os esquemas estão com *Evaluation Point: Once per session*. Se o papel foi atribuído, ou o esquema foi criado ou alterado, depois do login, a sessão continua com o resultado antigo. → **Saia e entre de novo.** Um refresh da página não basta.\n2. **O usuário não atende ao esquema.** O `COLABORADOR` exige o papel Admin RH **ou** um cadastro em `COLABORADOR` na empresa (`G_ID_EMPRESA`).\n3. **O esquema foi criado com o tipo errado** (ex.: *Is In Role or Group* com o nome `COLABORADOR`, papel que não existe). O certo é *PL/SQL Function Returning Boolean*, com o código da etapa 1.2 do `Etapas-historico-carreira.md`.\n\n**Diagnóstico:**\n```sql\nselect role_name from apex_appl_acl_user_roles\n where application_id = 100 and user_name = 'LOGIN'\n```\n```sql\nselect id_colaborador, id_empresa from colaborador where upper(trim(login_apex)) = 'LOGIN'\n```\n\n### 4.2 Conta sem cadastro de colaborador: o módulo inteiro falha\nSem linha em `COLABORADOR`, o login não preenche `G_ID_EMPRESA`. Com isso, o package recusa tudo com `-20012`, e as queries filtradas por `:G_ID_EMPRESA` voltam vazias. Passar o ID do colaborador na URL **não resolve**.\n\n**Para testar com acesso de RH:** cadastre um usuário pela **P14** com um cargo que dê Admin RH (empresa 1: cargo 202 \"Gerente de Recursos Humanos\" ou 204 \"Analista de Recursos Humanos\"). Depois registre a admissão no histórico, porque a P14 ainda não chama o módulo:\n```sql\nbegin pkg_historico_carreira.registrar_admissao_automatica(<ID>, false); end;\n```\nSaia e entre com o usuário novo.\n\n### 4.3 A correção no Builder \"não pegou\": processo duplicado\n**Sintoma:** você alterou o código de um processo, mas o erro continua igual. No export aparecem dois processos com o mesmo nome (`colaborador-padrão` e `colaborador-padrão_1`).\n\n**Causa:** em vez de editar o processo existente, foi criado um novo. O novo ficou sem *Point* (caiu em *Processing*, depois do submit) e nunca roda ao abrir a página. O antigo continua rodando em *Before Header*.\n\n**Correção:** apague o processo novo e edite o código do original (*Rendering › Pre-Rendering › Before Header*).\n\n**Prevenção:** depois de salvar, confira no export que existe **um** processo com aquele nome e que ele tem `point: beforeHeader`.\n\n### 4.4 Dynamic Action de Refresh que não atualiza nada\n**Sintoma:** a DA dispara, mas as regiões não recarregam.\n\n**Causa:** em *Affected Elements*, a ação Refresh apontava para o **item** `P13_ID_COLABORADOR` (`selectionType: items`) em vez da **região**.\n\n**Correção:** *Selection Type* = **Region**, e escolha a região. No export:\n```\naffectedElements {\n    selectionType: region\n    region: @historico_carreira\n}\n```\n**Prevenção:** para o refresh funcionar, a região também precisa de *Page Items to Submit* com os itens que a fonte usa (ex.: `P13_ID_COLABORADOR`). Senão ela recarrega sem o valor e volta vazia.\n\n### 4.5 Links e botões para páginas que ainda não existem\nO guia monta a página 13 antes das páginas 18 e 19. O botão \"Nova movimentação\", o ícone de editar e o botão \"Formações\" dão erro até essas páginas existirem. Isso é esperado. Termine-os depois das etapas 3 e 4. Pelo mesmo motivo, as constantes `c_pagina_*` de `08_pkg_historico_carreira_ui.sql` só devem apontar para páginas que já existem com o item indicado (`c_pagina_organograma` = 3 com `P3_ID_FOCO` já funciona; `c_pagina_solicitacao` vem com 22 e só funciona depois que a página 22 existir; antes disso, mude para `null`).\n\n**`ERR-1002 Unable to find item ID for item \"P22_ID_COLABORADOR\" in application \"100\"`:** aparece na página 13 quando o usuário abre o **próprio** histórico. O package monta o link \"Solicitar correção\" com `apex_page.get_url`, que precisa achar o item na página de destino para gerar o checksum. Enquanto a página 22 (§6 do guia) não existir, mude `c_pagina_solicitacao` para `null` em `08_pkg_historico_carreira_ui.sql` e rode o arquivo de novo: o link some. Depois de criar a página 22 com o item `P22_ID_COLABORADOR`, volte para `22` (o valor do repositório) e rode de novo. Vale para qualquer constante `c_item_*`: o item precisa existir na página indicada.\n\n### 4.6 Sintaxe de valores em links\n| Sintaxe | Significa |\n|---|---|\n| `#COLUNA#` | Valor da coluna **naquela linha** do relatório |\n| `&ITEM.` | Valor de um item da página, igual para todas as linhas. O **ponto final é obrigatório** |\n| `:ITEM` | Bind, só dentro de SQL e PL/SQL |\n\n### 4.7 `ORA-20999: Wrong number of columns selected in the SQL query`\n**Sintoma:** ao salvar um item no Builder (ex.: `P18_NM_CARGO_ANTERIOR`), aparece o erro com a query de uma coluna só (`select cg.nome from …`).\n\n**Causa:** a query foi colada num atributo que espera **duas colunas** (valor exibido e valor de retorno): *List of Values › SQL Query*, ou um Display Only com *Based On: Display Value of List of Values*. Uma query de uma coluna só serve em *Default*, *Source* ou *Set Value*.\n\n**Correção:** deixe *List of Values* vazio, coloque *Settings › Based On* = **Page Item Value** e cole a query em **Default › Type: SQL Query**. Se o lugar certo for mesmo uma LOV, devolva duas colunas: `select nome d, id_cargo r from …`.\n\n**Prevenção:** antes de colar SQL, confira o nome do atributo. LOV = 2 colunas (`d`, `r`); Default/Source \"SQL Query\" = 1 coluna e 1 linha.\n\n---\n\n### 4.8 Região de Form ou Interactive Grid sem edição (APEX 26.1.5)\n**Sintoma:** num Form, os campos não aceitam digitação ao abrir um registro existente (ex.: \"Motivo do estorno\" na p18). Num Interactive Grid, não há como ligar a edição: o painel de propriedades do 26.1.5 não tem a aba \"Attributes\", nem nó \"Attributes\" na árvore, nem seção \"Edit\".\n\n**Causa (observada nos exports, não conferida na tela):** a edição fica no bloco `edit { enabled: true allowedOperations: [...] }` da região. Nos exports do app esse bloco só aparece em regiões criadas pelo **assistente de criação de página** (p16 Empresas, p27 Nova Equipe). Regiões criadas ou montadas depois, sem ele, ficam só leitura (p18 Movimentação, p19 Formações) e o Builder não oferece onde ligar.\n\n**Correção:**\n- Precisa de edição? Crie a região pelo assistente (*Create Page › Form*, ou lista + formulário) e confira no export que o bloco `edit` veio.\n- Para cadastro em lista, use o padrão **lista (Interactive Report) + formulário em modal**, como p15/p16 e p13/p18, em vez de Interactive Grid editável.\n- Item que não é coluna da tabela/view (ex.: `P18_DS_MOTIVO_ESTORNO`) pode ficar numa região Static Content separada, fora do Form.\n\n**Prevenção:** depois de criar uma região editável, procure `edit {` no export APEXlang da página. Sem ele, a região é só leitura.\n\n### 4.9 Select list de departamento vazia em \"Emitir novo comunicado\" (p17)\n**Sintoma:** no modal \"Emitir novo comunicado\" (página 17), o select **Departamento** abre sem nenhuma opção. Ao publicar, o comunicado pode falhar por `ID_EMPRESA` ou `ID_AUTOR` nulos.\n\n**Causa:** a LOV de `P17_ID_DEPARTAMENTO` e os defaults de `P17_ID_EMPRESA` e `P17_ID_AUTOR` procuram o colaborador com `login_apex = :APP_USER`, sem `upper`/`trim`. O `APP_USER` vem em maiúsculas; se o `LOGIN_APEX` foi gravado em minúsculas ou com espaço, nada bate. O processo `SET_G_ID_EMPRESA` compara com `upper(trim(...))`, por isso o resto da app funciona para a mesma conta. Conta sem colaborador (4.2) também cai aqui: não há empresa para filtrar.\n\n**Diagnóstico** (SQL Commands, troque o login):\n```sql\nselect id_colaborador, id_empresa, '[' || login_apex || ']' as login_gravado\n  from colaborador\n where upper(trim(login_apex)) = upper(trim('LOGIN_DA_CONTA'))\n```\nNenhuma linha: conta sem colaborador (4.2). Linha com `login_gravado` diferente de maiúsculas sem espaço: é esta causa.\n\n**Correção no Builder (página 17):**\n- `P17_ID_DEPARTAMENTO`: *List of Values › Type* **Shared Component**, *List of Values* **LOV_DEPARTAMENTO_EMPRESA** (a LOV compartilhada já filtra por `:G_ID_EMPRESA`). Ligue *Display Null Value* e use *Null Display Value* `Todos (empresa inteira)`: departamento nulo é o comunicado para todos, e a Home mostra \"Para: Todos\".\n- `P17_ID_EMPRESA`: *Default › Type* **Item**, valor `G_ID_EMPRESA`.\n- `P17_ID_AUTOR`: *Default › SQL Query* `select id_colaborador from colaborador where upper(trim(login_apex)) = upper(trim(:APP_USER)) and id_empresa = :G_ID_EMPRESA`.\n\n**No export da página 17**, depois da correção: em `P17_ID_DEPARTAMENTO`, `lov { type: sharedComponent  lov: @lov-departamento-empresa  nullDisplayValue: Todos (empresa inteira) }` (o `displayNullValue` só aparece quando está **desligado**); em `P17_ID_EMPRESA`, `default { type: item  item: G_ID_EMPRESA }` (como na p41); em `P17_ID_AUTOR`, o default com `upper(trim(login_apex))` e `:G_ID_EMPRESA`.\n\n**Situação:** correção aplicada na página 17 em 10/11/2026 e conferida no export colado pelo time (os três itens batem com o esperado). Falta o teste de publicar com uma conta com colaborador vinculado.\n\n**Prevenção:** filtre por empresa com `:G_ID_EMPRESA` (regra S5 do `11`) e, quando precisar achar o colaborador pelo login, compare sempre `upper(trim(login_apex)) = upper(trim(:APP_USER))` (`02` §8, item 10).\n\n## 5. Checklist antes de entregar SQL/PL/SQL\n\n- [ ] Nenhum `unistr()` em SQL sem `to_char` (2.1).\n- [ ] Spec e body em arquivos separados, cada um terminando com `/`, e registrados nessa ordem no `instalar.sql` (2.2).\n- [ ] Nenhuma função privada chamada dentro de `select`/`insert`/`update`/`delete`/`merge` (2.4).\n- [ ] Nenhuma variável depois de `AT TIME ZONE`. Em SQL dinâmico, todo valor concatenado é validado (3.1).\n- [ ] Todo `select … into` em processo ou função tem `exception when no_data_found` (3.2).\n- [ ] Comandos SQL terminam com `;` e blocos PL/SQL com `/` sozinho na linha. Nunca `;` seguido de `/` num comando SQL simples, porque ele executa duas vezes.\n- [ ] `set define off` no início do script, porque `&` em HTML e URLs vira variável de substituição.\n- [ ] Depois de compilar: `user_errors` vazio para o objeto e nenhum objeto `INVALID` do módulo.\n- [ ] Funções novas testadas isoladamente no SQL Commands antes de usar na página.\n- [ ] No APEX: depois de mudar papéis ou authorization schemes, **sair e entrar de novo** antes de testar (4.1).\n"}, {"arquivo": "10-erro-400-cookies.md", "titulo": "10 · Cookies e sessão no APEX (OCI): erro 400 e logout inesperado", "md": "# 10 · Cookies e sessão no APEX (OCI): erro 400 e logout inesperado\n\n> Parte do pacote de contexto para IAs (`docs/ai-context/`). Comece pelo [`README.md`](./README.md) desta pasta.\n> Escrito em 09/10/2026. Ambiente: APEX 26.1 no **Autonomous Database da OCI** (URL `https://<id>.adb.<região>.oraclecloudapps.com/ords/...`).\n\n## 1. Sintoma\n\nDepois de muito tempo desenvolvendo (Builder + app rodando), qualquer página do host do Autonomous passa a responder com uma página branca:\n\n```\n400 Bad Request\nRequest Header Or Cookie Too Large\n```\n\nSó volta a funcionar depois de limpar os cookies. Como limpar o navegador inteiro derruba todos os outros logins, o trabalho para.\n\n## 2. Por que acontece\n\n- O navegador envia **todos os cookies do host** (e de todos os `Path` que casam com a URL) no cabeçalho `Cookie` de **cada** requisição.\n- No Autonomous, o mesmo host serve o **Builder do APEX**, a **app em execução**, o **Database Actions** (SQL Developer Web) e os **REST do ORDS**. Os cookies de todos eles se somam no mesmo cabeçalho.\n- Na frente do ORDS do Autonomous há um proxy gerenciado pela Oracle. A mensagem `Request Header Or Cookie Too Large` é a página padrão do **nginx** quando o cabeçalho passa do buffer configurado (no nginx o padrão é `large_client_header_buffers 4 8k`; o valor usado pela Oracle não é público).\n- **Não dá para aumentar esse limite** no endpoint padrão do Autonomous, porque o proxy não é nosso. A solução fica do lado do navegador: não deixar cookies se acumularem nesse host.\n- **A app Corlix Hub não cria cookies próprios.** Em `corlixhub/` o único uso é o padrão da página de login (p9999): `apex_authentication.send_login_username_cookie` e `get_login_username_cookie` (\"lembrar usuário\"), um cookie pequeno e único. A autenticação usa o cookie de sessão padrão do esquema `oracle-apex-accounts`, sem nome ou path customizado (`application.apx`). O acúmulo vem do uso do host ao longo do dia (Builder, execuções, Database Actions, sessões expiradas), e não do código da app.\n\n> ⚠️ **Ainda falta confirmar qual cookie cresce.** Faça o diagnóstico da §3 na próxima vez que o erro estiver perto de acontecer e preencha a §6.\n\n## 3. Diagnóstico (5 minutos, uma vez)\n\nOs cookies de sessão do APEX são `HttpOnly`, então `document.cookie` no console **não** mostra todos. Use o painel do DevTools:\n\n1. Com o APEX aberto no Chrome, abra o DevTools (`Cmd+Option+I`) e vá em **Application → Storage → Cookies → `https://<id>.adb.<região>.oraclecloudapps.com`**.\n2. Ordene pela coluna **Size** (decrescente) e observe as colunas **Name**, **Path** e **Expires**.\n3. Procure um destes padrões:\n   - **Muitos cookies com o mesmo prefixo e sufixos diferentes** (um por sessão, workspace ou instância) → acúmulo por nome.\n   - **O mesmo nome repetido com `Path` diferentes** (`/ords/`, `/ords/r/...`, `/ords/sql-developer`…) → acúmulo por path. Todas as cópias vão juntas no cabeçalho.\n   - **Um único cookie muito grande** → algo grava estado no cookie.\n4. Para medir o tamanho total: aba **Network**, clique numa requisição do APEX → **Headers → Request Headers → Cookie**. Se o valor passar de alguns KB, o erro está perto.\n5. Tire um print do painel de cookies e anexe aqui (§6) ou mande para o time.\n\n## 4. Alívio rápido: limpar só o host do Autonomous (≈10 s)\n\nNão limpe o navegador inteiro. Apague só os dados do host do Autonomous:\n\n- **Pelo DevTools (mais rápido quando o erro já apareceu):** na própria página do erro, `Cmd+Option+I` → **Application → Storage → Clear site data** → recarregue (`Cmd+R`). Isso apaga só os dados desse host. Você sai do Builder e da app, mas continua logado no resto (GitHub, OCI Console, e-mail…).\n- **Pelo ícone de informações do site** (à esquerda da URL) → *Cookies e dados do site* → apagar os dados desse site. O nome exato do menu muda entre versões do Chrome.\n- **Cirúrgico:** em **Application → Cookies**, selecione só os cookies antigos ou duplicados encontrados na §3 e apague com `Delete`. Assim você mantém a sessão atual.\n\n## 5. Prevenção (para o erro não voltar)\n\nEm ordem de custo:\n\n1. **Perfil do Chrome só para o APEX/OCI** (*Perfil → Adicionar*). Assim o OCI Console, o Database Actions e outras abas ficam separados do Builder, e limpar tudo nesse perfil não afeta o resto.\n2. **Limpar os dados do host ao fechar o navegador:** em `chrome://settings/content/siteData`, adicione `[*.]oraclecloudapps.com` à lista de sites que **sempre limpam os dados ao fechar todas as janelas**. Cada dia começa com zero cookies nesse host. Desvantagem: é preciso fazer login de novo depois de reabrir o Chrome.\n3. **Database Actions em outro perfil ou numa janela anônima.** Ele usa o mesmo host e soma cookies aos do Builder. Abra-o fora do perfil de desenvolvimento.\n4. **Sair (logout) do Builder e da app** em vez de só fechar a aba no fim do dia. Fazer logout apaga a sessão; sessões que só expiram podem deixar cookies para trás.\n5. **Extensão de cookies** (ex.: *Cookie-Editor*), se o diagnóstico mostrar um padrão de nome claro: ela apaga só aquele padrão em um clique, sem mexer na sessão atual.\n6. **Só se nada disso bastar:** ORDS gerenciado pelo cliente (*customer-managed ORDS*) ou URL própria (*vanity URL*) com um load balancer da OCI na frente. Nesse caso o limite de cabeçalho passa a ser configurável por nós (no ORDS standalone/Jetty, ver nota MOS 2894799.1). Para o tamanho do projeto, é infraestrutura demais. Não faça isso sem falar com o time.\n\n## 6. Causa confirmada (preencher após o diagnóstico)\n\n| Data | Cookie(s) que crescem | Padrão (nome / path / tamanho) | Origem provável | Ação adotada |\n|---|---|---|---|---|\n| _pendente_ | | | | |\n\n## 7. Caso parecido no Jenkins local (não é o mesmo problema)\n\nO Jenkins do backup (`scripts/backup/jenkins/`, `http://localhost:8080`) tem um problema conhecido parecido: a cada reinício ele cria um cookie de sessão com nome novo (`JSESSIONID.<hash>`), e os cookies antigos se acumulam no `localhost` ([JENKINS-25046](https://issues.jenkins.io/browse/JENKINS-25046)). Isso **não afeta o APEX na OCI**, porque o host é outro. Se o Jenkins começar a responder 400, 413 ou 431, apague os cookies de `localhost` (§4) ou faça logout no Jenkins: desde a versão 2.184, o logout remove os cookies de sessão obsoletos. Atenção: cookies não são separados por porta, então tudo o que roda em `localhost` (Jenkins, um APEX em Docker na 8081, o servidor interno da IDE) compartilha o mesmo cabeçalho `Cookie`.\n\n## 8. A sessão do Builder cai \"do nada\" e pede o workspace de novo\n\n### 8.1 Sintoma\nNo meio do trabalho, o Builder (ou a app) volta para a tela de login. Além da senha, é preciso **informar o workspace de novo**.\n\n### 8.2 Causas possíveis, da mais para a menos provável\n\n| # | Causa | Como reconhecer |\n|---|---|---|\n| 1 | **Os cookies foram perdidos** (é o mesmo problema da §2). O Chrome tem limite de cookies por domínio e, quando ele estoura, descarta os mais antigos. Os cookies de sessão do Builder e o que lembra o workspace podem estar entre eles. | O workspace e o usuário **não** vêm preenchidos no login. Acontece perto dos episódios de erro 400 ou depois de uma limpeza (§4 ou §5.2). |\n| 2 | **Tempo de inatividade** (`MAX_SESSION_IDLE_SEC`, padrão do APEX de 1 h). | Acontece quando você volta de uma pausa ou depois de ficar muito tempo numa aba sem salvar nem navegar. |\n| 3 | **Duração máxima da sessão** (`MAX_SESSION_LENGTH_SEC`, padrão do APEX de 8 h). | Acontece depois de várias horas, mesmo com uso contínuo. |\n| 4 | **Limpeza que você mesma fez**: o *Clear site data* da §4 e o \"limpar ao fechar\" da §5.2 também apagam a sessão e a lembrança do workspace. | É o comportamento esperado depois dessas ações. |\n\nA app Corlix Hub não define timeout próprio (não há nada sobre sessão em `corlixhub/application.apx`), então vale o que estiver configurado no workspace ou na instância.\n\n### 8.3 Diagnóstico\n1. Rode o bloco 1 de [`scripts/apex-sessao-timeouts.sql`](../../scripts/apex-sessao-timeouts.sql) como `ADMIN` (Database Actions → SQL). Valor nulo significa que vale o nível de cima e, no fim, o padrão do APEX (1 h / 8 h).\n2. Quando a sessão cair, anote: o horário, há quanto tempo estava parada, há quanto tempo tinha feito login e se o workspace veio preenchido. Abra também **DevTools → Application → Cookies** e veja quantos cookies o host tem.\n3. Compare com a tabela da §8.2: queda depois de pausa = inatividade; queda depois de ~8 h = duração máxima; workspace em branco e muitos cookies = perda de cookies.\n\n### 8.4 Correção\n- **Perda de cookies:** é a mesma correção das §4–5. Mantenha o host do Autonomous enxuto (perfil dedicado, Database Actions fora dele, logout no fim do dia).\n- **Timeout:** aumente os valores **só no workspace** com o bloco 2 do script (sugestão para desenvolvimento: 4 h de inatividade e 12 h de duração). Isso vale para o Builder e para as apps do workspace sem timeout próprio, e não mexe na instância.\n  - ⚠️ Sessão mais longa é menos segura. Antes de publicar a app para usuários reais, defina um timeout próprio na app (atributos de segurança da aplicação), para não herdar os valores generosos de desenvolvimento.\n- Registre o que foi encontrado na tabela da §6.\n\n## 9. Automação: extensão do Chrome e script de timeouts\n\nNão há como resolver o erro 400 dentro da app ou do APEX: o nginx da Oracle recusa a requisição **antes** de ela chegar ao ORDS, então nenhum processo PL/SQL, página ou handler REST chega a rodar. Quem controla os cookies (inclusive os `HttpOnly`) é o navegador. Por isso a automação tem duas partes:\n\n| Problema | Ferramenta | O que automatiza |\n|---|---|---|\n| Erro 400 por cookies | [`scripts/extensao-cookies-apex/`](../../scripts/extensao-cookies-apex/README.md) (extensão local do Chrome) | Medidor no ícone; ao dar 400, limpa só o host e recarrega; limpeza preventiva por regex; relatório para a §6. |\n| Logout por perda de cookie | Mesma extensão | Registra os cookies descartados pelo Chrome (`evicted`) e protege, por regex (\"nunca apagar\"), o cookie que lembra o workspace. |\n| Logout por timeout | [`scripts/apex-sessao-timeouts.sql`](../../scripts/apex-sessao-timeouts.sql) | Lê os timeouts e, opcionalmente, aumenta os do workspace (§8.4). É configuração de uma vez, não precisa de módulo. |\n\nA lógica da extensão foi testada com uma API `chrome` simulada no Node (medição, limpeza no 400 com proteção contra loop, regras por regex e registro de descartes). Ela **ainda não foi carregada num Chrome de verdade**: na primeira vez, confira se o ícone mostra o tamanho do cabeçalho numa aba do Autonomous.\n"}, {"arquivo": "11-padroes-de-paginas.md", "titulo": "11 · Padrões de páginas", "md": "# 11 · Padrões de páginas\n\n> **Obrigatório para criar, redesenhar ou corrigir qualquer página.** Levantado em 09/11/2026 nos exports da `DEV` (`7f902ab`). Detalha a regra 14 do [08](./08-convencoes-e-pegadinhas.md).\n\n## 1. Princípio\n\n**O padrão existente é a decisão padrão.** Mudar pode piorar as coisas: a página nova passa a se comportar diferente das outras, e o próximo agente passa a copiar a diferença. Quem quer seguir o padrão não precisa justificar nada. Quem quer sair dele segue o §5.\n\nSe uma situação não estiver coberta aqui, não invente: procure a página mais parecida na ordem do §2 e siga o que ela faz. Se nenhuma servir, pergunte ao time.\n\n## 2. Qual página copiar\n\nQuando as páginas divergirem entre si, vale esta ordem:\n\n| Tipo de tela | Referência | Arquivos |\n|---|---|---|\n| Página personalizada | Holerite (p. 9) | `modulos/holerite/`, `p00009-holerite-digital.apx` |\n| Página com colunas, abas e diálogos | Ponto (p. 30) | `modulos/ponto-eletronico/`, `p00030-ponto-eletronico.apx` |\n| Resultados com busca | Busca (p. 29) | `modulos/busca/`, `p00029-busca.apx` |\n| Modal com formulário | Solicitar ajuste (p. 31) | `p00031-solicitar-ajuste.apx` |\n| Relatório operacional | Ajustes de ponto (p. 32) | `p00032-ajustes-de-ponto.apx` |\n| Lista com facetas | Colaboradores (p. 12), **ainda não validada** | Só para a composição Faceted Search + Classic Report; veja o §6 |\n\nAntes de copiar, confira a referência na `DEV` atualizada: o export é a fonte de verdade, não a memória nem um guia antigo.\n\n## 3. Regras\n\n### Estrutura\n\n| # | Regra | Valor |\n|---|---|---|\n| E1 | Template da página normal | `Corlix - Standard Page` (`@corlix-standard-page`) |\n| E2 | Modal | Page Mode `Modal Dialog`, template `Modal Dialog`; botões numa região `Buttons Container` em `Dialog Footer` |\n| E3 | Cabeçalho | Região Dynamic Content em `Breadcrumb Bar`, template `Blank with Attributes (No Grid)`, chamando `pkg_<modulo>_ui.render_cabecalho` |\n| E4 | Classes do cabeçalho | `cx-cabecalho-pagina`, com `__titulo`, `__descricao`, `__trilha`; botões em `--acoes` e `__acoes` |\n| E5 | Corpo personalizado | Dynamic Content em `Body`, template `Blank with Attributes` (ou No Grid), chamando `render_*` |\n| E6 | Diálogo na própria página | Slot `Dialogs, Drawers and Popups`, template `Inline Dialog` |\n| E7 | Colunas de layout | Regiões `Blank with Attributes` com sub-regiões, como no Ponto |\n\n### Componente\n\n| Necessidade | Use | Exemplo |\n|---|---|---|\n| Layout do protótipo que não cabe no Universal Theme | Dynamic Content + package | Holerite, Ponto |\n| Lista com filtros laterais | Faceted Search + Classic Report nativos | Colaboradores |\n| Relatório de trabalho para RH ou gestão | Interactive Report | Ajustes de ponto, Dashboard RH |\n| Cartões simples vindos de SQL | Cards nativo | Comunicados da Home |\n| Entrada de dados | Form nativo, itens `Required/Optional Floating` | p. 31 |\n\nNão troque um componente nativo filtrável por HTML gerado: as facetas dependem da fonte SQL da região.\n\n### Package de UI\n\n| # | Regra |\n|---|---|\n| P1 | HTML personalizado fica em `pkg_<modulo>_ui`. A região só faz a chamada: `return pkg_x_ui.render_y(:Pn_ITEM);` |\n| P2 | Funções `render_*` retornam CLOB. Ações Ajax são procedures `ajax_*` no mesmo package |\n| P3 | Base do corpo: `g_html`, `inicia`, `p(texto)`, `e()` = `apex_escape.html`, `a()` = `apex_escape.html_attribute` |\n| P4 | Regra de negócio e acesso a dados ficam em `pkg_<modulo>`, separados da apresentação |\n| P5 | Links sempre por `apex_page.get_url`, passados por `a()` |\n| P6 | Nomes de mês e formatos numéricos explícitos: o idioma técnico da app é `en` |\n\n### Ícones\n\n| Onde | Como |\n|---|---|\n| HTML gerado por package | SVG Lucide em linha, `currentColor`, `aria-hidden=\"true\"`, por uma função `icone()` |\n| Componente nativo ou botão com classe do tema | Classe `fa-*`, mapeada para Lucide pelo tema |\n\n### CSS e JavaScript\n\n| # | Regra |\n|---|---|\n| C1 | **Sem CSS Inline** de página ou região e sem atributo `style`, mesmo em teste |\n| C2 | Use os tokens `--cx-*`; não fixe cor nova |\n| C3 | Página nova: `#APP_FILES#<modulo>#MIN#.css`, com `.css` e `.min.css` juntos. Não mova arquivos que já existem |\n| C4 | Regras do módulo com prefixo próprio, por exemplo `.cx-hol-` |\n| C5 | JS em `modulos/<nome>/<nome>-pagina.js`, colado em **Execute when Page Loads**, com eventos delegados por `data-*` |\n| C6 | Ajax por `apex.server.process` com `x01`, respondido por Ajax Callback que chama `ajax_*` |\n\n### Segurança\n\n| # | Regra |\n|---|---|\n| S1 | Toda página tem `Authorization Scheme` na própria página, e o menu usa o mesmo esquema |\n| S2 | `Page Access Protection` = `Arguments Must Have Checksum`, exceto com justificativa no guia, como a Busca recebendo o termo pela URL |\n| S3 | Reutilize esquemas existentes (`COLABORADOR`, `ADMIN_RH`, `GESTOR`, `SOMENTE_DIRETORIA`, `EQUIPE_CORLIX_HUB`). Novo esquema, só compondo os existentes com `apex_authorization.is_authorized` |\n| S4 | Separe três permissões: ver a página, executar a ação e abrir o destino. Não mostre link para destino que a pessoa não pode abrir |\n| S5 | Todo dado de negócio filtra por `id_empresa`. **Empresa nula nunca libera tudo**: sem empresa, nenhuma linha |\n| S6 | Em relatório com `Escape Special Characters = No`, use filtros explícitos: `!HTML` em texto, `!ATTR` em atributo e `!RAW` só em fragmento fixo gerado pela view |\n\n### Banco e fotos\n\n| # | Regra |\n|---|---|\n| B1 | Módulo em `modulos/<nome>/`: SQL numerado, `instalar.sql`, CSS, JS e `Etapas-<nome>.md` |\n| B2 | Foto de colaborador: `apex_page.get_url(p_page => 44, p_x01 => <arquivo>)`, tratando valor vazio e o legado `#APP_FILES#Fotos Colaboradores/`; sem foto, iniciais |\n\n### Guia e entrega\n\n| # | Regra |\n|---|---|\n| G1 | O guia tem a seção **Referências reutilizadas**, indicando o que veio de qual página |\n| G2 | Caminho do Builder não conferido vai marcado \"(confirmar no 26.1.5)\"; se não existir, peça print |\n| G3 | Confira no template e no export se a posição existe antes de indicá-la. Template do tema pode não 3 |\n| p. 14 | Cabeçalho com HTML na própria região | P1 |\n| p. 30 | CSS sem `#MIN#` e em pasta própria | C3 |\n| p. 12 | Arquivo em `modulos/colaboradores/` e CSS Inline ainda no export | C1, C3 |\n\nNão corrija essas páginas de passagem. Trocar o template de uma página pronta muda o layout e exige teste: faça em tarefa própria, com aprovação.\n"}];
const menu = document.getElementById('menu'), main = document.getElementById('conteudo'), q = document.getElementById('q');
const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
try { mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'}); } catch(e) {}

function render(i, ancora){
  const d = DOCS[i];
  let md = d.md.replace(/\]\(\.\/([0-9]{2}-[^)#]+\.md|README\.md)(#[^)]*)?\)/g, (m, f, h) => '](#' + f + (h || '') + ')');
  main.innerHTML = marked.parse(md);
  main.querySelectorAll('h2,h3').forEach(h => h.id = slug(h.textContent));
  main.querySelectorAll('pre code.language-mermaid').forEach(c => { const div = document.createElement('div'); div.className='mermaid'; div.textContent=c.textContent; c.parentElement.replaceWith(div); });
  try { mermaid.run({querySelector:'.mermaid'}); } catch(e) {}
  if (q.value.trim()) destacar(q.value.trim());
  montarMenu(i);
  if (ancora) { const el = document.getElementById(ancora); if (el) el.scrollIntoView(); } else scrollTo(0,0);
}
function montarMenu(atual){
  const termo = q.value.trim().toLowerCase();
  menu.innerHTML = '';
  DOCS.forEach((d, i) => {
    if (termo && !d.md.toLowerCase().includes(termo)) return;
    const a = document.createElement('a'); a.href = '#' + d.arquivo; a.textContent = d.titulo; if (i === atual) a.className = 'on'; menu.appendChild(a);
    if (i === atual) d.md.split('\n').filter(l => l.startsWith('## ')).forEach(l => {
      const t = l.slice(3).replace(/`/g,''); const s = document.createElement('a'); s.className='sub'; s.href = '#' + d.arquivo + '#' + slug(t); s.textContent = t; menu.appendChild(s);
    });
  });
}
function destacar(termo){
  const w = document.createTreeWalker(main, NodeFilter.SHOW_TEXT); const nos = []; let n;
  while ((n = w.nextNode())) if (n.nodeValue.toLowerCase().includes(termo.toLowerCase())) nos.push(n);
  nos.forEach(n => { const re = new RegExp('(' + termo.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'); const span = document.createElement('span'); span.innerHTML = n.nodeValue.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(re,'<mark>$1</mark>'); n.replaceWith(span); });
}
function rota(){
  const [arq, ancora] = decodeURIComponent(location.hash.slice(1)).split('#');
  const i = Math.max(0, DOCS.findIndex(d => d.arquivo === arq));
  render(i, ancora);
}
q.addEventListener('input', rota);
addEventListener('hashchange', rota);
rota();
</script>
